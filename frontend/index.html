// EMPLOYEES
// ═══════════════════════════════════════════════════════════
function EmployeesPage({ navigate }) {
    const [employees, setEmployees] = useState([]);
    const [showForm, setShowForm] = useState(false);
    const [editId, setEditId] = useState(null);
    const emptyEmp = {employee_code:'',first_name:'',last_name:'',role:'technician',email:'',phone:'',hourly_rate:'',flag_rate:'',hire_date:'',notes:'',is_active:1};
    const [form, setForm] = useState(emptyEmp);

    const load = () => api('/employees').then(setEmployees);
    useEffect(() => { load(); }, []);

    const openNew = () => { setEditId(null); setForm(emptyEmp); setShowForm(true); };
    const openEdit = (emp) => {
        setEditId(emp.id);
        setForm({
            employee_code: emp.employee_code||'', first_name: emp.first_name||'', last_name: emp.last_name||'',
            role: emp.role||'technician', email: emp.email||'', phone: emp.phone||'',
            hourly_rate: emp.hourly_rate||'', flag_rate: emp.flag_rate||'',
            hire_date: emp.hire_date||'', notes: emp.notes||'', is_active: emp.is_active != null ? emp.is_active : 1
        });
        setShowForm(true);
    };

    const save = async () => {
        const body = {...form};
        // Convert blank numeric fields to null (Pydantic rejects empty strings for floats)
        body.hourly_rate = (body.hourly_rate === '' || body.hourly_rate == null) ? null : parseFloat(body.hourly_rate);
        body.flag_rate   = (body.flag_rate   === '' || body.flag_rate   == null) ? null : parseFloat(body.flag_rate);
        // Convert blank optional strings to null
        ['email','phone','hire_date','notes','employee_code'].forEach(k => { if (body[k] === '') body[k] = null; });
        body.is_active = body.is_active ? 1 : 0;
        if (!body.employee_code) body.employee_code = (body.first_name[0]||'')+(body.last_name||'').toUpperCase().slice(0,3)+(Math.floor(Math.random()*90)+10);
        try {
            if (editId) await api(`/employees/${editId}`, { method: 'PUT', body });
            else await api('/employees', { method: 'POST', body });
            setShowForm(false); setEditId(null); setForm(emptyEmp); load();
        } catch (err) {
            alert('Failed to save employee: ' + (err.message || err));
        }
    };

    const deleteEmployee = async (emp, e) => {
        e.stopPropagation();
        const name = `${emp.first_name||''} ${emp.last_name||''}`.trim() || `#${emp.id}`;
        if (!confirm(`Delete employee "${name}"? This can't be undone.\n\nIf they have time cards or work history, the system will refuse — set them to Inactive instead.`)) return;
        try {
            await api(`/employees/${emp.id}`, { method: 'DELETE' });
            load();
        } catch (err) {
            alert(err.message || String(err));
        }
    };

    return (
        <div>
            <div className="page-header">
                <h2>Employees</h2>
                <button className="btn btn-primary" onClick={openNew}><i className="fas fa-plus"></i> New Employee</button>
            </div>
            <div className="card"><div className="table-wrapper">
                <table><thead><tr><th>Code</th><th>Name</th><th>Role</th><th>Hourly Rate</th><th>Flag Rate</th><th>Status</th><th style={{width:90}}></th></tr></thead>
                <tbody>{employees.map(e => (
                    <tr key={e.id} className="clickable" onClick={() => openEdit(e)}>
                        <td style={{fontWeight:600}}>{e.employee_code}</td>
                        <td>{e.first_name} {e.last_name}</td>
                        <td><Badge status={e.role}/></td>
                        <td className="money">{e.hourly_rate > 0 ? fmt(e.hourly_rate) : '—'}</td>
                        <td className="money">{e.flag_rate > 0 ? fmt(e.flag_rate) : '—'}</td>
                        <td>{e.is_active ? <span className="text-green">Active</span> : <span className="text-red">Inactive</span>}</td>
                        <td style={{textAlign:'right', whiteSpace:'nowrap'}}>
                            <button className="btn btn-outline btn-sm" onClick={(ev) => { ev.stopPropagation(); openEdit(e); }} title="Edit" style={{padding:'4px 8px', marginRight:4}}>
                                <i className="fas fa-edit"></i>
                            </button>
                            <button className="btn btn-outline btn-sm" onClick={(ev) => deleteEmployee(e, ev)} title="Delete"
                                    style={{padding:'4px 8px', color:'var(--danger)', borderColor:'var(--danger)'}}>
                                <i className="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                ))}
                {!employees.length && <tr><td colSpan="7" className="text-muted" style={{textAlign:'center',padding:32}}>No employees found</td></tr>}
                </tbody></table>
            </div></div>
            <Modal open={showForm} onClose={() => setShowForm(false)} title={editId ? 'Edit Employee' : 'New Employee'}>
                <div className="form-grid">
                    <div className="form-group"><label>First Name *</label><input value={form.first_name} onChange={e => setForm({...form, first_name: e.target.value})} /></div>
                    <div className="form-group"><label>Last Name *</label><input value={form.last_name} onChange={e => setForm({...form, last_name: e.target.value})} /></div>
                    <div className="form-group"><label>Employee Code</label><input value={form.employee_code} onChange={e => setForm({...form, employee_code: e.target.value})} placeholder="Auto-generated if blank" /></div>
                    <div className="form-group"><label>Role</label>
                        <select value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                            <option value="technician">Technician</option><option value="painter">Painter</option>
                            <option value="estimator">Estimator</option><option value="detailer">Detailer</option>
                            <option value="parts">Parts</option><option value="office">Office</option>
                            <option value="manager">Manager</option><option value="admin">Admin</option>
                        </select>
                    </div>
                    <div className="form-group"><label>Phone</label><input value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} /></div>
                    <div className="form-group"><label>Email</label><input value={form.email} onChange={e => setForm({...form, email: e.target.value})} /></div>
                    <div className="form-group"><label>Hourly Rate</label><input type="number" step="0.01" value={form.hourly_rate} onChange={e => setForm({...form, hourly_rate: e.target.value})} placeholder="0.00" /></div>
                    <div className="form-group"><label>Flag Rate</label><input type="number" step="0.01" value={form.flag_rate} onChange={e => setForm({...form, flag_rate: e.target.value})} placeholder="0.00" /></div>
                    <div className="form-group"><label>Hire Date</label><input type="date" value={form.hire_date} onChange={e => setForm({...form, hire_date: e.target.value})} /></div>
                    <div className="form-group"><label>Status</label>
                        <select value={form.is_active} onChange={e => setForm({...form, is_active: parseInt(e.target.value)})}>
                            <option value={1}>Active</option><option value={0}>Inactive</option>
                        </select>
                    </div>
                </div>
                <div className="form-group" style={{marginTop:12}}><label>Notes</label><textarea value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} /></div>
                <div className="modal-actions"><button className="btn btn-outline" onClick={() => setShowForm(false)}>Cancel</button><button className="btn btn-primary" onClick={save} disabled={!form.first_name||!form.last_name}><i className="fas fa-save"></i> {editId ? 'Update' : 'Save'}</button></div>
            </Modal>
        </div>
    );
}

// ═══════════════════════════════════════════════════════════
// USER LOGINS (admin-only)
// ═══════════════════════════════════════════════════════════
function UsersPage({ user: currentUser }) {
    const [users, setUsers] = useState([]);
    const [employees, setEmployees] = useState([]);
    const [showForm, setShowForm] = useState(false);
    const [editId, setEditId] = useState(null);
    const [pinResetId, setPinResetId] = useState(null);
    const [newPin, setNewPin] = useState('');
    const [newPin2, setNewPin2] = useState('');
    const [error, setError] = useState('');
    const emptyUser = {username:'', pin:'', display_name:'', role:'worker', employee_id:''};
    const [form, setForm] = useState(emptyUser);

    const load = () => {
        api('/auth/users').then(setUsers).catch(e => setError(e.message || String(e)));
        api('/employees').then(setEmployees).catch(() => setEmployees([]));
    };
    useEffect(() => { load(); }, []);

    const openNew = () => { setEditId(null); setForm(emptyUser); setError(''); setShowForm(true); };
    const openEdit = (u) => {
        setEditId(u.id);
        setForm({
            username: u.username || '',
            pin: '',
            display_name: u.display_name || '',
            role: u.role || 'worker',
            employee_id: u.employee_id || '',
            is_active: u.is_active != null ? u.is_active : 1,
        });
        setError('');
        setShowForm(true);
    };

    const save = async () => {
        setError('');
        try {
            if (editId) {
                if (form.role === 'worker' && !form.employee_id) {
                    return setError('Worker accounts must be linked to an employee — pick one under Linked Employee or change role to Office/Admin.');
                }
                const body = {
                    display_name: form.display_name || null,
                    role: form.role,
                    employee_id: form.employee_id ? parseInt(form.employee_id) : null,
                    is_active: form.is_active ? 1 : 0,
                };
                await api(`/auth/users/${editId}`, { method: 'PUT', body });
            } else {
                if (!form.username) return setError('Username is required');
                if (!form.pin || form.pin.length < 4) return setError('PIN must be at least 4 digits');
                if (form.role === 'worker' && !form.employee_id) {
                    return setError('Worker accounts must be linked to an employee — pick one under Linked Employee or change role to Office/Admin.');
                }
                const body = {
                    username: form.username.trim().toLowerCase(),
                    pin: form.pin,
                    display_name: form.display_name || form.username,
                    role: form.role,
                    employee_id: form.employee_id ? parseInt(form.employee_id) : null,
                };
                await api('/auth/users', { method: 'POST', body });
            }
            setShowForm(false); setEditId(null); setForm(emptyUser); load();
        } catch (err) {
            setError(err.message || String(err));
        }
    };

    const openResetPin = (u) => {
        setPinResetId(u.id);
        setNewPin(''); setNewPin2(''); setError('');
    };

    const deleteUser = async (u) => {
        if (!confirm(`Delete user "${u.display_name || u.username}"? This permanently removes the login.`)) return;
        try {
            await api(`/auth/users/${u.id}`, { method: 'DELETE' });
            load();
        } catch (err) {
            alert(err.message || String(err));
        }
    };

    const submitPinReset = async () => {
        setError('');
        if (!newPin || newPin.length < 4) return setError('PIN must be at least 4 digits');
        if (newPin !== newPin2) return setError('PINs do not match');
        try {
            await api(`/auth/users/${pinResetId}/reset-pin`, { method: 'POST', body: { pin: newPin } });
            setPinResetId(null); setNewPin(''); setNewPin2('');
            alert('PIN updated.');
        } catch (err) {
            setError(err.message || String(err));
        }
    };

    const targetUser = users.find(u => u.id === pinResetId);

    return (
        <div>
            <div className="page-header">
                <h2>User Logins</h2>
                <button className="btn btn-primary" onClick={openNew}><i className="fas fa-plus"></i> New User</button>
            </div>
            <div className="card" style={{padding: 16, marginBottom: 16, background: 'rgba(77,184,106,0.06)', borderLeft: '3px solid var(--primary)'}}>
                <div style={{fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.5}}>
                    <strong style={{color:'var(--text)'}}>How logins work:</strong> Workers (technicians, painters) tap their name on the touch login screen and enter a 4+ digit PIN.
                    Office and admin users sign in with username + PIN through the admin login. Linking a user to an employee record lets the system attribute time cards and work to the right person.
                </div>
            </div>
            <div className="card"><div className="table-wrapper">
                <table>
                    <thead><tr><th>Username</th><th>Display Name</th><th>Role</th><th>Linked Employee</th><th>Last Login</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                        {users.map(u => {
                            const emp = employees.find(e => e.id === u.employee_id);
                            return (
                                <tr key={u.id}>
                                    <td style={{fontWeight:600}}>{u.username}</td>
                                    <td>{u.display_name || '—'}</td>
                                    <td><Badge status={u.role}/></td>
                                    <td>{emp ? `${emp.first_name} ${emp.last_name}` : '—'}</td>
                                    <td className="text-sm text-muted">{u.last_login ? new Date(u.last_login).toLocaleString() : 'Never'}</td>
                                    <td>{u.is_active ? <span className="text-green">Active</span> : <span className="text-red">Disabled</span>}</td>
                                    <td style={{textAlign:'right', whiteSpace:'nowrap'}}>
                                        <button className="btn btn-outline btn-sm" onClick={() => openEdit(u)} style={{marginRight:6}} title="Edit">
                                            <i className="fas fa-edit"></i> Edit
                                        </button>
                                        <button className="btn btn-outline btn-sm" onClick={() => openResetPin(u)} style={{marginRight:6}} title="Reset PIN">
                                            <i className="fas fa-key"></i> PIN
                                        </button>
                                        <button className="btn btn-outline btn-sm" onClick={() => deleteUser(u)} title="Delete user"
                                                style={{color:'var(--danger)', borderColor:'var(--danger)', padding:'4px 8px'}}
                                                disabled={currentUser && u.id === currentUser.id}>
                                            <i className="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            );
                        })}
                        {!users.length && <tr><td colSpan="7" className="text-muted" style={{textAlign:'center',padding:32}}>No users yet</td></tr>}
                    </tbody>
                </table>
            </div></div>

            <Modal open={showForm} onClose={() => setShowForm(false)} title={editId ? 'Edit User' : 'New User Login'}>
                {error && <div style={{padding:10, background:'rgba(220,38,38,0.1)', border:'1px solid rgba(220,38,38,0.3)', borderRadius:6, color:'var(--danger)', marginBottom:12, fontSize:13}}>{error}</div>}
                <div className="form-grid">
                    <div className="form-group">
                        <label>Username *</label>
                        <input value={form.username}
                               onChange={e => setForm({...form, username: e.target.value})}
                               disabled={!!editId}
                               placeholder="lowercase, no spaces" />
                        {editId && <div className="text-sm text-muted" style={{marginTop:4}}>Username can't be changed.</div>}
                    </div>
                    <div className="form-group">
                        <label>Display Name</label>
                        <input value={form.display_name}
                               onChange={e => setForm({...form, display_name: e.target.value})}
                               placeholder="What appears on the login grid" />
                    </div>
                    {!editId && (
                        <div className="form-group">
                            <label>PIN * (4+ digits)</label>
                            <input type="password" inputMode="numeric" value={form.pin}
                                   onChange={e => setForm({...form, pin: e.target.value.replace(/\D/g,'')})}
                                   maxLength={8} placeholder="••••" />
                        </div>
                    )}
                    <div className="form-group">
                        <label>Role</label>
                        <select value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                            <option value="worker">Worker (touch login + TecStation)</option>
                            <option value="office">Office (full app, no user mgmt)</option>
                            <option value="admin">Admin (full access)</option>
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Linked Employee {form.role === 'worker' && <span style={{color:'var(--danger)'}}>*</span>}</label>
                        <select value={form.employee_id || ''} onChange={e => setForm({...form, employee_id: e.target.value})}>
                            <option value="">— None —</option>
                            {employees.filter(e => e.is_active).map(e => (
                                <option key={e.id} value={e.id}>{e.first_name} {e.last_name} ({e.employee_code})</option>
                            ))}
                        </select>
                        {form.role === 'worker' && (
                            <div className="text-muted" style={{fontSize:11, marginTop:4}}>
                                Required for workers — time cards are tracked against the employee record.
                            </div>
                        )}
                    </div>
                    {editId && (
                        <div className="form-group">
                            <label>Status</label>
                            <select value={form.is_active} onChange={e => setForm({...form, is_active: parseInt(e.target.value)})}>
                                <option value={1}>Active</option>
                                <option value={0}>Disabled (cannot login)</option>
                            </select>
                        </div>
                    )}
                </div>
                <div className="modal-actions">
                    <button className="btn btn-outline" onClick={() => setShowForm(false)}>Cancel</button>
                    <button className="btn btn-primary" onClick={save}>
                        <i className="fas fa-save"></i> {editId ? 'Update' : 'Create User'}
                    </button>
                </div>
            </Modal>

            <Modal open={!!pinResetId} onClose={() => setPinResetId(null)} title={`Reset PIN${targetUser ? ' for ' + (targetUser.display_name || targetUser.username) : ''}`}>
                {error && <div style={{padding:10, background:'rgba(220,38,38,0.1)', border:'1px solid rgba(220,38,38,0.3)', borderRadius:6, color:'var(--danger)', marginBottom:12, fontSize:13}}>{error}</div>}
                <div className="form-group">
                    <label>New PIN (4+ digits)</label>
                    <input type="password" inputMode="numeric" value={newPin}
                           onChange={e => setNewPin(e.target.value.replace(/\D/g,''))}
                           maxLength={8} placeholder="••••" autoFocus />
                </div>
                <div className="form-group" style={{marginTop:12}}>
                    <label>Confirm New PIN</label>
                    <input type="password" inputMode="numeric" value={newPin2}
                           onChange={e => setNewPin2(e.target.value.replace(/\D/g,''))}
                           maxLength={8} placeholder="••••" />
                </div>
                <div className="text-sm text-muted" style={{marginTop:8}}>
                    Tell the user their new PIN in person — it isn't emailed or shown again.
                </div>
                <div className="modal-actions">
                    <button className="btn btn-outline" onClick={() => setPinResetId(null)}>Cancel</button>
                    <button className="btn btn-primary" onClick={submitPinReset}>
                        <i className="fas fa-key"></i> Update PIN
                    </button>

}

// VENDORS
// ═══════════════════════════════════════════════════════════
function VendorsPage({ navigate }) {
    const [vendors, setVendors] = useState([]);
    const [search, setSearch] = useState('');
    const [showForm, setShowForm] = useState(false);
    const [editId, setEditId] = useState(null);
    const emptyVnd = {vendor_name:'',vendor_type:'parts',contact_name:'',phone:'',email:'',fax:'',address:'',city:'',state:'',zip_code:'',account_number:'',notes:''};
    const [form, setForm] = useState(emptyVnd);

    const load = () => api('/vendors' + (search ? `?search=${search}` : '')).then(setVendors);
    useEffect(() => { load(); }, [search]);

    const openNew = () => { setEditId(null); setForm(emptyVnd); setShowForm(true); };
    const openEdit = (vnd) => {
        setEditId(vnd.id);
        setForm({
            vendor_name: vnd.vendor_name||'', vendor_type: vnd.vendor_type||'parts',
            contact_name: vnd.contact_name||'', phone: vnd.phone||'', email: vnd.email||'',
            fax: vnd.fax||'', address: vnd.address||'', city: vnd.city||'',
            state: vnd.state||'', zip_code: vnd.zip_code||'',
            account_number: vnd.account_number||'', notes: vnd.notes||''
        });
        setShowForm(true);
    };

    const save = async () => {
        try {
            if (editId) await api(`/vendors/${editId}`, { method: 'PUT', body: form });
            else await api('/vendors', { method: 'POST', body: form });
            setShowForm(false); setEditId(null); setForm(emptyVnd); load();
        } catch (err) {
            alert('Failed to save vendor: ' + (err.message || err));
        }
    };

    const deleteVendor = async (vnd, e) => {
        e.stopPropagation();
        if (!confirm(`Delete vendor "${vnd.vendor_name}"? This can't be undone.`)) return;
        try {
            await api(`/vendors/${vnd.id}`, { method: 'DELETE' });
            load();
        } catch (err) {
            alert(err.message || String(err));
        }
    };

    // Build a unique list of types currently in use, plus the original presets,
    // for the type-input datalist suggestions.
    const typeSuggestions = Array.from(new Set([
        'parts','paint','materials','sublet','other',
        ...vendors.map(v => v.vendor_type).filter(Boolean)
    ])).sort();

    return (
        <div>
            <div className="page-header">
                <h2>Vendors</h2>
                <button className="btn btn-primary" onClick={openNew}><i className="fas fa-plus"></i> New Vendor</button>
            </div>
            <div className="search-bar"><input placeholder="Search vendors..." value={search} onChange={e => setSearch(e.target.value)} /></div>
            <div className="card"><div className="table-wrapper">
                <table><thead><tr><th>Vendor</th><th>Type</th><th>Contact</th><th>Phone</th><th>City</th><th style={{width:90}}></th></tr></thead>
                <tbody>{vendors.map(v => (
                    <tr key={v.id} className="clickable" onClick={() => openEdit(v)}>
                        <td style={{fontWeight:500}}>{v.vendor_name}</td><td><Badge status={v.vendor_type}/></td>
                        <td>{v.contact_name||'—'}</td><td>{v.phone||'—'}</td><td>{v.city||'—'}</td>
                        <td style={{textAlign:'right', whiteSpace:'nowrap'}}>
                            <button className="btn btn-outline btn-sm" onClick={(e) => { e.stopPropagation(); openEdit(v); }} title="Edit" style={{padding:'4px 8px', marginRight:4}}>
                                <i className="fas fa-edit"></i>
                            </button>
                            <button className="btn btn-outline btn-sm" onClick={(e) => deleteVendor(v, e)} title="Delete"
                                    style={{padding:'4px 8px', color:'var(--danger)', borderColor:'var(--danger)'}}>
                                <i className="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                ))}
                {!vendors.length && <tr><td colSpan="6" className="text-muted" style={{textAlign:'center',padding:32}}>No vendors found</td></tr>}
                </tbody></table>
            </div></div>
            <Modal open={showForm} onClose={() => setShowForm(false)} title={editId ? 'Edit Vendor' : 'New Vendor'}>
                <div className="form-grid">
                    <div className="form-group"><label>Vendor Name *</label><input value={form.vendor_name} onChange={e => setForm({...form, vendor_name: e.target.value})} /></div>
                    <div className="form-group">
                        <label>Type</label>
                        <input list="vendor-type-options"
                               value={form.vendor_type}
                               onChange={e => setForm({...form, vendor_type: e.target.value})}
                               placeholder="parts, paint, accountant, towing…" />
                        <datalist id="vendor-type-options">
                            {typeSuggestions.map(t => <option key={t} value={t} />)}
                        </datalist>
                        <div className="text-muted" style={{fontSize:11, marginTop:4}}>Pick a suggestion or type your own.</div>
                    </div>
                    <div className="form-group"><label>Contact Name</label><input value={form.contact_name} onChange={e => setForm({...form, contact_name: e.target.value})} /></div>
                    <div className="form-group"><label>Phone</label><input value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} /></div>
                    <div className="form-group"><label>Email</label><input value={form.email} onChange={e => setForm({...form, email: e.target.value})} /></div>
                    <div className="form-group"><label>Fax</label><input value={form.fax} onChange={e => setForm({...form, fax: e.target.value})} /></div>
                    <div className="form-group"><label>Account #</label><input value={form.account_number} onChange={e => setForm({...form, account_number: e.target.value})} /></div>
                    <div className="form-group"><label>Address</label><input value={form.address} onChange={e => setForm({...form, address: e.target.value})} /></div>
                    <div className="form-group"><label>City</label><input value={form.city} onChange={e => setForm({...form, city: e.target.value})} /></div>
                    <div className="form-group"><label>State</label><input value={form.state} onChange={e => setForm({...form, state: e.target.value})} maxLength="2" /></div>
                    <div className="form-group"><label>ZIP</label><input value={form.zip_code} onChange={e => setForm({...form, zip_code: e.target.value})} /></div>
                </div>
                <div className="form-group" style={{marginTop:12}}><label>Notes</label><textarea value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} /></div>
                <div className="modal-actions"><button className="btn btn-outline" onClick={() => setShowForm(false)}>Cancel</button><button className="btn btn-primary" onClick={save} disabled={!form.vendor_name}><i className="fas fa-save"></i> {editId ? 'Update' : 'Save'}</button></div>
            </Modal>
        </div>
    );
}

// PRODUCTION BOARD
// ═══════════════════════════════════════════════════════════
function ProductionPage({ navigate }) {
    const [ros, setRos] = useState([]);
    useEffect(() => { api('/repair-orders?status=in_progress').then(setRos).catch(() => api('/repair-orders').then(r => setRos(r.filter(x => ['open','in_progress','on_hold'].includes(x.status))))); }, []);

    const statusCols = {open: 'Scheduled', in_progress: 'In Progress', on_hold: 'On Hold', completed: 'Completed'};
    const grouped = {};
    Object.keys(statusCols).forEach(s => grouped[s] = []);
    ros.forEach(r => { if (grouped[r.status]) grouped[r.status].push(r); });

    return (
        <div>
            <div className="page-header"><h2>Production Board</h2></div>
            <div style={{display:'grid', gridTemplateColumns: `repeat(${Object.keys(statusCols).length}, 1fr)`, gap:16}}>
                {Object.entries(statusCols).map(([status, label]) => (
                    <div key={status}>
                        <div style={{padding:'8px 12px', background:'var(--bg-card)', borderRadius:'8px 8px 0 0', borderBottom:'2px solid var(--primary)', marginBottom:8}}>
                            <span style={{fontWeight:600, fontSize:14}}>{label}</span>
                            <span className="text-muted text-sm" style={{marginLeft:8}}>({(grouped[status]||[]).length})</span>
                        </div>
                        {(grouped[status]||[]).map(r => (
                            <div key={r.id} className="card clickable" onClick={() => navigate('ro-detail', r.id)} style={{padding:12, marginBottom:8}}>
                                <div style={{fontWeight:600, color:'var(--primary)', fontSize:13}}>{r.ro_number}</div>
                                <div className="text-sm">{custName(r)}</div>
                                <div className="text-sm text-muted">{vehDesc(r)}</div>
                                {r.target_delivery_date && <div className="text-sm" style={{marginTop:4}}>Target: {fmtDate(r.target_delivery_date)}</div>}
                            </div>
                        ))}
                        {!(grouped[status]||[]).length && <div className="text-muted text-sm" style={{textAlign:'center',padding:24}}>None</div>}
                    </div>
                ))}
            </div>
        </div>
    );
}

// REPORTS
// ═══════════════════════════════════════════════════════════
function ReportsPage() {
    const [tab, setTab] = useState('production');
    const [prodData, setProdData] = useState(null);
    const [arData, setArData] = useState([]);
    const [empData, setEmpData] = useState([]);
    const [partsData, setPartsData] = useState([]);
    const [cycleData, setCycleData] = useState(null);

    // Date range used for Production report + Estimates CSV export.
    const today = new Date();
    const isoLocal = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const [prodFrom, setProdFrom] = useState('');
    const [prodTo, setProdTo] = useState('');

    const [exportFrom, setExportFrom] = useState(isoLocal(new Date(today.getFullYear(), today.getMonth(), 1)));
    const [exportTo, setExportTo] = useState(isoLocal(today));
    const [exportStatus, setExportStatus] = useState('');

    const setRangePreset = (preset) => {
        const t = new Date();
        const start = new Date();
        if (preset === 'last7')   start.setDate(t.getDate() - 7);
        else if (preset === 'last30')  start.setDate(t.getDate() - 30);
        else if (preset === 'this_month') { start.setDate(1); }
        else if (preset === 'last_month') { start.setMonth(t.getMonth() - 1, 1); t.setDate(0); }
        else if (preset === 'this_year') { start.setMonth(0, 1); }
        else if (preset === 'all') { setExportFrom(''); setExportTo(''); return; }
        setExportFrom(isoLocal(start));
        setExportTo(isoLocal(t));
    };

    const buildExportUrl = () => {
        const params = new URLSearchParams();
        if (exportFrom) params.set('date_from', exportFrom);
        if (exportTo)   params.set('date_to', exportTo);
        if (exportStatus) params.set('status', exportStatus);
        const q = params.toString();
        return `${API}/exports/estimates-csv${q ? '?' + q : ''}`;
    };

    // Same-origin path so downloads inherit auth cookies / just work in a new tab
    const reportPdfUrl = (name, extraParams) => {
        const p = new URLSearchParams(extraParams || {});
        const q = p.toString();
        return `${API}/reports/${name}/pdf${q ? '?' + q : ''}`;
    };

    const loadProduction = () => {
        const p = new URLSearchParams();
        if (prodFrom) p.set('start_date', prodFrom);
        if (prodTo)   p.set('end_date',   prodTo);
        const q = p.toString();
        api(`/reports/production-summary${q ? '?' + q : ''}`).then(setProdData);
    };

    useEffect(() => {
        if (tab === 'production') loadProduction();
        if (tab === 'ar') api('/reports/ar-aging').then(setArData);
        if (tab === 'employees') api('/reports/employee-productivity').then(setEmpData);
        if (tab === 'parts') api('/reports/parts-summary').then(setPartsData);
        if (tab === 'cycle') api('/reports/cycle-time').then(setCycleData);
    }, [tab]);

    // Reload Production when the user changes date filter
    useEffect(() => {
        if (tab === 'production') loadProduction();
    }, [prodFrom, prodTo]);

    // Small helper — right-aligned "Export PDF" link/button used in each tab
    const PdfButton = ({name, params, label = 'Export PDF'}) => (
        <a href={reportPdfUrl(name, params)}
           target="_blank" rel="noopener noreferrer"
           className="btn btn-outline btn-sm"
           style={{marginLeft:8}}>
            <i className="fas fa-file-pdf" style={{color:'#dc2626'}}></i> {label}
        </a>
    );

    return (
        <div>
            <div className="page-header"><h2>Reports</h2></div>
            <div className="tabs">
                {[['production','Production'],['ar','AR Aging'],['employees','Employee Prod.'],['parts','Parts'],['cycle','Cycle Time'],['exports','Exports']].map(([k,l]) => (
                    <div key={k} className={`tab ${tab===k?'active':''}`} onClick={() => setTab(k)}>{l}</div>
                ))}
            </div>

            {tab === 'production' && (
                <div>
                    <div className="card" style={{padding:14, marginBottom:16, display:'flex', alignItems:'flex-end', gap:12, flexWrap:'wrap'}}>
                        <div className="form-group" style={{marginBottom:0, flex:'0 0 160px'}}>
                            <label>From</label>
                            <input type="date" value={prodFrom} onChange={e => setProdFrom(e.target.value)} />
                        </div>
                        <div className="form-group" style={{marginBottom:0, flex:'0 0 160px'}}>
                            <label>To</label>
                            <input type="date" value={prodTo} onChange={e => setProdTo(e.target.value)} />
                        </div>
                        <button className="btn btn-outline btn-sm" onClick={() => { setProdFrom(''); setProdTo(''); }}>
                            Clear
                        </button>
                        <div style={{flex:1}}></div>
                        <PdfButton name="production-summary"
                                   params={{...(prodFrom && {start_date: prodFrom}), ...(prodTo && {end_date: prodTo})}} />
                    </div>
                    {!prodData && (
                        <div className="card"><div className="text-muted" style={{textAlign:'center', padding:32}}>Loading…</div></div>
                    )}
                    {prodData && (
                        <div className="stats-grid">
                            <div className="stat-card"><div className="label">Active ROs</div><div className="value blue">{prodData.active_ros || 0}</div></div>
                            <div className="stat-card"><div className="label">Completed ROs</div><div className="value green">{prodData.completed_ros || 0}</div></div>
                            <div className="stat-card"><div className="label">Total Billed</div><div className="value money">{fmt(prodData.total_billed)}</div></div>
                            <div className="stat-card"><div className="label">Collected</div><div className="value green money">{fmt(prodData.total_collected)}</div></div>
                            <div className="stat-card"><div className="label">Outstanding</div><div className="value red money">{fmt(prodData.total_outstanding)}</div></div>
                            <div className="stat-card"><div className="label">Total Labor</div><div className="value money">{fmt(prodData.total_labor)}</div></div>
                            <div className="stat-card"><div className="label">Total Parts</div><div className="value money">{fmt(prodData.total_parts)}</div></div>
                            <div className="stat-card"><div className="label">Total Paint</div><div className="value money">{fmt(prodData.total_paint)}</div></div>
                        </div>
                    )}
                    {prodData && (prodData.repair_orders_by_status || []).length > 0 && (
                        <div className="card" style={{marginTop:16}}>

                                    <thead><tr><th>Status</th><th>Count</th><th>Total Billed</th><th>Paid</th><th>Balance</th></tr></thead>

                                            <tr key={i}>
                                                <td><Badge status={r.status}/></td>
                                                <td>{r.count}</td>
                                                <td className="money">{fmt(r.total_amount)}</td>
                                                <td className="money text-green">{fmt(r.amount_paid)}</td>
                                                <td className="money text-red">{fmt(r.balance_due)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            )}

            {tab === 'ar' && (
                <div>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
                        <div className="text-sm text-muted">
                            {arData.length} open invoice{arData.length === 1 ? '' : 's'}

                            {arData.length > 0 && <b className="text-red">{fmt(arData.reduce((s, r) => s + Number(r.balance_due || 0), 0))} outstanding</b>}

                                    No outstanding balances — everyone's paid up.
                                </td></tr>

                            {arData.map(r => (
                                <tr key={r.ro_number}>

            {tab === 'employees' && (

                    </div>

                    <div className="text-sm text-muted" style={{marginBottom:14, padding:10, background:'var(--bg)', borderRadius:6, fontFamily:'monospace'}}>
                        Range: <b>{exportFrom || 'beginning of time'}</b> → <b>{exportTo || 'today'}</b>
                        {exportStatus && <> · status: <b>{exportStatus}</b></>}
                    </div>

                    <a href={buildExportUrl()} className="btn btn-primary" download>
                        <i className="fas fa-download"></i> Download Estimates CSV
                    </a>
                </div>
            )}
        </div>
    );
}

// SETTINGS
// ═══════════════════════════════════════════════════════════
function SettingsPage({ user }) {
    const [info, setInfo] = useState(null);
    const [rates, setRates] = useState([]);
    const [showAddRate, setShowAddRate] = useState(false);
    const [newRate, setNewRate] = useState({rate_name:'', rate_type:'', rate_amount:''});
    const [editRateId, setEditRateId] = useState(null);
    const [editRate, setEditRate] = useState({rate_name:'', rate_type:'', rate_amount:''});

    const loadRates = () => api('/shop/rates').then(setRates);

    useEffect(() => {
        api('/shop/info').then(setInfo);
        loadRates();
    }, []);

    const save = async () => {
        await api('/shop/info', { method: 'PUT', body: info });
        alert('Shop info saved!');
    };

    const startEditRate = (r) => {
        setEditRateId(r.id);
        setEditRate({rate_name: r.rate_name, rate_type: r.rate_type||'', rate_amount: r.rate_amount});
    };

    const saveEditRate = async () => {
        try {
            await api(`/shop/rates/${editRateId}`, { method: 'PUT', body: {
                rate_name: editRate.rate_name,
                rate_type: editRate.rate_type || null,
                rate_amount: parseFloat(editRate.rate_amount),
            }});
            setEditRateId(null); loadRates();
        } catch (err) { alert('Failed to save: ' + (err.message || err)); }
    };

    const deleteRate = async (r) => {
        if (!confirm(`Delete rate "${r.rate_name}"?`)) return;
        try {
            await api(`/shop/rates/${r.id}`, { method: 'DELETE' });
            loadRates();
        } catch (err) { alert('Failed to delete: ' + (err.message || err)); }
    };

    const addRate = async () => {
        if (!newRate.rate_name) return alert('Rate name is required');
        if (newRate.rate_amount === '') return alert('Rate amount is required');
        try {
            await api('/shop/rates', { method: 'POST', body: {
                rate_name: newRate.rate_name,
                rate_type: newRate.rate_type || null,
                rate_amount: parseFloat(newRate.rate_amount),
            }});
            setShowAddRate(false);
            setNewRate({rate_name:'', rate_type:'', rate_amount:''});
            loadRates();
        } catch (err) { alert('Failed to add: ' + (err.message || err)); }
    };

    if (!info) return <div className="empty-state"><i className="fas fa-spinner fa-spin"></i></div>;

    // Tax rate is shown specially since the unit is %, not $/hr
    const isTaxRate = (r) => r.rate_type === 'sales_tax_rate';

    return (
        <div>
            <div className="page-header"><h2>Shop Settings</h2><button className="btn btn-primary" onClick={save}><i className="fas fa-save"></i> Save Shop Info</button></div>
            <div className="card">
                <div className="section-title"><i className="fas fa-store"></i> Shop Information</div>
                <div className="form-grid">
                    {[['shop_name','Shop Name'],['address','Address'],['city','City'],['state','State'],['zip_code','ZIP'],['phone','Phone'],['fax','Fax'],['email','Email'],['tax_id','Tax ID'],['license_number','License #']].map(([k,l]) => (
                        <div className="form-group" key={k}><label>{l}</label><input value={info[k]||''} onChange={e => setInfo({...info, [k]: e.target.value})} /></div>
                    ))}
                </div>
            </div>
            <div className="card">
                <div className="card-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div className="section-title" style={{margin:0}}><i className="fas fa-dollar-sign"></i> Shop Rates</div>
                    <button className="btn btn-primary btn-sm" onClick={() => setShowAddRate(true)}><i className="fas fa-plus"></i> Add Rate</button>
                </div>
                <div className="text-sm text-muted" style={{marginBottom:12}}>
                    Labor rates default to dollars per hour. The "sales_tax_rate" row is the percent (e.g. 6.25 = 6.25%).
                    Delete any rate types your shop doesn't use.
                </div>
                <div className="table-wrapper">
                    <table>
                        <thead><tr><th>Rate Name</th><th>Type slug</th><th>Amount</th><th style={{width:170}}></th></tr></thead>
                        <tbody>{rates.map(r => (
                            editRateId === r.id ? (
                                <tr key={r.id} style={{background:'rgba(77,184,106,0.08)'}}>
                                    <td><input value={editRate.rate_name} onChange={e => setEditRate({...editRate, rate_name: e.target.value})} style={{width:'100%'}} /></td>
                                    <td><input value={editRate.rate_type} onChange={e => setEditRate({...editRate, rate_type: e.target.value})} style={{width:'100%', fontFamily:'monospace', fontSize:12}} /></td>
                                    <td><input type="number" step="0.01" value={editRate.rate_amount} onChange={e => setEditRate({...editRate, rate_amount: e.target.value})} style={{width:100}} /></td>
                                    <td style={{textAlign:'right', whiteSpace:'nowrap'}}>
                                        <button className="btn btn-primary btn-sm" onClick={saveEditRate} style={{marginRight:4}}><i className="fas fa-check"></i></button>
                                        <button className="btn btn-outline btn-sm" onClick={() => setEditRateId(null)}><i className="fas fa-times"></i></button>
                                    </td>
                                </tr>
                            ) : (
                                <tr key={r.id}>
                                    <td>{r.rate_name}</td>
                                    <td className="text-sm" style={{fontFamily:'monospace', color:'var(--text-muted)'}}>{r.rate_type||'—'}</td>
                                    <td className="money" style={{fontWeight:600}}>{isTaxRate(r) ? `${r.rate_amount}%` : `${fmt(r.rate_amount)}/hr`}</td>
                                    <td style={{textAlign:'right', whiteSpace:'nowrap'}}>
                                        <button className="btn btn-outline btn-sm" onClick={() => startEditRate(r)} title="Edit" style={{padding:'4px 8px', marginRight:4}}><i className="fas fa-edit"></i></button>
                                        <button className="btn btn-outline btn-sm" onClick={() => deleteRate(r)} title="Delete"
                                                style={{padding:'4px 8px', color:'var(--danger)', borderColor:'var(--danger)'}}><i className="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            )
                        ))}
                        {!rates.length && <tr><td colSpan="4" className="text-muted" style={{textAlign:'center',padding:24}}>No rates yet</td></tr>}
                        </tbody>
                    </table>
                </div>
                {showAddRate && (
                    <div style={{marginTop:12, padding:12, background:'var(--bg)', borderRadius:8, border:'1px solid var(--border)'}}>
                        <div style={{display:'grid', gridTemplateColumns:'2fr 2fr 1fr auto', gap:8, alignItems:'end'}}>
                            <div className="form-group" style={{margin:0}}><label>Rate Name</label><input value={newRate.rate_name} onChange={e => setNewRate({...newRate, rate_name: e.target.value})} placeholder="e.g. Detail Labor" /></div>
                            <div className="form-group" style={{margin:0}}><label>Type slug (optional)</label><input value={newRate.rate_type} onChange={e => setNewRate({...newRate, rate_type: e.target.value})} placeholder="auto-generated if blank" style={{fontFamily:'monospace', fontSize:12}} /></div>
                            <div className="form-group" style={{margin:0}}><label>Amount</label><input type="number" step="0.01" value={newRate.rate_amount} onChange={e => setNewRate({...newRate, rate_amount: e.target.value})} placeholder="0.00" /></div>
                            <div style={{display:'flex', gap:6}}>
                                <button className="btn btn-primary btn-sm" onClick={addRate}><i className="fas fa-check"></i> Add</button>
                                <button className="btn btn-outline btn-sm" onClick={() => setShowAddRate(false)}><i className="fas fa-times"></i></button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
            <div className="card">
                <div className="section-title"><i className="fas fa-file-export"></i> Data Export</div>
                <p style={{fontSize: 13, color: 'var(--text-muted)', marginBottom: 16}}>Export shop data for accounting systems or Mitchell Connect.</p>
                <div className="flex gap-2" style={{flexWrap: 'wrap'}}>
                    <a href={`${API}/exports/quickbooks`} className="btn btn-primary" download><i className="fas fa-file-invoice-dollar"></i> QuickBooks IIF</a>
                    <a href={`${API}/exports/xml`} className="btn btn-outline" download><i className="fas fa-code"></i> XML Export</a>
                    <a href={`${API}/exports/mitchell-connect`} className="btn btn-warning" download><i className="fas fa-exchange-alt"></i> Mitchell Connect XML</a>
                </div>
            </div>

            {user && user.role === 'admin' && (
                <div className="card">
                    <div className="section-title"><i className="fas fa-shield-alt"></i> Database Backup (Admin)</div>
                    <p style={{fontSize: 13, color: 'var(--text-muted)', marginBottom: 12, lineHeight: 1.5}}>
                        Download a complete snapshot of every customer, vehicle, RO, estimate, payment,
                        time card, and parts catalog entry — as a single SQLite <code>.db</code> file.
                        Safe to run anytime; the snapshot is consistent even if work is in progress.
                        Keep a copy off Railway (Dropbox, Google Drive, external drive) for disaster recovery.
                    </p>
                    <div className="text-sm text-muted" style={{marginBottom:12, padding:10, background:'var(--bg)', borderRadius:6}}>
                        <i className="fas fa-info-circle" style={{marginRight:6}}></i>
                        The downloaded file can be opened with <b>DB Browser for SQLite</b> (free) to inspect rows,
                        or sent back to me to debug data issues. <b>Don't share it publicly</b> — it contains every
                        customer name, address, phone, payment record, and worker PIN hash.
                    </div>
                    <button className="btn btn-primary" onClick={async () => {
                        try {
                            const resp = await fetch(`${API}/exports/db-backup`, {
                                headers: _authToken ? { Authorization: `Bearer ${_authToken}` } : {},
                            });
                            if (!resp.ok) {
                                const err = await resp.json().catch(() => ({}));
                                throw new Error(err.detail || `HTTP ${resp.status}`);
                            }
                            // Pull filename out of Content-Disposition header if present
                            const cd = resp.headers.get('Content-Disposition') || '';
                            const m = cd.match(/filename="?([^"]+)"?/);
                            const filename = m ? m[1] : 'shop_backup.db';
                            const blob = await resp.blob();
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        } catch (err) {
                            alert('Backup download failed: ' + (err.message || err));
                        }
                    }}>
                        <i className="fas fa-download"></i> Download DB Backup
                    </button>
                </div>
            )}
        </div>
    );
}

// TOUCH LOGIN SCREEN (for worker touchscreen PCs)
// Tap your name → enter 4-digit PIN on touch pad → auto-login
// ═══════════════════════════════════════════════════════════
function TouchLoginScreen({ onLogin, onAdminLogin }) {
    const [workers, setWorkers] = useState([]);
    const [selected, setSelected] = useState(null);
    const [pin, setPin] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        api('/auth/workers').then(setWorkers).catch(() => {});
    }, []);

    const handlePinKey = async (digit) => {
        if (loading) return;
        const newPin = pin + digit;
        setPin(newPin);
        setError('');
        if (newPin.length === 4) {
            // Auto-submit on 4th digit
            setLoading(true);
            try {
                const result = await api('/auth/login', {
                    method: 'POST',
                    body: { username: selected.username, pin: newPin }
                });
                setAuthToken(result.token);
                onLogin(result);
            } catch (err) {
                setError('Wrong PIN — try again');
                setPin('');
            }
            setLoading(false);
        }
    };

    const handleBackspace = () => {
        setPin(prev => prev.slice(0, -1));
        setError('');
    };

    const handleBack = () => {
        setSelected(null);
        setPin('');
        setError('');
    };

    // PIN Pad screen (after selecting a worker)
    if (selected) {
        return (
            <div className="touch-login">
                <div style={{textAlign: 'center', marginBottom: 24}}>
                    <img src="/logo.png" alt="Shop logo" style={{height: 60, marginBottom: 12}} />
                </div>
                <div style={{textAlign: 'center', marginBottom: 24}}>
                    <div style={{fontSize: 28, fontWeight: 700, color: 'var(--primary)'}}>
                        <i className="fas fa-user-circle" style={{marginRight: 10}}></i>
                        {selected.display_name || selected.username}
                    </div>
                    <div style={{fontSize: 16, color: 'var(--text-muted)', marginTop: 4}}>Enter your 4-digit PIN</div>
                </div>

                {/* PIN dots */}
                <div className="pin-dots">
                    {[0,1,2,3].map(i => (
                        <div key={i} className={`pin-dot ${i < pin.length ? 'filled' : ''}`}></div>
                    ))}
                </div>

                {error && <div style={{textAlign: 'center', color: 'var(--red)', fontSize: 18, marginBottom: 16, fontWeight: 600}}>
                    <i className="fas fa-exclamation-triangle"></i> {error}
                </div>}

                {loading && <div style={{textAlign: 'center', marginBottom: 16}}>
                    <i className="fas fa-spinner fa-spin" style={{fontSize: 28, color: 'var(--primary)'}}></i>
                </div>}

                {/* Number pad */}
                <div className="pin-pad">
                    {[1,2,3,4,5,6,7,8,9].map(d => (
                        <button key={d} className="pin-key" onClick={() => handlePinKey(String(d))}>{d}</button>
                    ))}
                    <button className="pin-key pin-key-back" onClick={handleBack}>
                        <i className="fas fa-arrow-left"></i>
                    </button>
                    <button className="pin-key" onClick={() => handlePinKey('0')}>0</button>
                    <button className="pin-key pin-key-back" onClick={handleBackspace}>
                        <i className="fas fa-backspace"></i>
                    </button>
                </div>
            </div>
        );
    }

    // Worker selection grid
    return (
        <div className="touch-login">
            <div style={{textAlign: 'center', marginBottom: 24}}>
                <img src="/logo.png" alt="Shop logo" style={{height: 80, marginBottom: 8}} />
                <div style={{fontSize: 16, color: 'var(--text-muted)'}}>Tap your name to clock in</div>
            </div>

            <div className="worker-grid">
                {workers.map(w => (
                    <button key={w.id} className="worker-card" onClick={() => setSelected(w)}>
                        <i className="fas fa-user-circle" style={{fontSize: 40, marginBottom: 8, color: 'var(--primary)'}}></i>
                        <div style={{fontSize: 20, fontWeight: 700}}>{w.display_name || w.username}</div>
                        {w.employee_id && <div style={{fontSize: 12, color: 'var(--text-muted)', marginTop: 2}}>#{w.employee_id}</div>}
                    </button>
                ))}
            </div>

            <div style={{textAlign: 'center', marginTop: 32}}>
                <button className="btn btn-outline" style={{fontSize: 14, padding: '10px 24px'}} onClick={onAdminLogin}>
                    <i className="fas fa-shield-alt"></i> Admin / Office Login
                </button>
            </div>
        </div>
    );
}

// ═══════════════════════════════════════════════════════════
// WORKER TIME CLOCK (touch optimized — NO actual time display)
// Shows only elapsed timer after clock-in + today's total
// ═══════════════════════════════════════════════════════════
function TimeClock({ user, onLogout }) {
    const [tick, setTick] = useState(Date.now());
    const [clockedIn, setClockedIn] = useState(false);
    const [clockInTime, setClockInTime] = useState(null);
    const [todayHours, setTodayHours] = useState(0);
    const [activeRoId, setActiveRoId] = useState(null);
    const [activeRoNumber, setActiveRoNumber] = useState(null);
    const [busy, setBusy] = useState(false);
    const [confirmation, setConfirmation] = useState(null);  // {type:'in'|'out', label, hours?}
    const [logoutCountdown, setLogoutCountdown] = useState(null);

    useEffect(() => {
        const t = setInterval(() => setTick(Date.now()), 1000);
        return () => clearInterval(t);
    }, []);

    // Refresh "are we clocked in" state from server
    const refreshState = () => {
        if (!user.employee_id) return Promise.resolve();
        return api('/time-cards?employee_id=' + user.employee_id).then(cards => {
            const todayLocal = new Date();
            const todayKey = todayLocal.getFullYear() + '-' +
                String(todayLocal.getMonth()+1).padStart(2,'0') + '-' +
                String(todayLocal.getDate()).padStart(2,'0');
            const todayCards = cards.filter(c => {
                const d = parseStamp(c.clock_in);
                if (!d) return false;
                const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                return k === todayKey;
            });
            const openCard = cards.find(c => !c.clock_out);  // open could be from yesterday
            if (openCard) {
                setClockedIn(true);
                setClockInTime(parseStamp(openCard.clock_in));
                setActiveRoId(openCard.ro_id);
                setActiveRoNumber(openCard.ro_number || null);
            } else {
                setClockedIn(false);
                setClockInTime(null);
                setActiveRoId(null);
                setActiveRoNumber(null);
            }
            const hours = todayCards.reduce((sum, c) => sum + (c.hours_worked || 0), 0);
            setTodayHours(hours);
        }).catch(() => {});
    };

    useEffect(() => { refreshState(); }, [user.employee_id]);

    // Show a brief success screen, then auto-logout so the next worker can use the
    // terminal. Mimics the Mitchell TecStation kiosk flow.
    const triggerKioskLogout = (msg) => {
        setConfirmation(msg);
        let secs = 3;
        setLogoutCountdown(secs);
        const interval = setInterval(() => {
            secs -= 1;
            setLogoutCountdown(secs);
            if (secs <= 0) {
                clearInterval(interval);
                if (onLogout) onLogout();
            }
        }, 1000);
    };

    const handleClockIn = async (roId = null, jobLabel = null) => {
        if (busy) return;
        setBusy(true);
        try {
            const body = {
                employee_id: user.employee_id,
                clock_in: new Date().toISOString(),
                activity_type: 'production',
            };
            if (roId) body.ro_id = roId;
            await api('/time-cards', { method: 'POST', body });
            triggerKioskLogout({ type: 'in', label: jobLabel || (roId ? `RO ${roId}` : 'general work') });
        } catch (err) {
            alert(err.message || 'Clock in failed.');
            setBusy(false);
        }
    };

    const handleClockOut = async () => {
        if (busy) return;
        setBusy(true);
        try {
            const cards = await api('/time-cards?employee_id=' + user.employee_id);
            const openCard = cards.find(c => !c.clock_out);
            let hoursWorked = 0;
            let label = activeRoNumber ? `RO ${activeRoNumber}` : 'general work';
            if (openCard) {
                const now = new Date();
                const cIn = parseStamp(openCard.clock_in);
                hoursWorked = cIn ? Math.max(0, (now - cIn) / 3600000) : 0;
                if (openCard.ro_number) label = `RO ${openCard.ro_number}`;
                await api(`/time-cards/${openCard.id}`, {
                    method: 'PUT',
                    body: {
                        clock_out: now.toISOString(),
                        hours_worked: parseFloat(hoursWorked.toFixed(2)),
                    }
                });
            }
            triggerKioskLogout({ type: 'out', label, hours: hoursWorked });
        } catch (err) {
            alert('Clock out failed: ' + (err.message || err));
            setBusy(false);
        }
    };

    const elapsedRaw = clockedIn && clockInTime ? Math.floor((tick - clockInTime.getTime()) / 1000) : 0;
    const elapsed = Math.max(0, elapsedRaw);  // defensive clamp against any stray bad timestamp
    const elapsedStr = `${Math.floor(elapsed/3600)}:${String(Math.floor((elapsed%3600)/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;

    // ═══ KIOSK CONFIRMATION + AUTO-LOGOUT SCREEN ═══
    // After a clock-in/out succeeds, we briefly show a big confirmation, then
    // the parent's onLogout fires and returns to the worker login grid.
    if (confirmation) {
        const isIn = confirmation.type === 'in';
        const fmtH = (h) => `${h.toFixed(2)} hrs`;
        return (
            <div style={{textAlign:'center', padding:'48px 16px', minHeight:480, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center'}}>
                <div style={{fontSize:96, color: isIn ? '#22c55e' : 'var(--primary)', marginBottom:24}}>
                    <i className={isIn ? 'fas fa-check-circle' : 'fas fa-stop-circle'}></i>
                </div>
                <div style={{fontSize:36, fontWeight:800, marginBottom:8}}>
                    {isIn ? 'Clocked In' : 'Clocked Out'}
                </div>
                <div style={{fontSize:20, color:'var(--text-muted)', marginBottom:8}}>
                    {user.display_name || user.username}
                </div>
                <div style={{fontSize:24, fontWeight:600, color: isIn ? '#22c55e' : 'var(--primary)', marginBottom:24}}>
                    {isIn ? 'on ' : 'of '}{confirmation.label}
                </div>
                {!isIn && confirmation.hours != null && (
                    <div style={{fontSize:18, color:'var(--text)', marginBottom:24}}>
                        Session: <b>{fmtH(confirmation.hours)}</b>
                    </div>
                )}
                <div style={{fontSize:14, color:'var(--text-muted)', marginTop:16}}>
                    Logging out in <b style={{color:'var(--text)', fontSize:16}}>{logoutCountdown}</b>…
                </div>
                <button className="touch-btn touch-btn-outline" onClick={() => onLogout && onLogout()}
                        style={{minWidth:200, marginTop:24, fontSize:14, padding:'10px 20px'}}>
                    Done — Log Out Now
                </button>
            </div>
        );
    }

    // Worker accounts MUST be linked to an employee record to clock in.
    if (!user.employee_id) {
        return (
            <div style={{textAlign: 'center', padding: '32px 0'}}>
                <i className="fas fa-user-times" style={{fontSize: 56, color: 'var(--text-muted)', marginBottom: 16}}></i>
                <div style={{fontSize: 22, fontWeight: 700, marginBottom: 12, color: 'var(--text)'}}>
                    Account not linked to an employee
                </div>
                <div style={{fontSize: 15, color: 'var(--text-muted)', maxWidth: 500, margin: '0 auto', lineHeight: 1.5}}>
                    Your login isn't connected to an Employee record yet, so the system can't record your hours.
                    <br /><br />
                    Ask the shop admin to open <b>Settings → User Logins</b>, click <b>Edit</b> on your row,
                    and pick your name under <b>Linked Employee</b>.
                </div>
            </div>
        );
    }

    // ═══ CLOCKED-IN VIEW: big timer + clock-out ═══
    if (clockedIn) {
        return (
            <div style={{textAlign: 'center', padding: '24px 0'}}>
                <div style={{fontSize: 16, color: '#22c55e', fontWeight: 600, textTransform: 'uppercase', letterSpacing: 2, marginBottom: 16}}>
                    <i className="fas fa-circle" style={{fontSize: 12, marginRight: 8, animation: 'pulse 2s infinite'}}></i> Clocked In
                </div>
                <div style={{fontSize: 72, fontWeight: 800, fontFamily: 'monospace', color: '#fff', letterSpacing: 4, margin: '8px 0 32px'}}>
                    {elapsedStr}
                </div>
                <button className="touch-btn touch-btn-danger" onClick={handleClockOut} disabled={busy} style={{minWidth: 320, fontSize: 26, padding: '24px 48px'}}>
                    <i className="fas fa-stop"></i> {busy ? 'Working…' : 'Clock Out'}
                </button>
                <div style={{marginTop: 32, padding: '16px 24px', background: 'var(--bg-card)', borderRadius: 12, display: 'inline-block', border: '1px solid var(--border)'}}>
                    <div style={{fontSize: 14, color: 'var(--text-muted)', marginBottom: 4}}>Today's Total</div>
                    <div style={{fontSize: 32, fontWeight: 700, fontFamily: 'monospace', color: 'var(--primary)'}}>
                        {(todayHours + elapsed/3600).toFixed(1)}h
                    </div>
                </div>
            </div>
        );
    }

    // ═══ CLOCKED-OUT VIEW: single big Clock In button (no per-job picker) ═══
    return (
        <div style={{padding: '32px 0', textAlign: 'center'}}>
            <div style={{fontSize: 16, color: 'var(--text-muted)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: 2, marginBottom: 16}}>
                <i className="far fa-circle" style={{fontSize: 12, marginRight: 8}}></i> Not Clocked In
            </div>
            <div style={{fontSize: 14, color: 'var(--text-muted)', marginBottom: 32, maxWidth: 480, margin: '0 auto 32px'}}>
                Just clock in for the day. At the end of your shift, tell the office
                how many hours you spent on each job.
            </div>

            <button className="touch-btn touch-btn-success" onClick={() => handleClockIn()} disabled={busy}
                    style={{minWidth: 320, fontSize: 26, padding: '24px 48px'}}>
                <i className="fas fa-play"></i> Clock In
            </button>

            <div style={{marginTop: 32, padding: '16px 24px', background: 'var(--bg-card)', borderRadius: 12, display: 'inline-block', border: '1px solid var(--border)'}}>
                <div style={{fontSize: 14, color: 'var(--text-muted)', marginBottom: 4}}>Today's Total</div>
                <div style={{fontSize: 32, fontWeight: 700, fontFamily: 'monospace', color: 'var(--primary)'}}>
                    {todayHours.toFixed(1)}h
                </div>
            </div>
        </div>
    );
}

// ═══════════════════════════════════════════════════════════
// MY JOBS — touch-optimized with large move buttons
// ═══════════════════════════════════════════════════════════
function MyJobsView({ user }) {
    const [jobs, setJobs] = useState([]);
    const [moving, setMoving] = useState(null);

    const load = () => {
        if (user.employee_id) {
            api(`/tecstation/my-jobs/${user.employee_id}`).then(setJobs).catch(console.error);
        }
    };
    useEffect(() => { load(); }, [user.employee_id]);

    const deptColors = {
        lot: '#94a3b8', body: '#3b82f6', frame: '#8b5cf6', mechanical: '#f97316',
        paint: '#eab308', detail: '#22c55e', assembly: '#06b6d4', glass: '#a855f7',
        qa: '#ec4899', ready: '#10b981', delivered: '#6b7280'
    };
    const deptLabels = {
        lot:'Lot', body:'Body', frame:'Frame', mechanical:'Mechanical',
        paint:'Paint', detail:'Detail', assembly:'Assembly', glass:'Glass',
        qa:'QA', ready:'Ready', delivered:'Delivered'
    };
    const DEPTS = ['lot','body','frame','mechanical','paint','detail','assembly','glass','qa','ready','delivered'];

    const moveVehicle = async (roId, toDept) => {
        try {
            await api('/tecstation/move', {
                method: 'POST',
                body: { ro_id: roId, to_department: toDept, moved_by: user.employee_id }
            });
            setMoving(null);
            load();
        } catch (err) {
            alert(err.message);
        }
    };

    return (
        <div>
            <div className="page-header" style={{marginBottom: 16}}>
                <h2 style={{fontSize: 22}}>My Assigned Jobs</h2>
                <button className="touch-btn" onClick={load} style={{fontSize: 16, padding: '10px 20px', background: 'transparent', border: '1px solid var(--border)', color: 'var(--text-muted)'}}>
                    <i className="fas fa-sync"></i> Refresh
                </button>
            </div>
            {jobs.length === 0 ? (
                <div className="empty-state"><i className="fas fa-inbox"></i><div style={{fontSize: 18}}>No jobs assigned to you right now</div></div>
            ) : jobs.map(job => (
                <div className="job-card" key={job.id} style={{padding: 20, marginBottom: 16, borderRadius: 12}}>
                    <div className="job-header" style={{marginBottom: 12}}>
                        <span className="job-title" style={{fontSize: 22}}>{job.ro_number}</span>
                        <div className="flex items-center gap-2">
                            <span className="badge" style={{background: `${deptColors[job.current_department]}22`, color: deptColors[job.current_department], fontSize: 14, padding: '6px 12px'}}>
                                {deptLabels[job.current_department] || job.current_department}
                            </span>
                        </div>
                    </div>
                    <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 12, fontSize: 16}}>
                        <span><i className="fas fa-truck" style={{width: 20}}></i> {[job.year, job.make, job.model].filter(Boolean).join(' ')}</span>
                        <span><i className="fas fa-palette" style={{width: 20}}></i> {job.color || '—'}</span>
                        <span><i className="fas fa-id-card" style={{width: 20}}></i> {job.license_plate || '—'}</span>
                        <span><i className="fas fa-calendar" style={{width: 20}}></i> Target: {fmtDate(job.target_delivery_date)}</span>
                    </div>

                    {/* Move vehicle — large touch buttons */}
                    {moving === job.id ? (
                        <div style={{marginTop: 12}}>
                            <div style={{fontSize: 16, color: 'var(--text-muted)', marginBottom: 10, fontWeight: 600}}>Move to department:</div>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(120px, 1fr))', gap: 10}}>
                                {DEPTS.filter(d => d !== job.current_department).map(d => (
                                    <button key={d} className="touch-move-btn" onClick={() => moveVehicle(job.id, d)}
                                            style={{borderColor: deptColors[d], color: deptColors[d]}}>
                                        {deptLabels[d]}
                                    </button>
                                ))}
                            </div>
                            <button className="touch-btn" onClick={() => setMoving(null)}
                                    style={{marginTop: 10, background: 'transparent', border: '1px solid var(--border)', color: 'var(--text-muted)', width: '100%'}}>
                                Cancel
                            </button>
                        </div>
                    ) : (
                        <button className="touch-btn touch-btn-primary" style={{width: '100%', marginTop: 4}} onClick={() => setMoving(job.id)}>
                            <i className="fas fa-arrow-right"></i> Move Vehicle
                        </button>
                    )}

                    {/* Line items */}
                    {job.my_lines && job.my_lines.length > 0 && (
                        <div style={{marginTop: 16, borderTop: '1px solid var(--border)', paddingTop: 12}}>
                            <div style={{fontSize: 13, color: 'var(--text-muted)', marginBottom: 6, textTransform: 'uppercase', fontWeight: 600}}>Operations</div>
                            {job.my_lines.map(line => (
                                <div key={line.id} style={{fontSize: 15, padding: '6px 0', display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--border)'}}>
                                    <span>{line.line_number}. {line.description}</span>
                                    <span style={{color: 'var(--text-muted)', fontWeight: 600}}>{line.labor_hours || line.paint_hours || 0}h</span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            ))}
        </div>
    );
}
