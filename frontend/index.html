// REPAIR ORDER DETAIL
// ═══════════════════════════════════════════════════════════
function RODetail({ id, navigate }) {
    const [ro, setRo] = useState(null);
    const [tab, setTab] = useState('lines');
    const [showPayment, setShowPayment] = useState(false);
    const [payForm, setPayForm] = useState({amount:'',payment_method:'insurance',reference_number:'',payer_name:''});
    const [employees, setEmployees] = useState([]);
    const [team, setTeam] = useState([]);
    const [newTeamMember, setNewTeamMember] = useState({employee_id:'', role:''});
    const [rates, setRates] = useState([]);
    const [catalog, setCatalog] = useState([]);
    const [showAddLine, setShowAddLine] = useState(false);
    const [supplementWarn, setSupplementWarn] = useState(null);  // {newLineTotal} when about to add
    const [catalogPrompt, setCatalogPrompt] = useState(null);
    const [lineForm, setLineForm] = useState({ line_type: 'labor', operation: '', description: '', part_number: '', part_type: 'OEM',
        quantity: 1, labor_hours: 0, labor_rate: 0, paint_hours: 0, paint_rate: 0, part_price: 0, part_cost: 0, taxable: false, notes: '' });
    const [lineSaving, setLineSaving] = useState(false);
    const [editingLine, setEditingLine] = useState(null);  // {...line} or null
    const [showSignaturePad, setShowSignaturePad] = useState(false);
    const [showAllocateTime, setShowAllocateTime] = useState(false);
    const [allocForm, setAllocForm] = useState({employee_id:'', work_date: new Date().toISOString().slice(0,10), hours:'', notes:''});

    const load = () => api(`/repair-orders/${id}`).then(setRo);
    const loadTeam = () => api(`/repair-orders/${id}/team`).then(setTeam).catch(() => setTeam([]));
    const loadCatalog = () => api('/parts-catalog').then(setCatalog).catch(() => setCatalog([]));
    useEffect(() => { load(); loadTeam(); }, [id]);
    useEffect(() => {
        api('/employees').then(setEmployees).catch(() => setEmployees([]));
        api('/shop/rates').then(setRates).catch(() => {});
        loadCatalog();
    }, []);
    if (!ro) return <div className="empty-state"><i className="fas fa-spinner fa-spin"></i></div>;

    const addTeamMember = async () => {
        if (!newTeamMember.employee_id || !newTeamMember.role) {
            return alert('Pick a worker and type their role.');
        }
        try {
            await api(`/repair-orders/${id}/team`, { method: 'POST', body: {
                employee_id: parseInt(newTeamMember.employee_id),
                role: newTeamMember.role.trim(),
            }});
            setNewTeamMember({employee_id:'', role:''});
            loadTeam();
        } catch (err) { alert('Failed to add: ' + (err.message || err)); }
    };

    const removeTeamMember = async (assignmentId) => {
        if (!confirm('Remove this team member?')) return;
        try {
            await api(`/repair-orders/${id}/team/${assignmentId}`, { method: 'DELETE' });
            loadTeam();
        } catch (err) { alert('Failed to remove: ' + (err.message || err)); }
    };

    // ── Add-line form helpers (mirrors EstimateDetail) ──
    const setLineField = (field, val) => {
        setLineForm(prev => {
            const next = {...prev, [field]: val};
            if (field === 'line_type') {
                const findRate = (kw) => { const r = rates.find(r => r.rate_type.includes(kw)); return r ? r.rate_amount : 0; };
                if (val === 'labor') { next.labor_rate = findRate('body_labor') || findRate('labor'); next.paint_rate = 0; next.paint_hours = 0; next.part_price = 0; next.part_cost = 0; next.part_number = ''; }
                else if (val === 'paint' || val === 'refinish') { next.paint_rate = findRate('paint') || findRate('refinish'); next.labor_rate = 0; next.labor_hours = 0; next.part_price = 0; next.part_cost = 0; next.part_number = ''; }
                else if (val === 'part') { next.labor_hours = 0; next.labor_rate = 0; next.paint_hours = 0; next.paint_rate = 0; }
                else { next.labor_hours = 0; next.labor_rate = 0; next.paint_hours = 0; next.paint_rate = 0; next.part_number = ''; }
                next.taxable = val === 'part';
            }
            if (field === 'part_number' && next.line_type === 'part') {
                const m = catalog.find(c => (c.part_number||'').toUpperCase() === (val||'').toUpperCase());
                if (m) {
                    if (!next.description) next.description = m.description || '';
                    if (!parseFloat(next.part_price)) next.part_price = m.standard_price || 0;
                    if (!parseFloat(next.part_cost))  next.part_cost  = m.standard_cost  || 0;
                }
            }
            return next;
        });
    };

    const computeLineTotal = () => {
        const lt = lineForm.line_type;
        if (lt === 'part')   return (parseFloat(lineForm.part_price)||0) * (parseFloat(lineForm.quantity)||1);
        if (lt === 'labor')  return (parseFloat(lineForm.labor_hours)||0) * (parseFloat(lineForm.labor_rate)||0);
        if (lt === 'paint' || lt === 'refinish') return (parseFloat(lineForm.paint_hours)||0) * (parseFloat(lineForm.paint_rate)||0);
        return parseFloat(lineForm.part_price)||0;
    };

    // Step 1: clicking "Add Line" opens the warning showing the price impact.
    const requestAddLine = () => {
        if (!lineForm.description) return alert('Please fill in a description first.');
        setSupplementWarn({ newLineTotal: computeLineTotal() });
    };

    // Step 2: confirming the warning actually saves the line as a supplement.
    const confirmAddLine = async () => {
        setSupplementWarn(null);
        setLineSaving(true);
        try {
            const body = {
                line_type: lineForm.line_type,
                operation: lineForm.operation || null,
                description: lineForm.description,
                part_number: lineForm.part_number || null,
                part_type: lineForm.line_type === 'part' ? lineForm.part_type : null,
                quantity: parseFloat(lineForm.quantity) || 1,
                labor_hours: parseFloat(lineForm.labor_hours) || 0,
                labor_rate: parseFloat(lineForm.labor_rate) || 0,
                paint_hours: parseFloat(lineForm.paint_hours) || 0,
                paint_rate: parseFloat(lineForm.paint_rate) || 0,
                part_price: parseFloat(lineForm.part_price) || 0,
                part_cost: parseFloat(lineForm.part_cost) || 0,
                taxable: lineForm.taxable ? 1 : 0,
                notes: lineForm.notes || null,
            };
            await api(`/repair-orders/${id}/lines`, { method: 'POST', body });

            // Catalog prompt for new parts (same flow as estimates)
            if (body.line_type === 'part' && body.part_number) {
                const existing = catalog.find(c => (c.part_number||'').toUpperCase() === body.part_number.toUpperCase());
                const priceChanged = existing && Math.abs((existing.standard_price||0) - body.part_price) > 0.005;
                if (!existing || priceChanged) {
                    setCatalogPrompt({
                        part_number: body.part_number, description: body.description,
                        price: body.part_price, cost: body.part_cost, part_type: body.part_type,
                        existing: existing || null, priceChanged,
                    });
                }
            }

            setLineForm({ line_type: lineForm.line_type, operation: '', description: '', part_number: '', part_type: 'OEM',
                quantity: 1, labor_hours: 0, labor_rate: body.labor_rate, paint_hours: 0, paint_rate: body.paint_rate, part_price: 0, part_cost: 0,
                taxable: lineForm.line_type === 'part', notes: '' });
            load();
        } catch (err) { alert('Failed to add line: ' + (err.message || err)); }
        setLineSaving(false);
    };

    const acceptCatalogSave = async () => {
        if (!catalogPrompt) return;
        try {
            await api('/parts-catalog', { method: 'POST', body: {
                part_number: catalogPrompt.part_number, description: catalogPrompt.description,
                standard_price: catalogPrompt.price, standard_cost: catalogPrompt.cost, part_type: catalogPrompt.part_type,
            }});
            setCatalogPrompt(null);
            loadCatalog();
        } catch (err) { alert('Failed to save to catalog: ' + (err.message || err)); }
    };

    const deleteLine = async (lineId) => {
        if (!confirm('Delete this line? Total will be recalculated.')) return;
        try {
            await api(`/repair-orders/${id}/lines/${lineId}`, { method: 'DELETE' });
            load();
        } catch (err) { alert('Failed to delete line: ' + (err.message || err)); }
    };

    const toggleLineTaxable = async (line) => {
        try {
            await api(`/repair-orders/${id}/lines/${line.id}`, { method: 'PATCH', body: { taxable: line.taxable ? 0 : 1 } });
            load();
        } catch (err) { alert('Failed to update: ' + (err.message || err)); }
    };

    // Advance a line's status through the parts workflow
    // (pending → ordered → received → installed → complete).
    // Used by the Status dropdown in the line items table.
    const updateLineStatus = async (line, newStatus) => {
        if (newStatus === (line.status || 'pending')) return;
        try {
            await api(`/repair-orders/${id}/lines/${line.id}`, { method: 'PATCH', body: { status: newStatus } });
            load();
        } catch (err) { alert('Failed to update status: ' + (err.message || err)); }
    };

    const moveLine = async (lineId, direction) => {
        try {
            await api(`/repair-orders/${id}/lines/${lineId}/move?direction=${direction}`, { method: 'POST' });
            load();
        } catch (err) { alert('Failed to move: ' + (err.message || err)); }
    };

    const saveSignature = async (dataUrl) => {
        try {
            const today = new Date().toISOString().slice(0, 10);
            await api(`/repair-orders/${id}`, { method: 'PUT', body: {
                customer_id: ro.customer_id,
                customer_signature: dataUrl,
                customer_signature_date: today,
            }});
            setShowSignaturePad(false);
            load();
        } catch (err) { alert('Failed to save signature: ' + (err.message || err)); }
    };

    const clearSignature = async () => {
        if (!confirm('Remove the saved signature?')) return;
        try {
            await api(`/repair-orders/${id}`, { method: 'PUT', body: {
                customer_id: ro.customer_id,
                customer_signature: null,
                customer_signature_date: null,
            }});
            load();
        } catch (err) { alert('Failed: ' + (err.message || err)); }
    };

    // Office time allocation — secretary records how many hours a worker spent
    // on this RO. Saved as a closed (clock_in + clock_out) time card so the
    // existing summary view picks it up immediately.
    const saveAllocation = async () => {
        const hrs = parseFloat(allocForm.hours);
        if (!allocForm.employee_id) return alert('Pick a worker.');
        if (!hrs || hrs <= 0) return alert('Enter the hours (must be greater than 0).');
        if (!allocForm.work_date) return alert('Pick a date.');
        // Synthesize a closed time card. Use 9:00 AM local on the work date as
        // a placeholder clock_in; clock_out = clock_in + hours. Server still
        // accepts both clock_in and clock_out as full ISO with Z.
        const start = new Date(allocForm.work_date + 'T09:00:00');
        const end = new Date(start.getTime() + hrs * 3600 * 1000);
        try {
            await api('/time-cards', { method: 'POST', body: {
                employee_id: parseInt(allocForm.employee_id),
                ro_id: parseInt(id),
                clock_in: start.toISOString(),
                clock_out: end.toISOString(),
                hours_worked: hrs,
                activity_type: 'production',
                notes: allocForm.notes || null,
            }});
            setShowAllocateTime(false);
            setAllocForm({employee_id:'', work_date: new Date().toISOString().slice(0,10), hours:'', notes:''});
            load();
        } catch (err) { alert('Failed to allocate: ' + (err.message || err)); }
    };

    const openEditLine = (line) => setEditingLine({...line});
    const saveLineEdit = async () => {
        if (!editingLine) return;
        try {
            const body = {
                operation: editingLine.operation || null,
                description: editingLine.description,
                part_number: editingLine.part_number || null,
                part_type: editingLine.part_type || null,
                quantity: parseFloat(editingLine.quantity) || 1,
                labor_hours: parseFloat(editingLine.labor_hours) || 0,
                labor_rate: parseFloat(editingLine.labor_rate) || 0,
                paint_hours: parseFloat(editingLine.paint_hours) || 0,
                paint_rate: parseFloat(editingLine.paint_rate) || 0,
                part_price: parseFloat(editingLine.part_price) || 0,
                part_cost: parseFloat(editingLine.part_cost) || 0,
                notes: editingLine.notes || null,
            };
            await api(`/repair-orders/${id}/lines/${editingLine.id}`, { method: 'PATCH', body });
            setEditingLine(null);
            load();
        } catch (err) { alert('Failed to save: ' + (err.message || err)); }
    };

    // Suggest the common shop roles plus any roles already used on this RO
    const roleSuggestions = Array.from(new Set([
        'estimator','technician','painter','body tech','helper','detailer','parts',
        ...team.map(t => t.role).filter(Boolean),
    ]));

    const addPayment = async () => {
        await api(`/repair-orders/${id}/payments`, { method: 'POST', body: { ...payForm, amount: parseFloat(payForm.amount) } });
        setShowPayment(false);
        setPayForm({amount:'',payment_method:'insurance',reference_number:'',payer_name:''});
        load();
    };

    // Void a payment even if the RO is closed — the secretary occasionally
    // discovers a wrong amount weeks after the fact and needs to correct it.
    // Backend re-runs recalc_totals so amount_paid / balance_due update.
    const voidPayment = async (p) => {
        const amt = fmt(p.amount);
        const dateStr = p.payment_date ? fmtDate(p.payment_date) : 'no date';
        const method = (p.payment_method || 'payment').replace(/_/g, ' ');
        if (!confirm(`Void this payment?\n\n${amt} · ${method} · ${dateStr}\n\nBalance due will go back up by ${amt}. This can't be undone.`)) return;
        try {
            await api(`/repair-orders/${id}/payments/${p.id}`, { method: 'DELETE' });
            load();
        } catch (err) {
            alert('Failed to void payment: ' + (err.message || err));
        }
    };

    const toggleTaxExempt = async () => {
        try {
            await api(`/repair-orders/${id}`, { method: 'PUT', body: { customer_id: ro.customer_id, tax_exempt: ro.tax_exempt ? 0 : 1 } });
            load();
        } catch (err) { alert('Failed to update tax exemption: ' + (err.message || err)); }
    };

    const changeStatus = async (newStatus) => {
        if (!newStatus || newStatus === ro.status) return;

        // Friendly confirmations for the big transitions.
        const labels = {open:'Open', in_progress:'In Progress', on_hold:'On Hold',
                        completed:'Completed', delivered:'Delivered', closed:'Closed'};
        let prompt = `Change status from "${labels[ro.status]||ro.status}" to "${labels[newStatus]||newStatus}"?`;
        if (newStatus === 'closed' && ro.balance_due > 0) {
            prompt = `This RO has a balance due of ${fmt(ro.balance_due)}. Close it anyway?`;
        } else if (newStatus === 'delivered' && ro.balance_due > 0) {
            prompt = `Mark as delivered with a ${fmt(ro.balance_due)} balance still due?`;
        }
        if (!confirm(prompt)) return;

        try {
            await api(`/repair-orders/${id}/status`, { method: 'PATCH', body: { status: newStatus } });
            load();
        } catch (err) { alert('Failed to update status: ' + (err.message || err)); }
    };

    return (
        <div>
            <div className="page-header">
                <div className="flex items-center gap-2">
                    <button className="btn btn-outline btn-sm" onClick={() => navigate('repair-orders')}><i className="fas fa-arrow-left"></i></button>
                    <h2>{ro.ro_number}</h2>
                    <Badge status={ro.status} />
                    <Badge status={ro.priority} />
                    <select value={ro.status} onChange={e => changeStatus(e.target.value)}
                            title="Change status"
                            style={{padding:'6px 10px', fontSize:13, marginLeft:4}}>
                        <option value="open">Open</option>
                        <option value="in_progress">In Progress</option>
                        <option value="on_hold">On Hold</option>
                        <option value="completed">Completed</option>
                        <option value="delivered">Delivered</option>
                        <option value="closed">Closed</option>
                    </select>
                    {(() => {
                        const cards = ro.time_cards || [];
                        const hours = cards.reduce((s, t) => {
                            if (t.hours_worked) return s + t.hours_worked;
                            const cIn = parseStamp(t.clock_in);
                            return cIn ? s + Math.max(0, (Date.now() - cIn.getTime())/3600000) : s;
                        }, 0);
                        const anyOpen = cards.some(c => !c.clock_out);
                        return (
                            <span onClick={() => setTab('timecards')}
                                  title="Total hours logged on this RO — click to see breakdown"
                                  style={{cursor:'pointer', fontSize:13, fontWeight:600,
                                          padding:'4px 10px', borderRadius:6,
                                          background: anyOpen ? 'rgba(34,197,94,0.15)' : 'rgba(77,184,106,0.12)',
                                          color: anyOpen ? '#22c55e' : 'var(--primary)',
                                          border: '1px solid', borderColor: anyOpen ? '#22c55e' : 'var(--primary)',
                                          marginLeft: 4, display: 'inline-flex', alignItems: 'center', gap: 4}}>
                                <i className={anyOpen ? 'fas fa-circle' : 'fas fa-clock'} style={{fontSize: anyOpen ? 8 : 11}}></i>
                                {hours.toFixed(1)}h logged
                            </span>
                        );
                    })()}
                </div>
                <div className="flex gap-2">
                    <a href={`${API}/exports/ro/${id}/invoice-pdf`} target="_blank" className="btn btn-primary"><i className="fas fa-file-invoice"></i> Invoice PDF</a>
                    <a href={`${API}/exports/ro/${id}/work-order-pdf`} target="_blank" className="btn btn-outline"><i className="fas fa-clipboard-list"></i> Work Order</a>
                </div>
            </div>

            <div className="detail-grid">
                <div className="card">
                    <div className="section-title"><i className="fas fa-user"></i> Customer & Vehicle</div>
                    <div className="detail-row"><span className="detail-label">Customer</span><span className="detail-value clickable" style={{color:'var(--primary)'}} onClick={() => navigate('customer-detail', ro.customer_id)}>{custName(ro)}</span></div>
                    <div className="detail-row"><span className="detail-label">Phone</span><span className="detail-value">{ro.customer_phone||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Vehicle</span><span className="detail-value">{vehDesc(ro)}</span></div>
                    <div className="detail-row"><span className="detail-label">VIN</span><span className="detail-value">{ro.vin||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Color</span><span className="detail-value">{ro.vehicle_color||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">License</span><span className="detail-value">{ro.license_plate||'—'}</span></div>
                </div>
                <div className="card">
                    <div className="section-title"><i className="fas fa-shield-halved"></i> Insurance</div>
                    <div className="detail-row"><span className="detail-label">Insurance</span><span className="detail-value">{ro.insurance_name||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Claim #</span><span className="detail-value">{ro.claim_number||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Policy #</span><span className="detail-value">{ro.policy_number||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Deductible</span><span className="detail-value money">{fmt(ro.deductible)}</span></div>
                    {!(ro.insurance_name || ro.claim_number || ro.deductible > 0) && (
                        <div className="text-muted" style={{padding:8, fontSize:13}}>Customer pay — no insurance on file.</div>
                    )}

                    <div style={{marginTop:14, paddingTop:14, borderTop:'1px solid var(--border)'}}>
                        <div className="section-title" style={{margin:0, marginBottom:8, fontSize:13}}><i className="fas fa-signature"></i> Work Authorization</div>
                        {ro.customer_signature ? (
                            <div>
                                <div style={{padding:8, background:'white', border:'1px solid var(--border)', borderRadius:6, marginBottom:8}}>
                                    <img src={ro.customer_signature} alt="Customer signature" style={{maxWidth:'100%', height:80, objectFit:'contain', display:'block', margin:'0 auto'}} />
                                </div>
                                <div className="text-sm text-muted" style={{marginBottom:8}}>
                                    <i className="fas fa-check-circle text-green" style={{marginRight:4}}></i>
                                    Signed {ro.customer_signature_date ? fmtDate(ro.customer_signature_date) : ''}
                                </div>
                                <div style={{display:'flex', gap:6}}>
                                    <button className="btn btn-outline btn-sm" onClick={() => setShowSignaturePad(true)}>
                                        <i className="fas fa-pen"></i> Re-sign
                                    </button>
                                    <button className="btn btn-outline btn-sm" onClick={clearSignature}
                                            style={{color:'var(--danger)', borderColor:'var(--danger)'}}>
                                        <i className="fas fa-times"></i> Clear
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div>
                                <div className="text-sm text-muted" style={{marginBottom:8}}>
                                    <i className="fas fa-exclamation-circle" style={{color:'#eab308', marginRight:4}}></i>
                                    No signature on file yet.
                                </div>
                                <button className="btn btn-primary btn-sm" onClick={() => setShowSignaturePad(true)}>
                                    <i className="fas fa-signature"></i> Capture Signature
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            </div>

            {/* ── Team card (full width) ── */}
            <div className="card mt-4">
                <div className="card-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <div className="section-title" style={{margin:0}}><i className="fas fa-users"></i> Team ({team.length})</div>
                    <span className="text-muted text-sm">Workers see assigned ROs in their TecStation "My Jobs" grid.</span>
                </div>
                <div className="table-wrapper">
                    <table>
                        <thead><tr><th>Worker</th><th>Role</th><th>Added</th><th style={{width:50}}></th></tr></thead>
                        <tbody>
                            {team.map(m => (
                                <tr key={m.id}>
                                    <td style={{fontWeight:500}}>{m.first_name} {m.last_name} {m.employee_code && <span className="text-muted text-sm">({m.employee_code})</span>}</td>
                                    <td><Badge status={m.role}/></td>
                                    <td className="text-sm text-muted">{m.assigned_at ? new Date(m.assigned_at).toLocaleDateString() : '—'}</td>
                                    <td style={{textAlign:'right'}}>
                                        <button className="btn btn-outline btn-sm" onClick={() => removeTeamMember(m.id)} title="Remove"
                                                style={{padding:'4px 8px', color:'var(--danger)', borderColor:'var(--danger)'}}>
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </td>
                                </tr>
                            ))}
                            {!team.length && (
                                <tr><td colSpan="4" className="text-muted" style={{textAlign:'center', padding:16, fontSize:13}}>
                                    No one assigned yet — add workers below.
                                </td></tr>
                            )}
                        </tbody>
                    </table>
                </div>
                <div style={{marginTop:12, padding:12, background:'var(--bg)', borderRadius:8, border:'1px dashed var(--border)'}}>
                    <div style={{display:'grid', gridTemplateColumns:'2fr 2fr auto', gap:8, alignItems:'end'}}>
                        <div className="form-group" style={{margin:0}}>
                            <label>Worker</label>
                            <select value={newTeamMember.employee_id} onChange={e => setNewTeamMember({...newTeamMember, employee_id: e.target.value})}>
                                <option value="">— Select worker —</option>
                                {employees.filter(e => e.is_active).map(e => (
                                    <option key={e.id} value={e.id}>{e.first_name} {e.last_name}</option>
                                ))}
                            </select>
                        </div>
                        <div className="form-group" style={{margin:0}}>
                            <label>Role</label>
                            <input list="ro-team-role-options" value={newTeamMember.role}
                                   onChange={e => setNewTeamMember({...newTeamMember, role: e.target.value})}
                                   placeholder="e.g. body tech, painter, helper" />
                            <datalist id="ro-team-role-options">
                                {roleSuggestions.map(r => <option key={r} value={r} />)}
                            </datalist>
                        </div>
                        <button className="btn btn-primary" onClick={addTeamMember} disabled={!newTeamMember.employee_id || !newTeamMember.role}>
                            <i className="fas fa-plus"></i> Add Worker
                        </button>
                    </div>
                </div>
            </div>

            {/* Dates */}
            <div className="card mt-4">
                <div className="section-title"><i className="fas fa-calendar"></i> Key Dates</div>
                <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px,1fr))', gap:8}}>
                    {[['Loss Date', ro.loss_date],['Scheduled In', ro.scheduled_in_date],['Vehicle Arrived', ro.vehicle_arrived_date],
                      ['Repair Started', ro.repair_start_date],['Target Delivery', ro.target_delivery_date],['Completed', ro.actual_complete_date],
                      ['Customer Notified', ro.notify_customer_date],['Delivered', ro.delivered_date]].map(([lbl,val]) => (
                        <div key={lbl} className="detail-row"><span className="detail-label">{lbl}</span><span className="detail-value">{fmtDate(val)}</span></div>
                    ))}
                </div>
            </div>

            {/* Tabs */}
            <div className="tabs mt-4">
                {[['lines','Line Items'],['payments','Payments'],['timecards','Time Cards']].map(([k,l]) => (
                    <div key={k} className={`tab ${tab===k?'active':''}`} onClick={() => setTab(k)}>{l}</div>
                ))}
            </div>

            {tab === 'lines' && (
                <div className="card">
                    <div className="card-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                        <h3 style={{margin:0}}>Line Items ({(ro.lines||[]).length})</h3>
                        {ro.status !== 'closed' && ro.status !== 'delivered' && (
                            <button className="btn btn-primary btn-sm" onClick={() => setShowAddLine(!showAddLine)}>
                                <i className={`fas fa-${showAddLine ? 'times' : 'plus'}`}></i> {showAddLine ? 'Cancel' : 'Add Supplement Line'}
                            </button>
                        )}
                    </div>

                    {/* ── Add Supplement Line Form ── */}
                    {showAddLine && (() => {
                        const lt = lineForm.line_type;
                        const lineTotal = computeLineTotal();
                        return (
                            <div style={{padding: 16, background: 'var(--bg)', borderRadius: 8, margin: '12px 0', border: '1px dashed var(--border)'}}>
                                <div style={{display:'flex', gap: 8, marginBottom: 12, flexWrap: 'wrap'}}>
                                    {[{v:'labor',l:'Labor'},{v:'paint',l:'Paint/Refinish'},{v:'part',l:'Parts'},{v:'sublet',l:'Sublet'},{v:'other',l:'Other'}].map(t => (
                                        <button key={t.v} className={`btn btn-sm ${lt === t.v ? 'btn-primary' : 'btn-outline'}`}
                                                onClick={() => setLineField('line_type', t.v)}>{t.l}</button>
                                    ))}
                                </div>
                                <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(180px, 1fr))', gap:10}}>
                                    <div className="form-group" style={{gridColumn:'span 2'}}>
                                        <label>Description <span style={{color:'var(--danger)'}}>*</span></label>
                                        <input value={lineForm.description} onChange={e => setLineField('description', e.target.value)} placeholder="What was done / part name" />
                                    </div>
                                    {lt === 'labor' && <>
                                        <div className="form-group"><label>Hours</label><input type="number" step="0.1" value={lineForm.labor_hours} onChange={e => setLineField('labor_hours', e.target.value)} /></div>
                                        <div className="form-group"><label>Rate $/hr</label><input type="number" step="0.01" value={lineForm.labor_rate} onChange={e => setLineField('labor_rate', e.target.value)} /></div>
                                    </>}
                                    {(lt === 'paint' || lt === 'refinish') && <>
                                        <div className="form-group"><label>Hours</label><input type="number" step="0.1" value={lineForm.paint_hours} onChange={e => setLineField('paint_hours', e.target.value)} /></div>
                                        <div className="form-group"><label>Rate $/hr</label><input type="number" step="0.01" value={lineForm.paint_rate} onChange={e => setLineField('paint_rate', e.target.value)} /></div>
                                    </>}
                                    {lt === 'part' && <>
                                        <div className="form-group">
                                            <label>Part Number {catalog.length > 0 && <span className="text-muted text-sm">(autocompletes)</span>}</label>
                                            <input list="ro-parts-catalog-options" value={lineForm.part_number}
                                                   onChange={e => setLineField('part_number', e.target.value)}
                                                   placeholder="Part # — type to search catalog" />
                                            <datalist id="ro-parts-catalog-options">
                                                {catalog.slice(0, 200).map(p => (
                                                    <option key={p.id} value={p.part_number}>{p.description ? `${p.description} — $${p.standard_price?.toFixed(2)||'0.00'}` : `$${p.standard_price?.toFixed(2)||'0.00'}`}</option>
                                                ))}
                                            </datalist>
                                        </div>
                                        <div className="form-group"><label>Type</label>
                                            <select value={lineForm.part_type} onChange={e => setLineField('part_type', e.target.value)}>
                                                <option value="OEM">OEM (New)</option><option value="aftermarket">Aftermarket</option>
                                                <option value="used">Used/Recycled</option><option value="reconditioned">Reconditioned</option>
                                                <option value="remanufactured">Reman</option>
                                            </select>
                                        </div>
                                        <div className="form-group"><label>Qty</label><input type="number" step="1" value={lineForm.quantity} onChange={e => setLineField('quantity', e.target.value)} /></div>
                                        <div className="form-group"><label>Price each</label><input type="number" step="0.01" value={lineForm.part_price} onChange={e => setLineField('part_price', e.target.value)} /></div>
                                        <div className="form-group"><label>Cost each</label><input type="number" step="0.01" value={lineForm.part_cost} onChange={e => setLineField('part_cost', e.target.value)} /></div>
                                    </>}
                                    {(lt === 'sublet' || lt === 'other') && (
                                        <div className="form-group"><label>Amount</label><input type="number" step="0.01" value={lineForm.part_price} onChange={e => setLineField('part_price', e.target.value)} placeholder="0.00" /></div>
                                    )}
                                </div>
                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:12, paddingTop:12, borderTop:'1px solid var(--border)', gap:16, flexWrap:'wrap'}}>
                                    <div style={{display:'flex', alignItems:'center', gap:16, flexWrap:'wrap'}}>
                                        <div style={{fontSize:15, fontWeight:600}}>
                                            Line Total: <span style={{color:'var(--primary)', fontSize:17}}>{fmt(lineTotal)}</span>
                                        </div>
                                        <label style={{display:'flex', alignItems:'center', gap:6, fontSize:13, cursor: ro.tax_exempt ? 'not-allowed' : 'pointer', opacity: ro.tax_exempt ? 0.5 : 1}}>
                                            <input type="checkbox" checked={!!lineForm.taxable && !ro.tax_exempt} disabled={!!ro.tax_exempt}
                                                   onChange={e => setLineField('taxable', e.target.checked)} />
                                            Tax applies
                                        </label>
                                    </div>
                                    <button className="btn btn-primary" onClick={requestAddLine} disabled={lineSaving || !lineForm.description}>
                                        {lineSaving ? <><i className="fas fa-spinner fa-spin"></i> Adding...</> : <><i className="fas fa-plus"></i> Add to RO</>}
                                    </button>
                                </div>
                            </div>
                        );
                    })()}

                    <div className="table-wrapper">
                        <table><thead><tr><th>#</th><th>Type</th><th>Op</th><th>Description</th><th>Part #</th><th>Qty</th><th>Hours</th><th>Rate</th><th>Parts $</th><th title="Taxable">Tax</th><th>Status</th><th>Total</th>{ro.status !== 'closed' && ro.status !== 'delivered' && <th></th>}</tr></thead>
                        <tbody>
                        {(ro.lines||[]).map(l => (
                            <tr key={l.id} style={l.is_supplement ? {background:'rgba(234,179,8,0.06)'} : {}}>
                                <td>{l.line_number}{l.is_supplement ? <span className="text-muted text-sm" title={`Supplement #${l.supplement_number||1}`} style={{marginLeft:4}}>S{l.supplement_number||1}</span> : ''}</td>
                                <td><Badge status={l.line_type}/></td><td>{l.operation||'—'}</td>
                                <td>{l.description}</td><td className="text-sm">{l.part_number||'—'}</td>
                                <td>{l.quantity}</td><td>{l.labor_hours||l.paint_hours||'—'}</td><td>{l.labor_rate||l.paint_rate||'—'}</td>
                                <td className="money">{l.part_price ? fmt(l.part_price):'—'}</td>
                                <td style={{textAlign:'center'}}>
                                    {(ro.status !== 'closed' && ro.status !== 'delivered') ? (
                                        <button onClick={(e) => { e.stopPropagation(); toggleLineTaxable(l); }}
                                                title={l.taxable ? 'Taxable — click to remove' : 'Not taxable — click to mark taxable'}
                                                disabled={!!ro.tax_exempt}
                                                style={{background:'transparent', border:`1px solid ${l.taxable ? 'var(--primary)' : 'var(--border)'}`,
                                                        borderRadius:4, cursor: ro.tax_exempt ? 'not-allowed' : 'pointer', padding:'2px 8px',
                                                        color: l.taxable ? 'var(--primary)' : 'var(--text-muted)', opacity: ro.tax_exempt ? 0.4 : 1}}>
                                            {l.taxable ? <i className="fas fa-check"></i> : '—'}
                                        </button>
                                    ) : (l.taxable ? <i className="fas fa-check text-green"></i> : <span className="text-muted">—</span>)}
                                </td>
                                <td style={{textAlign:'center'}}>
                                    {(() => {
                                        const cur = l.status || 'pending';
                                        // Color-code the status pill so the shop floor can scan at a glance
                                        const colors = {
                                            pending:   {bg:'rgba(148,163,184,0.15)', fg:'#64748b', border:'#94a3b8'},
                                            ordered:   {bg:'rgba(59,130,246,0.15)',  fg:'#2563eb', border:'#3b82f6'},
                                            received:  {bg:'rgba(6,182,212,0.15)',   fg:'#0891b2', border:'#06b6d4'},
                                            installed: {bg:'rgba(234,179,8,0.15)',   fg:'#a16207', border:'#eab308'},
                                            complete:  {bg:'rgba(77,184,106,0.15)',  fg:'#166534', border:'#4db86a'},
                                        };
                                        const c = colors[cur] || colors.pending;
                                        if (ro.status === 'closed' || ro.status === 'delivered') {
                                            // Locked once the RO is closed — just show the badge
                                            return <Badge status={cur}/>;
                                        }
                                        return (
                                            <select value={cur}
                                                    onChange={e => updateLineStatus(l, e.target.value)}
                                                    onClick={e => e.stopPropagation()}
                                                    title="Change line status"
                                                    style={{
                                                        background: c.bg, color: c.fg,
                                                        border: `1px solid ${c.border}`,
                                                        borderRadius: 4, padding: '3px 6px',
                                                        fontSize: 11, fontWeight: 600,
                                                        textTransform: 'uppercase', cursor: 'pointer',
                                                        appearance: 'auto'
                                                    }}>
                                                <option value="pending">Pending</option>
                                                <option value="ordered">Ordered</option>
                                                <option value="received">Received</option>
                                                <option value="installed">Installed</option>
                                                <option value="complete">Complete</option>
                                            </select>
                                        );
                                    })()}
                                </td>
                                <td className="money" style={{fontWeight:600}}>{fmt(l.line_total)}</td>
                                {ro.status !== 'closed' && ro.status !== 'delivered' && (
                                    <td style={{whiteSpace:'nowrap', textAlign:'right'}}>
                                        <button className="btn btn-outline btn-sm" onClick={() => moveLine(l.id, 'up')} title="Move up"
                                                disabled={(ro.lines||[])[0]?.id === l.id}
                                                style={{padding:'4px 6px', marginRight:2}}><i className="fas fa-arrow-up"></i></button>
                                        <button className="btn btn-outline btn-sm" onClick={() => moveLine(l.id, 'down')} title="Move down"
                                                disabled={(ro.lines||[]).slice(-1)[0]?.id === l.id}
                                                style={{padding:'4px 6px', marginRight:4}}><i className="fas fa-arrow-down"></i></button>
                                        <button className="btn btn-outline btn-sm" onClick={() => openEditLine(l)} title="Edit line"
                                                style={{padding:'4px 8px', marginRight:4}}><i className="fas fa-edit"></i></button>
                                        <button className="btn btn-outline btn-sm" onClick={() => deleteLine(l.id)} title="Delete line"
                                                style={{color:'var(--danger)', borderColor:'var(--danger)', padding:'4px 8px'}}><i className="fas fa-trash"></i></button>
                                    </td>
                                )}
                            </tr>
                        ))}
                        </tbody></table>
                    </div>
                    <div style={{display:'flex', justifyContent:'flex-end', marginTop:16}}>
                        <div style={{width:300}}>
                            <div className="detail-row"><span className="detail-label">Labor</span><span className="detail-value money">{fmt(ro.subtotal_labor)}</span></div>
                            <div className="detail-row"><span className="detail-label">Parts</span><span className="detail-value money">{fmt(ro.subtotal_parts)}</span></div>
                            <div className="detail-row"><span className="detail-label">Paint</span><span className="detail-value money">{fmt(ro.subtotal_paint)}</span></div>
                            <div className="detail-row">
                                <span className="detail-label" style={{display:'flex', alignItems:'center', gap:6}}>
                                    Tax
                                    {ro.status !== 'closed' && ro.status !== 'delivered' && (
                                        <label style={{fontSize:11, fontWeight:500, cursor:'pointer', color:'var(--text-muted)', display:'flex', alignItems:'center', gap:3}}>
                                            <input type="checkbox" checked={!!ro.tax_exempt} onChange={toggleTaxExempt} style={{margin:0}} />
                                            Exempt
                                        </label>
                                    )}
                                </span>
                                <span className="detail-value money">
                                    {ro.tax_exempt ? <span className="text-muted" style={{fontSize:13, fontWeight:500}}>EXEMPT</span> : fmt(ro.tax_amount)}
                                </span>
                            </div>
                            {!ro.tax_exempt && !ro.tax_amount && (ro.lines||[]).length > 0 && !(ro.lines||[]).some(l => l.taxable) && (
                                <div className="text-sm text-muted" style={{padding:'4px 0 8px', fontStyle:'italic'}}>
                                    <i className="fas fa-info-circle" style={{marginRight:4}}></i>
                                    No lines marked taxable. Click the <b>Tax</b> column on a line to make it taxable.
                                </div>
                            )}
                            <div className="detail-row" style={{borderTop:'2px solid var(--border)'}}><span className="detail-label" style={{fontWeight:700}}>Total</span><span className="detail-value money" style={{fontSize:16}}>{fmt(ro.total_amount)}</span></div>
                            <div className="detail-row"><span className="detail-label">Paid</span><span className="detail-value money text-green">{fmt(ro.amount_paid)}</span></div>
                            <div className="detail-row" style={{borderTop:'2px solid var(--primary)'}}><span className="detail-label" style={{fontWeight:700,fontSize:15}}>Balance Due</span><span className="detail-value money" style={{fontSize:18,color: ro.balance_due > 0 ? 'var(--red)':'var(--green)'}}>{fmt(ro.balance_due)}</span></div>
                        </div>
                    </div>
                </div>
            )}

            {tab === 'payments' && (
                <div className="card">
                    <div className="card-header"><h3>Payments</h3><button className="btn btn-primary btn-sm" onClick={() => setShowPayment(true)}><i className="fas fa-plus"></i> Add Payment</button></div>
                    <table><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th><th>Payer</th><th style={{width:50}}></th></tr></thead>
                    <tbody>
                    {(ro.payments||[]).map(p => (
                        <tr key={p.id}>
                            <td>{fmtDate(p.payment_date)}</td>
                            <td className="money text-green" style={{fontWeight:600}}>{fmt(p.amount)}</td>
                            <td>{(p.payment_method||'').replace(/_/g,' ')}</td>
                            <td>{p.reference_number||'—'}</td>
                            <td>{p.payer_name||'—'}</td>
                            <td style={{textAlign:'right'}}>
                                <button className="btn btn-outline btn-sm"
                                        onClick={() => voidPayment(p)}
                                        title="Void this payment"
                                        style={{color:'var(--danger)', borderColor:'var(--danger)', padding:'4px 8px'}}>
                                    <i className="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    ))}
                    {!(ro.payments||[]).length && <tr><td colSpan="6" className="text-muted" style={{textAlign:'center',padding:24}}>No payments recorded</td></tr>}
                    </tbody></table>
                    {(ro.payments||[]).length > 0 && (
                        <div className="text-sm text-muted" style={{padding:'8px 14px', borderTop:'1px solid var(--border)', lineHeight:1.4}}>
                            <i className="fas fa-info-circle" style={{marginRight:4}}></i>
                            Voiding a payment updates balance due and works even after the RO is closed.
                        </div>
                    )}
                </div>
            )}

            {tab === 'timecards' && (() => {
                const cards = ro.time_cards || [];
                // Compute live elapsed for any open cards (clock_in but no clock_out)
                const liveHours = (t) => {
                    if (t.hours_worked) return t.hours_worked;
                    const cIn = parseStamp(t.clock_in);
                    if (!cIn) return 0;
                    return Math.max(0, (Date.now() - cIn.getTime()) / 3600000);
                };
                const totalHours = cards.reduce((s, t) => s + liveHours(t), 0);
                // Per-employee summary
                const byEmp = {};
                cards.forEach(t => {
                    const key = t.employee_id || 0;
                    const name = [t.first_name, t.last_name].filter(Boolean).join(' ') || `#${key}`;
                    if (!byEmp[key]) byEmp[key] = { name, hours: 0, sessions: 0, open: false };
                    byEmp[key].hours += liveHours(t);
                    byEmp[key].sessions += 1;
                    if (!t.clock_out) byEmp[key].open = true;
                });
                const empRows = Object.values(byEmp).sort((a,b) => b.hours - a.hours);
                const fmtH = (h) => `${h.toFixed(2)} hrs`;

                return (
                    <div>
                        {/* Allocate-time button — visible on any RO so secretary can
                            retroactively log hours even on Completed/Delivered/Closed jobs */}
                        <div style={{marginBottom: 12, textAlign:'right'}}>
                            <button className="btn btn-primary" onClick={() => setShowAllocateTime(true)}>
                                <i className="fas fa-plus"></i> Allocate Worker Hours to this RO
                            </button>
                        </div>
                        {/* Summary cards */}
                        <div className="card" style={{marginBottom:16, padding:16, background:'rgba(77,184,106,0.06)', borderLeft:'3px solid var(--primary)'}}>
                            <div style={{display:'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap:16}}>
                                <div>
                                    <div className="text-sm text-muted">Total Hours on this RO</div>
                                    <div style={{fontSize:32, fontWeight:700, color:'var(--primary)'}}>{fmtH(totalHours)}</div>
                                </div>
                                <div>
                                    <div className="text-sm text-muted">Sessions</div>
                                    <div style={{fontSize:24, fontWeight:600}}>{cards.length}</div>
                                </div>
                                <div>
                                    <div className="text-sm text-muted">Workers</div>
                                    <div style={{fontSize:24, fontWeight:600}}>{empRows.length}</div>
                                </div>
                                {empRows.some(e => e.open) && (
                                    <div>
                                        <div className="text-sm text-muted">Currently Working</div>
                                        <div style={{fontSize:16, fontWeight:600, color:'#22c55e'}}>
                                            <i className="fas fa-circle" style={{fontSize:8, marginRight:6}}></i>
                                            {empRows.filter(e => e.open).map(e => e.name).join(', ')}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Per-employee breakdown */}
                        {empRows.length > 0 && (
                            <div className="card" style={{marginBottom:16}}>
                                <div className="card-header"><h3>By Worker</h3></div>
                                <div className="table-wrapper">
                                    <table>
                                        <thead><tr><th>Worker</th><th>Sessions</th><th style={{textAlign:'right'}}>Hours</th></tr></thead>
                                        <tbody>
                                            {empRows.map((e, i) => (
                                                <tr key={i}>
                                                    <td style={{fontWeight:500}}>{e.name} {e.open && <span className="text-green text-sm" style={{marginLeft:6}}><i className="fas fa-circle" style={{fontSize:8}}></i> active</span>}</td>
                                                    <td>{e.sessions}</td>
                                                    <td className="money" style={{fontWeight:600}}>{fmtH(e.hours)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* Detailed session log */}
                        <div className="card">
                            <div className="card-header"><h3>Session Log</h3></div>
                            <div className="table-wrapper">
                                <table>
                                    <thead><tr><th>Worker</th><th>Clock In</th><th>Clock Out</th><th style={{textAlign:'right'}}>Hours</th><th>Type</th></tr></thead>
                                    <tbody>
                                        {cards.map(t => (
                                            <tr key={t.id}>
                                                <td>{[t.first_name, t.last_name].filter(Boolean).join(' ')||'—'}</td>
                                                <td className="text-sm">{fmtDateTime(t.clock_in)}</td>
                                                <td className="text-sm">{t.clock_out ? fmtDateTime(t.clock_out) : <span className="text-green"><i className="fas fa-circle" style={{fontSize:8, marginRight:4}}></i> still working</span>}</td>
                                                <td className="money">{fmtH(liveHours(t))}</td>
                                                <td>{(t.activity_type||'').replace(/_/g,' ')}</td>
                                            </tr>
                                        ))}
                                        {!cards.length && <tr><td colSpan="5" className="text-muted" style={{textAlign:'center',padding:24}}>No time cards yet — workers will appear here once they clock in to this RO.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            })()}

            <Modal open={showPayment} onClose={() => setShowPayment(false)} title="Record Payment">
                <div className="form-grid">
                    <div className="form-group"><label>Amount</label><input type="number" step="0.01" value={payForm.amount} onChange={e => setPayForm({...payForm, amount: e.target.value})} /></div>
                    <div className="form-group"><label>Method</label>
                        <select value={payForm.payment_method} onChange={e => setPayForm({...payForm, payment_method: e.target.value})}>
                            <option value="insurance">Insurance</option><option value="check">Check</option>
                            <option value="cash">Cash</option><option value="credit_card">Credit Card</option>
                            <option value="debit">Debit</option><option value="other">Other</option>
                        </select>
                    </div>
                    <div className="form-group"><label>Reference #</label><input value={payForm.reference_number} onChange={e => setPayForm({...payForm, reference_number: e.target.value})} /></div>
                    <div className="form-group"><label>Payer Name</label><input value={payForm.payer_name} onChange={e => setPayForm({...payForm, payer_name: e.target.value})} /></div>
                </div>
                <div className="modal-actions"><button className="btn btn-outline" onClick={() => setShowPayment(false)}>Cancel</button><button className="btn btn-success" onClick={addPayment}><i className="fas fa-check"></i> Record Payment</button></div>
            </Modal>

            {/* ── Signature pad ── */}
            <Modal open={showSignaturePad} onClose={() => setShowSignaturePad(false)} title="Customer Work Authorization">
                {showSignaturePad && (
                    <SignaturePad
                        existing={ro.customer_signature}
                        onSave={saveSignature}
                        onCancel={() => setShowSignaturePad(false)} />
                )}
            </Modal>

            {/* ── Allocate worker hours to this RO ── */}
            <Modal open={showAllocateTime} onClose={() => setShowAllocateTime(false)} title="Allocate Worker Hours to this RO">
                <div style={{padding:12, background:'rgba(77,184,106,0.06)', borderLeft:'3px solid var(--primary)', borderRadius:6, marginBottom:14, fontSize:13, lineHeight:1.5}}>
                    <i className="fas fa-info-circle" style={{marginRight:6, color:'var(--primary)'}}></i>
                    Use this at end of day to record how many hours each worker spent on this specific RO,
                    based on what they tell you. This adds to the running total on this RO without affecting
                    their general daily clock-in.
                </div>
                <div className="form-grid">
                    <div className="form-group">
                        <label>Worker <span style={{color:'var(--danger)'}}>*</span></label>
                        <select value={allocForm.employee_id} onChange={e => setAllocForm({...allocForm, employee_id: e.target.value})}>
                            <option value="">— Select worker —</option>
                            {employees.filter(e => e.is_active).map(e => (
                                <option key={e.id} value={e.id}>{e.first_name} {e.last_name}</option>
                            ))}
                        </select>
                    </div>
                    <div className="form-group">
                        <label>Date</label>
                        <input type="date" value={allocForm.work_date} onChange={e => setAllocForm({...allocForm, work_date: e.target.value})} />
                    </div>
                    <div className="form-group">
                        <label>Hours on this RO <span style={{color:'var(--danger)'}}>*</span></label>
                        <input type="number" step="0.25" min="0" value={allocForm.hours}
                               onChange={e => setAllocForm({...allocForm, hours: e.target.value})}
                               placeholder="e.g. 3.5" autoFocus />
                    </div>
                </div>
                <div className="form-group" style={{marginTop:12}}>
                    <label>Notes (optional)</label>
                    <textarea value={allocForm.notes} onChange={e => setAllocForm({...allocForm, notes: e.target.value})}
                              placeholder="e.g. Body work on driver door, prep + paint" />
                </div>
                <div className="modal-actions">
                    <button className="btn btn-outline" onClick={() => setShowAllocateTime(false)}>Cancel</button>
                    <button className="btn btn-primary" onClick={saveAllocation}>
                        <i className="fas fa-save"></i> Save Allocation
                    </button>
                </div>
            </Modal>

            {/* ── Supplement warning before adding a line to an RO ── */}
            <Modal open={!!supplementWarn} onClose={() => setSupplementWarn(null)} title="Heads up — this changes the RO total">
                {supplementWarn && (() => {
                    const currentTotal = ro.total_amount || 0;
                    const lineDelta = supplementWarn.newLineTotal || 0;
                    const taxRateRow = rates.find(r => r.rate_type === 'sales_tax_rate');
                    const taxRate = (taxRateRow ? taxRateRow.rate_amount : 6.25) / 100;
                    const taxOnLine = (lineForm.taxable && !ro.tax_exempt) ? lineDelta * taxRate : 0;
                    const newTotal = currentTotal + lineDelta + taxOnLine;
                    const origEst = ro.original_estimate_total;
                    const diffFromEstimate = origEst != null ? (newTotal - origEst) : null;
                    return (
                        <div>
                            <div style={{padding:14, background:'rgba(234,179,8,0.08)', borderLeft:'3px solid #eab308', borderRadius:6, marginBottom:14, fontSize:13}}>
                                <i className="fas fa-exclamation-triangle" style={{color:'#eab308', marginRight:6}}></i>
                                You're about to add a <b>supplement line</b> to this RO. The total will change from what was originally quoted on the estimate.
                                Make sure the customer (and insurance, if applicable) is aware before you commit.
                            </div>
                            <div style={{padding:14, background:'var(--bg)', borderRadius:8, border:'1px solid var(--border)'}}>
                                {origEst != null && (
                                    <div className="detail-row"><span className="detail-label">Original Estimate{ro.original_estimate_number ? ` (${ro.original_estimate_number})` : ''}</span><span className="detail-value money">{fmt(origEst)}</span></div>
                                )}
                                <div className="detail-row"><span className="detail-label">Current RO Total</span><span className="detail-value money">{fmt(currentTotal)}</span></div>
                                <div className="detail-row"><span className="detail-label">This line</span><span className="detail-value money text-green">+{fmt(lineDelta)}</span></div>
                                {taxOnLine > 0 && (
                                    <div className="detail-row"><span className="detail-label">Sales tax on line</span><span className="detail-value money text-green">+{fmt(taxOnLine)}</span></div>
                                )}
                                <div className="detail-row" style={{borderTop:'2px solid var(--primary)', paddingTop:8, marginTop:6}}>
                                    <span className="detail-label" style={{fontWeight:700, fontSize:15}}>New Total</span>
                                    <span className="detail-value money" style={{fontSize:18, color:'var(--primary)', fontWeight:700}}>{fmt(newTotal)}</span>
                                </div>
                                {diffFromEstimate != null && (
                                    <div className="detail-row" style={{paddingTop:6}}>
                                        <span className="detail-label text-sm">vs. original estimate</span>
                                        <span className="detail-value money text-sm" style={{color: diffFromEstimate > 0 ? 'var(--danger)' : 'var(--text-muted)'}}>
                                            {diffFromEstimate > 0 ? '+' : ''}{fmt(diffFromEstimate)}
                                        </span>
                                    </div>
                                )}
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-outline" onClick={() => setSupplementWarn(null)}>
                                    <i className="fas fa-times"></i> Cancel
                                </button>
                                <button className="btn btn-warning" onClick={confirmAddLine} disabled={lineSaving}>
                                    <i className="fas fa-plus"></i> Add Supplement Line
                                </button>
                            </div>
                        </div>
                    );
                })()}
            </Modal>

            {/* ── Edit existing line ── */}
            <Modal open={!!editingLine} onClose={() => setEditingLine(null)} title={`Edit Line ${editingLine?.line_number || ''}`}>
                {editingLine && (() => {
                    const lt = editingLine.line_type;
                    const setF = (k, v) => setEditingLine({...editingLine, [k]: v});
                    return (
                        <div>
                            <div className="text-sm text-muted" style={{marginBottom:10}}>
                                Type: <b>{lt}</b> {editingLine.is_supplement ? <span style={{color:'#eab308'}}> (supplement #{editingLine.supplement_number||1})</span> : ''}
                            </div>
                            <div className="form-group" style={{marginBottom:10}}>
                                <label>Description</label>
                                <input value={editingLine.description||''} onChange={e => setF('description', e.target.value)} />
                            </div>
                            <div className="form-grid">
                                <div className="form-group"><label>Operation</label>
                                    <input value={editingLine.operation||''} onChange={e => setF('operation', e.target.value)} placeholder="e.g. repair" />
                                </div>
                                {lt === 'labor' && <>
                                    <div className="form-group"><label>Hours</label><input type="number" step="0.1" value={editingLine.labor_hours||0} onChange={e => setF('labor_hours', e.target.value)} /></div>
                                    <div className="form-group"><label>Rate $/hr</label><input type="number" step="0.01" value={editingLine.labor_rate||0} onChange={e => setF('labor_rate', e.target.value)} /></div>
                                </>}
                                {(lt === 'paint' || lt === 'refinish') && <>
                                    <div className="form-group"><label>Hours</label><input type="number" step="0.1" value={editingLine.paint_hours||0} onChange={e => setF('paint_hours', e.target.value)} /></div>
                                    <div className="form-group"><label>Rate $/hr</label><input type="number" step="0.01" value={editingLine.paint_rate||0} onChange={e => setF('paint_rate', e.target.value)} /></div>
                                </>}
                                {lt === 'part' && <>
                                    <div className="form-group"><label>Part #</label><input value={editingLine.part_number||''} onChange={e => setF('part_number', e.target.value)} /></div>
                                    <div className="form-group"><label>Type</label>
                                        <select value={editingLine.part_type||'OEM'} onChange={e => setF('part_type', e.target.value)}>
                                            <option value="OEM">OEM</option><option value="aftermarket">Aftermarket</option>
                                            <option value="used">Used</option><option value="reconditioned">Reconditioned</option>
                                            <option value="remanufactured">Reman</option>
                                        </select>
                                    </div>
                                    <div className="form-group"><label>Qty</label><input type="number" step="1" value={editingLine.quantity||1} onChange={e => setF('quantity', e.target.value)} /></div>
                                    <div className="form-group"><label>Price each</label><input type="number" step="0.01" value={editingLine.part_price||0} onChange={e => setF('part_price', e.target.value)} /></div>
                                    <div className="form-group"><label>Cost each</label><input type="number" step="0.01" value={editingLine.part_cost||0} onChange={e => setF('part_cost', e.target.value)} /></div>
                                </>}
                                {(lt === 'sublet' || lt === 'other') && (
                                    <div className="form-group"><label>Amount</label><input type="number" step="0.01" value={editingLine.part_price||0} onChange={e => setF('part_price', e.target.value)} /></div>
                                )}
                            </div>
                            <div className="form-group" style={{marginTop:10}}>
                                <label>Notes</label>
                                <textarea value={editingLine.notes||''} onChange={e => setF('notes', e.target.value)} />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-outline" onClick={() => setEditingLine(null)}>Cancel</button>
                                <button className="btn btn-primary" onClick={saveLineEdit}><i className="fas fa-save"></i> Save</button>
                            </div>
                        </div>
                    );
                })()}
            </Modal>

            {/* ── Save-to-catalog prompt after a part with a part_number is added ── */}
            <Modal open={!!catalogPrompt} onClose={() => setCatalogPrompt(null)}
                   title={catalogPrompt?.existing ? 'Update price in catalog?' : 'Save part to catalog?'}>
                {catalogPrompt && (
                    <div>
                        <div style={{fontSize: 13, color: 'var(--text-muted)', marginBottom: 16, lineHeight: 1.5}}>
                            {catalogPrompt.existing
                                ? `You already have part #${catalogPrompt.part_number} in the catalog at ${fmt(catalogPrompt.existing.standard_price)}. The new price you just quoted is different — should I update the catalog so future estimates use the new price?`
                                : 'Saving this part to the catalog means next time you type this Part Number, the description and price auto-fill — no need to call the vendor again.'}
                        </div>
                        <div style={{padding:14, background:'var(--bg)', borderRadius:8, border:'1px solid var(--border)', marginBottom:16}}>
                            <div className="detail-row"><span className="detail-label">Part #</span><span className="detail-value" style={{fontFamily:'monospace', fontWeight:600}}>{catalogPrompt.part_number}</span></div>
                            <div className="detail-row"><span className="detail-label">Description</span><span className="detail-value">{catalogPrompt.description||'—'}</span></div>
                            {catalogPrompt.existing && (
                                <div className="detail-row"><span className="detail-label">Old Price</span><span className="detail-value money text-muted" style={{textDecoration:'line-through'}}>{fmt(catalogPrompt.existing.standard_price)}</span></div>
                            )}
                            <div className="detail-row"><span className="detail-label">{catalogPrompt.existing ? 'New Price' : 'Price'}</span><span className="detail-value money" style={{fontWeight:600, color:'var(--primary)'}}>{fmt(catalogPrompt.price)}</span></div>
                            {catalogPrompt.cost > 0 && (
                                <div className="detail-row"><span className="detail-label">Cost</span><span className="detail-value money">{fmt(catalogPrompt.cost)}</span></div>
                            )}
                        </div>
                        <div className="modal-actions">
                            <button className="btn btn-outline" onClick={() => setCatalogPrompt(null)}>
                                <i className="fas fa-times"></i> Skip
                            </button>
                            <button className="btn btn-primary" onClick={acceptCatalogSave}>
                                <i className="fas fa-database"></i> {catalogPrompt.existing ? 'Update Catalog' : 'Save to Catalog'}
                            </button>
                        </div>
                    </div>
                )}
            </Modal>
        </div>
    );
}
