<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collision Shop Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #111318; --bg-card: #1a1d24; --bg-input: #22262e;
            --border: #2e3340; --text: #e4e6eb; --text-muted: #8b8f9a;
            --primary: #4db86a; --primary-hover: #3a9c54;
            --green: #4db86a; --yellow: #eab308; --red: #ef4444; --orange: #f97316;
            --purple: #a855f7;
            --sidebar-w: 240px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        button { color: inherit; font-family: inherit; }

        /* ─── Layout ─── */
        .app { display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--bg-card); border-right: 1px solid var(--border); position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; }
        .main { margin-left: var(--sidebar-w); flex: 1; padding: 24px; min-height: 100vh; }

        /* ─── Sidebar ─── */
        .sidebar-brand { padding: 20px 16px; border-bottom: 1px solid var(--border); }
        .sidebar-brand h1 { font-size: 18px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .sidebar-brand span { font-size: 11px; color: var(--text-muted); display: block; margin-top: 2px; }
        .nav-section { padding: 12px 0; }
        .nav-section-title { font-size: 10px; text-transform: uppercase; color: var(--text-muted); padding: 0 16px; margin-bottom: 4px; letter-spacing: 1px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; color: var(--text-muted); font-size: 14px; transition: all 0.15s; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .nav-item.active { background: rgba(77,184,106,0.12); color: var(--primary); border-left-color: var(--primary); }
        .nav-item i { width: 18px; text-align: center; font-size: 14px; }

        /* ─── Common ─── */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-header h2 { font-size: 24px; font-weight: 600; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--green); color: white; }
        .btn-danger { background: var(--red); color: white; }
        .btn-warning { background: var(--yellow); color: #000; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-header h3 { font-size: 16px; font-weight: 600; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
        .stat-card .value.green { color: var(--green); }
        .stat-card .value.blue { color: var(--primary); }
        .stat-card .value.yellow { color: var(--yellow); }
        .stat-card .value.red { color: var(--red); }

        /* ─── Table ─── */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        td { padding: 10px 12px; border-bottom: 1px solid rgba(71,85,105,0.3); vertical-align: middle; }
        tr:hover td { background: rgba(77,184,106,0.05); }
        .clickable { cursor: pointer; }

        /* ─── Status Badges ─── */
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .badge-draft { background: rgba(148,163,184,0.2); color: var(--text-muted); }
        .badge-pending { background: rgba(234,179,8,0.2); color: var(--yellow); }
        .badge-approved { background: rgba(34,197,94,0.2); color: var(--green); }
        .badge-rejected { background: rgba(239,68,68,0.2); color: var(--red); }
        .badge-converted { background: rgba(168,85,247,0.2); color: var(--purple); }
        .badge-open { background: rgba(77,184,106,0.2); color: var(--primary); }
        .badge-in_progress, .badge-in-progress { background: rgba(249,115,22,0.2); color: var(--orange); }
        .badge-on_hold, .badge-on-hold { background: rgba(234,179,8,0.2); color: var(--yellow); }
        .badge-completed { background: rgba(34,197,94,0.2); color: var(--green); }
        .badge-delivered { background: rgba(168,85,247,0.2); color: var(--purple); }
        .badge-closed { background: rgba(148,163,184,0.2); color: var(--text-muted); }
        .badge-rush { background: rgba(239,68,68,0.2); color: var(--red); }
        .badge-high { background: rgba(249,115,22,0.2); color: var(--orange); }
        .badge-normal { background: rgba(77,184,106,0.2); color: var(--primary); }
        .badge-low { background: rgba(148,163,184,0.2); color: var(--text-muted); }

        /* ─── Forms ─── */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        input, select, textarea { padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; outline: none; transition: border 0.15s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        textarea { min-height: 80px; resize: vertical; font-family: inherit; }

        .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-bar input { flex: 1; }

        /* ─── Tabs ─── */
        .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; color: var(--text-muted); font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* ─── Detail View ─── */
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(71,85,105,0.2); }
        .detail-label { color: var(--text-muted); font-size: 13px; }
        .detail-value { font-size: 13px; font-weight: 500; }
        .section-title { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 12px; margin-top: 8px; display: flex; align-items: center; gap: 8px; }

        /* ─── Modal ─── */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; max-width: 700px; width: 95%; max-height: 85vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 16px; font-size: 18px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .detail-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }

        /* ─── Utilities ─── */
        .money { font-variant-numeric: tabular-nums; }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .flex-1 { flex: 1; }
        .w-full { width: 100%; }
        .empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; display: block; }

        /* ─── Login Screen ─── */
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
        .login-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 380px; text-align: center; }
        .login-box h1 { font-size: 24px; color: var(--text); margin-bottom: 4px; }
        .login-box .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
        .login-box .form-group { margin-bottom: 16px; text-align: left; }
        .login-box input { width: 100%; padding: 12px; font-size: 16px; }
        .login-box .btn { width: 100%; padding: 12px; font-size: 15px; margin-top: 8px; justify-content: center; }
        .login-error { color: var(--red); font-size: 13px; margin-top: 8px; }
        .login-logo { font-size: 48px; color: var(--primary); margin-bottom: 16px; }

        /* ─── Time Clock (Worker View) ─── */
        .clock-display { font-size: 64px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; margin: 16px 0; }
        .clock-date { font-size: 16px; color: var(--text-muted); margin-bottom: 24px; }
        .clock-status { padding: 20px; border-radius: 12px; margin-bottom: 24px; font-size: 22px; font-weight: 600; }
        .clock-status.clocked-in { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .clock-status.clocked-out { background: rgba(148,163,184,0.15); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.3); }
        .clock-btn { padding: 28px 56px; font-size: 24px; border-radius: 16px; font-weight: 700; letter-spacing: 0.5px; min-width: 250px; }
        .worker-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
        .worker-header h1 { font-size: 18px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .worker-main { padding: 24px; max-width: 900px; margin: 0 auto; }
        .worker-tabs { display: flex; gap: 0; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0; }
        .worker-tab { padding: 18px 28px; cursor: pointer; color: var(--text-muted); font-size: 16px; font-weight: 600; border-bottom: 3px solid transparent; transition: all 0.15s; flex: 1; text-align: center; -webkit-tap-highlight-color: transparent; }
        .worker-tab:hover { color: var(--text); }
        .worker-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255,255,255,0.03); }
        .job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .job-card .job-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .job-card .job-title { font-weight: 600; font-size: 18px; }
        .job-card .job-detail { font-size: 15px; color: var(--text-muted); }

        /* ─── Touch Login (TecStation) ─── */
        .touch-login { min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
        .touch-login-logo { margin-bottom: 16px; }
        .touch-login h2 { color: var(--primary); font-size: 20px; margin-bottom: 24px; }
        .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; width: 100%; max-width: 700px; }
        .worker-card { background: var(--bg-card); border: 2px solid var(--border); border-radius: 16px; padding: 24px 12px; text-align: center; cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; user-select: none; color: var(--text); font-family: inherit; }
        .worker-card:active { transform: scale(0.96); border-color: var(--primary); }
        .worker-card:hover { border-color: var(--primary); background: rgba(255,255,255,0.05); }
        .worker-card.selected { border-color: var(--primary); background: rgba(255,255,255,0.07); }
        .worker-card .worker-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 24px; font-weight: 700; color: var(--primary); }
        .worker-card .worker-label { font-size: 15px; font-weight: 600; color: var(--text); }

        .pin-pad { display: grid; grid-template-columns: repeat(3, 80px); gap: 12px; justify-content: center; margin: 20px 0; }
        .pin-key { width: 80px; height: 70px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg-card); color: #fff; font-size: 28px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; -webkit-tap-highlight-color: transparent; user-select: none; font-family: inherit; }
        .pin-key:active { background: var(--primary); color: white; transform: scale(0.95); }
        .pin-dots { display: flex; gap: 12px; justify-content: center; margin: 16px 0; }
        .pin-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); background: transparent; }
        .pin-dot.filled { background: var(--primary); border-color: var(--primary); }

        /* ─── Touch-friendly buttons ─── */
        .touch-btn { padding: 18px 24px; font-size: 20px; border-radius: 12px; font-weight: 700; min-height: 56px; -webkit-tap-highlight-color: transparent; user-select: none; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; color: var(--text); font-family: inherit; }
        .touch-btn:active { transform: scale(0.97); }
        .touch-btn-primary { background: var(--primary); color: white; }
        .touch-btn-primary:hover { background: #3da85a; }
        .touch-btn-success { background: #22c55e; color: white; font-size: 28px; padding: 24px 48px; }
        .touch-btn-success:hover { background: #16a34a; }
        .touch-btn-danger { background: var(--red); color: white; font-size: 28px; padding: 24px 48px; }
        .touch-btn-danger:hover { background: #b91c1c; }
        .touch-btn-outline { background: var(--bg-card); color: var(--text); border: 2px solid var(--border); }
        .touch-btn-outline:hover { background: var(--bg); border-color: var(--primary); color: var(--primary); }
        .touch-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .pin-key-back { background: var(--bg); color: var(--text-muted); font-size: 22px; font-family: inherit; }
        .touch-move-btn { padding: 14px 20px; font-size: 15px; border-radius: 10px; font-weight: 600; min-height: 48px; -webkit-tap-highlight-color: transparent; user-select: none; cursor: pointer; text-align: center; background: transparent; border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); font-family: inherit; }
        .touch-move-btn:active { transform: scale(0.96); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .picker-row:hover { background: rgba(255,255,255,0.06) !important; }
    </style>
</head>
<body>
<div id="root"></div>
<script src="/parts-catalog.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ═══════════════════════════════════════════════════════════
// API CLIENT
// ═══════════════════════════════════════════════════════════
const API = window.location.origin + '/api';

// Auth token stored in memory
let _authToken = localStorage.getItem('shop_token') || null;

function setAuthToken(token) {
    _authToken = token;
    if (token) localStorage.setItem('shop_token', token);
    else localStorage.removeItem('shop_token');
}

async function api(path, opts = {}) {
    const url = API + path;
    const headers = { 'Content-Type': 'application/json' };
    if (_authToken) headers['Authorization'] = `Bearer ${_authToken}`;
    const config = { headers, ...opts };
    if (config.body && typeof config.body === 'object') config.body = JSON.stringify(config.body);
    const res = await fetch(url, config);
    if (res.status === 401) {
        setAuthToken(null);
        window.dispatchEvent(new Event('auth-expired'));
        throw new Error('Session expired');
    }
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `API error ${res.status}`);
    }
    return res.json();
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const fmt = (n) => n != null ? `$${Number(n).toLocaleString('en-US', {minimumFractionDigits: 2})}` : '—';
const fmtDate = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString() : '—';

// Parse a clock_in/out string from the API. Tolerates two formats:
//   1. Current: "2026-04-29T13:00:00.000Z" (proper ISO UTC)
//   2. Legacy:  "2026-04-29 13:00:00" (UTC time written without TZ marker)
// For #2, `new Date(s)` would interpret as LOCAL — append Z to force UTC.
const parseStamp = (s) => {
    if (!s) return null;
    if (/[Zz]$|[+\-]\d{2}:?\d{2}$/.test(s)) return new Date(s);
    return new Date(s.replace(' ', 'T') + 'Z');
};
const fmtDateTime = (s) => {
    const d = parseStamp(s);
    return d ? d.toLocaleString([], {year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
};
const custName = (r) => r.company_name || [r.first_name, r.last_name].filter(Boolean).join(' ') || '—';
const vehDesc = (r) => [r.vehicle_year||r.year, r.vehicle_make||r.make, r.vehicle_model||r.model].filter(Boolean).join(' ') || '—';

// ── Vehicle types & their per-type field config ──────────────────────────────
// `id_label`  → what to call the primary identifier (VIN vs Serial #)
// `usage`     → 'mileage' | 'engine_hours' | 'none'
// `is_trailer`→ show length + axle count
const VEHICLE_TYPES = [
    { value: 'tractor',          label: 'Tractor / Day Cab',         id_label: 'VIN',         usage: 'mileage' },
    { value: 'sleeper',          label: 'Sleeper Cab Tractor',       id_label: 'VIN',         usage: 'mileage' },
    { value: 'heavy_truck',      label: 'Heavy Truck (Class 7-8)',   id_label: 'VIN',         usage: 'mileage' },
    { value: 'medium_truck',     label: 'Medium Truck (box, dump)',  id_label: 'VIN',         usage: 'mileage' },
    { value: 'pickup',           label: 'Pickup Truck (1500/F-150)', id_label: 'VIN',         usage: 'mileage' },
    { value: 'pickup_hd',        label: 'HD Pickup (2500/3500/F-250+)', id_label: 'VIN',      usage: 'mileage' },
    { value: 'box_truck',        label: 'Box / Cube Truck',          id_label: 'VIN',         usage: 'mileage' },
    { value: 'van',              label: 'Cargo Van / Sprinter',      id_label: 'VIN',         usage: 'mileage' },
    { value: 'suv',              label: 'SUV',                       id_label: 'VIN',         usage: 'mileage' },
    { value: 'car',              label: 'Car / Sedan',               id_label: 'VIN',         usage: 'mileage' },
    { value: 'tow_truck',        label: 'Tow Truck / Wrecker',       id_label: 'VIN',         usage: 'mileage' },
    { value: 'crane_truck',      label: 'Crane / Boom Truck',        id_label: 'VIN',         usage: 'mileage' },
    { value: 'bus',              label: 'Bus',                       id_label: 'VIN',         usage: 'mileage' },
    { value: 'rv',               label: 'RV / Motorhome',            id_label: 'VIN',         usage: 'mileage' },
    { value: 'trailer_dry_van',  label: 'Dry Van Trailer',           id_label: 'Serial #',    usage: 'none', is_trailer: true },
    { value: 'trailer_reefer',   label: 'Reefer (Refrigerated)',     id_label: 'Serial #',    usage: 'none', is_trailer: true },
    { value: 'trailer_flatbed',  label: 'Flatbed Trailer',           id_label: 'Serial #',    usage: 'none', is_trailer: true },
    { value: 'trailer_lowboy',   label: 'Lowboy / Heavy Haul',       id_label: 'Serial #',    usage: 'none', is_trailer: true },
    { value: 'trailer_tanker',   label: 'Tanker Trailer',            id_label: 'Serial #',    usage: 'none', is_trailer: true },
    { value: 'trailer_dump',     label: 'Dump Trailer',              id_label: 'Serial #',    usage: 'none', is_trailer: true },
    { value: 'trailer_chassis',  label: 'Container Chassis',         id_label: 'Serial #',    usage: 'none', is_trailer: true },
    { value: 'trailer_other',    label: 'Other Trailer',             id_label: 'Serial #',    usage: 'none', is_trailer: true },
    { value: 'equipment',        label: 'Heavy Equipment',           id_label: 'Serial #',    usage: 'engine_hours' },
    { value: 'crane_standalone', label: 'Standalone Crane',          id_label: 'Serial #',    usage: 'engine_hours' },
    { value: 'panels',           label: 'Panels (paint only — no vehicle)', id_label: 'Reference #', usage: 'none', minimal: true },
    { value: 'other',            label: 'Other',                     id_label: 'VIN / Serial #', usage: 'mileage' },
];
const vtypeMeta = (t) => VEHICLE_TYPES.find(x => x.value === t) || VEHICLE_TYPES[0];
const vtypeLabel = (t) => (vtypeMeta(t) || {}).label || t || '—';

// Build a clean POST/PUT body from the form state, dropping UI-only fields
// and converting numerics. Empty strings → null so Pydantic Optional[int]
// validators don't reject them.
function buildVehicleBody(form) {
    const body = {...form};
    delete body.mileage_unknown;
    // Numeric fields — empty string must become null, not stay as ''
    body.year         = body.year         ? parseInt(body.year)         : null;
    body.mileage      = (form.mileage_unknown || !body.mileage)         ? null : parseInt(body.mileage);
    body.engine_hours = body.engine_hours ? parseInt(body.engine_hours) : null;
    body.length_feet  = body.length_feet  ? parseInt(body.length_feet)  : null;
    body.axle_count   = body.axle_count   ? parseInt(body.axle_count)   : null;
    // Optional text fields — empty string → null
    ['vin','make','model','submodel','color','license_plate','license_state','notes','vehicle_type']
        .forEach(k => { if (body[k] === '') body[k] = null; });
    // vehicle_type defaults to 'tractor' if blanked
    if (!body.vehicle_type) body.vehicle_type = 'tractor';
    return body;
}

function Modal({ open, onClose, title, children }) {
    if (!open) return null;
    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4">
                    <h3>{title}</h3>
                    <button className="btn btn-outline btn-sm" onClick={onClose}><i className="fas fa-times"></i></button>
                </div>
                {children}
            </div>
        </div>
    );
}

// Touch-friendly signature pad. Returns a base64 PNG via onSave(dataUrl).
// Pre-fills with an existing signature if provided.
function SignaturePad({ onSave, onCancel, existing }) {
    const canvasRef = React.useRef(null);
    const drawingRef = React.useRef(false);
    const lastPosRef = React.useRef({x:0, y:0});
    const [hasInk, setHasInk] = useState(!!existing);

    useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        // Make canvas match its display size for crisp drawing on HiDPI screens
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (existing) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
            img.src = existing;
        }
    }, []);

    const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const t = e.touches && e.touches[0] ? e.touches[0] : e;
        return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    };

    const start = (e) => {
        e.preventDefault();
        drawingRef.current = true;
        lastPosRef.current = getPos(e);
    };
    const move = (e) => {
        if (!drawingRef.current) return;
        e.preventDefault();
        const ctx = canvasRef.current.getContext('2d');
        const p = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastPosRef.current = p;
        setHasInk(true);
    };
    const end = () => { drawingRef.current = false; };

    const clear = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        setHasInk(false);
    };

    const save = () => {
        const dataUrl = canvasRef.current.toDataURL('image/png');
        onSave(dataUrl);
    };

    return (
        <div>
            <div style={{padding:10, background:'rgba(77,184,106,0.06)', borderLeft:'3px solid var(--primary)', borderRadius:6, marginBottom:12, fontSize:13}}>
                <i className="fas fa-info-circle" style={{marginRight:6, color:'var(--primary)'}}></i>
                Have the customer sign below to authorize work. Touch screen or use a mouse. They can re-sign by clicking Clear.
            </div>
            <div style={{position:'relative', background:'white', border:'2px solid var(--border)', borderRadius:6}}>
                <canvas
                    ref={canvasRef}
                    style={{width:'100%', height:200, display:'block', cursor:'crosshair', touchAction:'none'}}
                    onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
                    onTouchStart={start} onTouchMove={move} onTouchEnd={end}
                />
                <div style={{position:'absolute', bottom:8, left:12, right:12, borderTop:'1px solid #999', textAlign:'center', fontSize:11, color:'#999', pointerEvents:'none'}}>
                    <span style={{background:'white', padding:'0 8px', position:'relative', top:-7}}>Customer Signature</span>
                </div>
            </div>
            <div className="modal-actions" style={{justifyContent:'space-between'}}>
                <button className="btn btn-outline" onClick={clear} type="button">
                    <i className="fas fa-eraser"></i> Clear
                </button>
                <div style={{display:'flex', gap:8}}>
                    <button className="btn btn-outline" onClick={onCancel} type="button">Cancel</button>
                    <button className="btn btn-primary" onClick={save} disabled={!hasInk}>
                        <i className="fas fa-check"></i> Save Signature
                    </button>
                </div>
            </div>
        </div>
    );
}

    const [vehForm, setVehForm] = useState(emptyVeh);

    const [editing, setEditing] = useState(false);
    const [custForm, setCustForm] = useState({});
    const [editError, setEditError] = useState('');

    const load = () => api(`/customers/${id}`).then(setC);
    useEffect(() => { load(); }, [id]);

    const saveVehicle = async () => {
        try {
            const body = {...buildVehicleBody(vehForm), customer_id: parseInt(id)};
            await api('/vehicles', { method: 'POST', body });
            setShowVehForm(false); setVehForm(emptyVeh); load();
        } catch (err) {
            alert('Failed to save vehicle: ' + (err.message || err));
        }
    };

    const openEditCustomer = () => {
        setCustForm({
            customer_type: c.customer_type || 'individual',
            first_name: c.first_name || '', last_name: c.last_name || '',
            company_name: c.company_name || '',
            email: c.email || '',
            phone_home: c.phone_home || '', phone_work: c.phone_work || '', phone_cell: c.phone_cell || '',
            address: c.address || '', city: c.city || '', state: c.state || '', zip_code: c.zip_code || '',
            billing_address: c.billing_address || '', billing_city: c.billing_city || '',
            billing_state: c.billing_state || '', billing_zip: c.billing_zip || '',
            notes: c.notes || '',
        });
        setEditError('');
        setEditing(true);
    };

    const saveCustomer = async () => {
        setEditError('');
        try {
            const body = {...custForm};
            ['first_name','last_name','company_name','email','phone_home','phone_work','phone_cell',
             'address','city','state','zip_code',
             'billing_address','billing_city','billing_state','billing_zip',
             'notes'].forEach(k => { if (body[k] === '') body[k] = null; });
            await api(`/customers/${id}`, { method: 'PUT', body });
            setEditing(false);
            load();
        } catch (err) {
            setEditError(err.message || 'Save failed');
        }
    };

    const copyAddressToBilling = () => {
        setCustForm(prev => ({...prev,
            billing_address: prev.address || '',
            billing_city: prev.city || '',
            billing_state: prev.state || '',
            billing_zip: prev.zip_code || '',
        }));
    };

    if (!c) return <div className="empty-state"><i className="fas fa-spinner fa-spin"></i></div>;

    return (
        <div>
            <div className="page-header">
                <div className="flex items-center gap-2">
                    <button className="btn btn-outline btn-sm" onClick={() => navigate('customers')}><i className="fas fa-arrow-left"></i></button>
                    <h2>{custName(c)}</h2>
                </div>
                <button className="btn btn-primary" onClick={openEditCustomer}><i className="fas fa-edit"></i> Edit</button>
            </div>
            <div className="detail-grid">
                <div className="card">
                    <div className="section-title"><i className="fas fa-user"></i> Contact Info</div>
                    <div className="detail-row"><span className="detail-label">Type</span><span className="detail-value">{c.customer_type}</span></div>
                    <div className="detail-row"><span className="detail-label">Phone (home)</span><span className="detail-value">{c.phone_home||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Phone (cell)</span><span className="detail-value">{c.phone_cell||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Phone (work)</span><span className="detail-value">{c.phone_work||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Email</span><span className="detail-value">{c.email||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Address</span><span className="detail-value">{[c.address,c.city,c.state,c.zip_code].filter(Boolean).join(', ')||'—'}</span></div>
                    <div className="detail-row">
                        <span className="detail-label">Bill To</span>
                        <span className="detail-value">
                            {[c.billing_address, c.billing_city, c.billing_state, c.billing_zip].filter(Boolean).join(', ')
                             || <span className="text-muted text-sm">Same as address above</span>}
                        </span>
                    </div>
                    {c.notes && <div className="detail-row"><span className="detail-label">Notes</span><span className="detail-value text-sm" style={{whiteSpace:'pre-wrap'}}>{c.notes}</span></div>}
                </div>
                <div className="card">
                    <div className="card-header">
                        <div className="section-title" style={{margin:0}}><i className="fas fa-car"></i> Vehicles ({(c.vehicles||[]).length})</div>
                        <button className="btn btn-primary btn-sm" onClick={() => setShowVehForm(true)}><i className="fas fa-plus"></i> Add Vehicle</button>
                    </div>
                    {(c.vehicles||[]).map(v => (
                        <div key={v.id} className="detail-row clickable" onClick={() => navigate('vehicle-detail', v.id)}>
                            <span className="detail-value">{v.year} {v.make} {v.model}</span>
                            <span className="text-muted text-sm">{v.vin}</span>
                        </div>
                    ))}
                    {!(c.vehicles||[]).length && <div className="text-muted" style={{padding:12,fontSize:13}}>No vehicles yet</div>}
                </div>
            </div>
            <div className="card mt-4">
                <div className="section-title"><i className="fas fa-wrench"></i> Repair Orders</div>
                <table><thead><tr><th>RO #</th><th>Status</th><th>Total</th><th>Created</th></tr></thead>
                <tbody>
                {(c.repair_orders||[]).map(r => (
                    <tr key={r.id} className="clickable" onClick={() => navigate('ro-detail', r.id)}>
                        <td style={{color:'var(--primary)'}}>{r.ro_number}</td><td><Badge status={r.status}/></td>
                        <td className="money">{fmt(r.total_amount)}</td><td>{fmtDate(r.create_date)}</td>
                    </tr>
                ))}
                </tbody></table>
            </div>
            <Modal open={showVehForm} onClose={() => setShowVehForm(false)} title={`Add Vehicle for ${custName(c)}`}>
                <VehicleFormFields form={vehForm} set={(field, val) => setVehForm({...vehForm, [field]: val})} />
                <div className="form-group" style={{marginTop:12}}><label>Notes</label><textarea value={vehForm.notes} onChange={e => setVehForm({...vehForm, notes: e.target.value})} /></div>
                <div className="modal-actions"><button className="btn btn-outline" onClick={() => setShowVehForm(false)}>Cancel</button><button className="btn btn-primary" onClick={saveVehicle}><i className="fas fa-save"></i> Save Vehicle</button></div>
            </Modal>

            <Modal open={editing} onClose={() => setEditing(false)} title={`Edit ${custName(c)}`}>
                {editError && (
                    <div style={{padding:10, background:'rgba(220,38,38,0.1)', border:'1px solid rgba(220,38,38,0.3)', borderRadius:6, color:'var(--danger)', marginBottom:12, fontSize:13}}>
                        {editError}
                    </div>
                )}
                <div className="form-grid">
                    <div className="form-group">
                        <label>Type</label>
                        <select value={custForm.customer_type||'individual'} onChange={e => setCustForm({...custForm, customer_type: e.target.value})}>
                            <option value="individual">Individual</option>
                            <option value="company">Company / Business</option>
                        </select>
                    </div>
                    {custForm.customer_type === 'company' ? (
                        <div className="form-group" style={{gridColumn:'span 2'}}>
                            <label>Company Name</label>
                            <input value={custForm.company_name||''} onChange={e => setCustForm({...custForm, company_name: e.target.value})} />
                        </div>
                    ) : null}
                    <div className="form-group">
                        <label>First Name</label>
                        <input value={custForm.first_name||''} onChange={e => setCustForm({...custForm, first_name: e.target.value})} />
                    </div>
                    <div className="form-group">
                        <label>Last Name</label>
                        <input value={custForm.last_name||''} onChange={e => setCustForm({...custForm, last_name: e.target.value})} />
                    </div>
                    <div className="form-group" style={{gridColumn:'span 2'}}>
                        <label>Email</label>
                        <input type="email" value={custForm.email||''} onChange={e => setCustForm({...custForm, email: e.target.value})} placeholder="name@example.com" />
                    </div>
                    <div className="form-group"><label>Phone (home)</label><input value={custForm.phone_home||''} onChange={e => setCustForm({...custForm, phone_home: e.target.value})} /></div>
                    <div className="form-group"><label>Phone (cell)</label><input value={custForm.phone_cell||''} onChange={e => setCustForm({...custForm, phone_cell: e.target.value})} /></div>
                    <div className="form-group"><label>Phone (work)</label><input value={custForm.phone_work||''} onChange={e => setCustForm({...custForm, phone_work: e.target.value})} /></div>
                    <div className="form-group" style={{gridColumn:'span 2'}}>
                        <label>Address</label>
                        <input value={custForm.address||''} onChange={e => setCustForm({...custForm, address: e.target.value})} />
                    </div>
                    <div className="form-group"><label>City</label><input value={custForm.city||''} onChange={e => setCustForm({...custForm, city: e.target.value})} /></div>
                    <div className="form-group"><label>State</label><input value={custForm.state||''} onChange={e => setCustForm({...custForm, state: e.target.value})} maxLength="2" placeholder="MA" /></div>
                    <div className="form-group"><label>ZIP</label><input value={custForm.zip_code||''} onChange={e => setCustForm({...custForm, zip_code: e.target.value})} /></div>
                </div>
                <div style={{marginTop: 18, paddingTop: 14, borderTop: '1px solid var(--border)'}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 10}}>
                        <div>
                            <div style={{fontWeight: 600, fontSize: 14}}><i className="fas fa-file-invoice-dollar"></i> Billing Address</div>
                            <div className="text-muted text-sm">Where invoices get mailed. Leave blank to use the address above.</div>
                        </div>
                        <button className="btn btn-outline btn-sm" onClick={copyAddressToBilling} type="button">
                            <i className="fas fa-copy"></i> Same as address
                        </button>
                    </div>
                    <div className="form-grid">
                        <div className="form-group" style={{gridColumn:'span 2'}}>
                            <label>Billing Address</label>
                            <input value={custForm.billing_address||''} onChange={e => setCustForm({...custForm, billing_address: e.target.value})} />
                        </div>
                        <div className="form-group"><label>City</label><input value={custForm.billing_city||''} onChange={e => setCustForm({...custForm, billing_city: e.target.value})} /></div>
                        <div className="form-group"><label>State</label><input value={custForm.billing_state||''} onChange={e => setCustForm({...custForm, billing_state: e.target.value})} maxLength="2" /></div>
                        <div className="form-group"><label>ZIP</label><input value={custForm.billing_zip||''} onChange={e => setCustForm({...custForm, billing_zip: e.target.value})} /></div>
                    </div>
                </div>
                <div className="form-group" style={{marginTop:12}}>
                    <label>Notes</label>
                    <textarea value={custForm.notes||''} onChange={e => setCustForm({...custForm, notes: e.target.value})} />
                </div>
                <div className="modal-actions">
                    <button className="btn btn-outline" onClick={() => setEditing(false)}>Cancel</button>
                    <button className="btn btn-primary" onClick={saveCustomer}><i className="fas fa-save"></i> Save</button>
                </div>
            </Modal>
        </div>
    );
}

// VEHICLES
// ═══════════════════════════════════════════════════════════
function VehiclesPage({ navigate }) {
    const [vehicles, setVehicles] = useState([]);
    const [search, setSearch] = useState('');
    const [showForm, setShowForm] = useState(false);
    const [customers, setCustomers] = useState([]);
    const emptyVeh = {customer_id:'',vehicle_type:'tractor',vin:'',year:'',make:'',model:'',submodel:'',color:'',license_plate:'',license_state:'',mileage:'',engine_hours:'',length_feet:'',axle_count:'',notes:''};
    const [form, setForm] = useState(emptyVeh);

    const load = () => api('/vehicles' + (search ? `?search=${search}` : '')).then(setVehicles);
    useEffect(() => { load(); }, [search]);
    useEffect(() => { if (showForm) api('/customers').then(setCustomers); }, [showForm]);

    const save = async () => {
        try {
            const body = buildVehicleBody(form);
            await api('/vehicles', { method: 'POST', body });
            setShowForm(false); setForm(emptyVeh); load();
        } catch (err) {
            alert('Failed to save vehicle: ' + (err.message || err));
        }
    };

    return (
        <div>
            <div className="page-header">
                <h2>Vehicles</h2>
                <button className="btn btn-primary" onClick={() => setShowForm(true)}><i className="fas fa-plus"></i> New Vehicle</button>
            </div>
            <div className="search-bar"><input placeholder="Search by VIN, make, model..." value={search} onChange={e => setSearch(e.target.value)} /></div>
            <div className="card"><div className="table-wrapper">
                <table><thead><tr><th>Type</th><th>Vehicle</th><th>VIN / Serial #</th><th>Color</th><th>Owner</th><th>Mi / Hrs</th></tr></thead>
                <tbody>
                {vehicles.map(v => {
                    const meta = vtypeMeta(v.vehicle_type);
                    const usage = meta.usage === 'engine_hours'
                        ? (v.engine_hours != null ? `${v.engine_hours.toLocaleString()} hrs` : '—')
                        : meta.usage === 'mileage'
                            ? (v.mileage ? v.mileage.toLocaleString() : <span className="text-muted">Unknown</span>)
                            : '—';
                    return (
                        <tr key={v.id} className="clickable" onClick={() => navigate('vehicle-detail', v.id)}>
                            <td className="text-sm">{vtypeLabel(v.vehicle_type)}</td>
                            <td style={{fontWeight:500}}>{vehDesc(v)}</td>
                            <td className="text-sm">{v.vin||'—'}</td>
                            <td>{v.color||'—'}</td>
                            <td>{custName(v)}</td>
                            <td>{usage}</td>
                        </tr>
                    );
                })}
                {!vehicles.length && <tr><td colSpan="6" className="text-muted" style={{textAlign:'center',padding:32}}>No vehicles found</td></tr>}
                </tbody></table>
            </div></div>
            <Modal open={showForm} onClose={() => setShowForm(false)} title="New Vehicle">
                <div className="form-group" style={{marginBottom:12}}><label>Owner *</label>
                    <select value={form.customer_id} onChange={e => setForm({...form, customer_id: e.target.value})}>
                        <option value="">Select customer...</option>
                        {customers.map(c => <option key={c.id} value={c.id}>{custName(c)}</option>)}
                    </select>
                </div>
                <VehicleFormFields form={form} set={(field, val) => setForm({...form, [field]: val})} />
                <div className="form-group" style={{marginTop:12}}><label>Notes</label><textarea value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} /></div>
                <div className="modal-actions"><button className="btn btn-outline" onClick={() => setShowForm(false)}>Cancel</button><button className="btn btn-primary" onClick={save} disabled={!form.customer_id}><i className="fas fa-save"></i> Save</button></div>
            </Modal>
        </div>
    );
}

// VEHICLE DETAIL
// ═══════════════════════════════════════════════════════════
function VehicleDetail({ id, navigate }) {
    const [v, setV] = useState(null);
    const [editing, setEditing] = useState(false);
    const [form, setForm] = useState({});
    const [customers, setCustomers] = useState([]);
    const [custSearch, setCustSearch] = useState('');

    const load = () => api(`/vehicles/${id}`).then(data => {
        setV(data);
        // Pre-check the Unknown box if the saved record has no mileage
        setForm({...data, mileage_unknown: data.mileage == null});
    });
    useEffect(() => { load(); }, [id]);
    useEffect(() => { if (editing) api('/customers').then(setCustomers).catch(() => setCustomers([])); }, [editing]);

    const save = async () => {
        if (!form.customer_id) { alert('Please select an owner'); return; }
        try {
        const body = {
            ...buildVehicleBody(form),
            customer_id: parseInt(form.customer_id),
            notes: form.notes || null,
        };
        await api(`/vehicles/${id}`, { method: 'PUT', body });
        setEditing(false); load();
        } catch (err) {
            alert('Failed to save vehicle: ' + (err.message || err));
        }
    };

    const filteredCustomers = customers.filter(c => {
        if (!custSearch) return true;
        const q = custSearch.toLowerCase();
        return (c.first_name||'').toLowerCase().includes(q)
            || (c.last_name||'').toLowerCase().includes(q)
            || (c.company_name||'').toLowerCase().includes(q);
    });

    if (!v) return <div className="empty-state"><i className="fas fa-spinner fa-spin"></i></div>;

    return (
        <div>
            <div className="page-header">
                <div className="flex items-center gap-2">
                    <button className="btn btn-outline btn-sm" onClick={() => navigate('vehicles')}><i className="fas fa-arrow-left"></i></button>
                    <h2>{vehDesc(v)}</h2>
                </div>
                <button className="btn btn-primary" onClick={() => setEditing(true)}><i className="fas fa-edit"></i> Edit</button>
            </div>
            <div className="detail-grid">
                <div className="card">
                    <div className="section-title"><i className="fas fa-car"></i> Vehicle Info</div>
                    <div className="detail-row"><span className="detail-label">Type</span><span className="detail-value">{vtypeLabel(v.vehicle_type)}</span></div>
                    {!vtypeMeta(v.vehicle_type).minimal && <div className="detail-row"><span className="detail-label">Year</span><span className="detail-value">{v.year||'—'}</span></div>}
                    {!vtypeMeta(v.vehicle_type).minimal && <div className="detail-row"><span className="detail-label">Make</span><span className="detail-value">{v.make||'—'}</span></div>}
                    <div className="detail-row"><span className="detail-label">{vtypeMeta(v.vehicle_type).minimal ? 'Description' : 'Model'}</span><span className="detail-value">{v.model||'—'}</span></div>
                    {!vtypeMeta(v.vehicle_type).minimal && <div className="detail-row"><span className="detail-label">Submodel</span><span className="detail-value">{v.submodel||'—'}</span></div>}
                    <div className="detail-row"><span className="detail-label">Color</span><span className="detail-value">{v.color||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">{vtypeMeta(v.vehicle_type).id_label}</span><span className="detail-value">{v.vin||'—'}</span></div>
                    {!vtypeMeta(v.vehicle_type).minimal && <div className="detail-row"><span className="detail-label">Plate</span><span className="detail-value">{v.license_plate ? `${v.license_plate} (${v.license_state||'—'})` : '—'}</span></div>}
                    {vtypeMeta(v.vehicle_type).usage === 'mileage' && (
                        <div className="detail-row"><span className="detail-label">Mileage</span><span className="detail-value">{v.mileage ? v.mileage.toLocaleString() : <span className="text-muted">Unknown</span>}</span></div>
                    )}
                    {vtypeMeta(v.vehicle_type).usage === 'engine_hours' && (
                        <div className="detail-row"><span className="detail-label">Engine Hours</span><span className="detail-value">{v.engine_hours != null ? v.engine_hours.toLocaleString() : <span className="text-muted">Unknown</span>}</span></div>
                    )}
                    {vtypeMeta(v.vehicle_type).is_trailer && <>
                        <div className="detail-row"><span className="detail-label">Length</span><span className="detail-value">{v.length_feet ? `${v.length_feet}'` : '—'}</span></div>
                        <div className="detail-row"><span className="detail-label">Axles</span><span className="detail-value">{v.axle_count||'—'}</span></div>
                    </>}
                </div>
                <div className="card">
                    <div className="section-title"><i className="fas fa-user"></i> Owner</div>
                    <div className="detail-row clickable" onClick={() => navigate('customer-detail', v.customer_id)}>
                        <span className="detail-value">{custName(v)}</span>
                        <span className="text-muted text-sm">{v.phone_home||''}</span>
                    </div>
                    {v.notes && <>
                        <div className="section-title" style={{marginTop:16}}><i className="fas fa-sticky-note"></i> Notes</div>
                        <div className="text-muted" style={{fontSize:13,whiteSpace:'pre-wrap'}}>{v.notes}</div>
                    </>}
                </div>
            </div>
            <Modal open={editing} onClose={() => setEditing(false)} title="Edit Vehicle">
                <div className="form-group" style={{marginBottom:12}}>
                    <label>Owner <span style={{color:'var(--danger)'}}>*</span></label>
                    <input placeholder="Search customers…" value={custSearch} onChange={e => setCustSearch(e.target.value)} style={{marginBottom:4}} />
                    <select value={form.customer_id||''} onChange={e => setForm({...form, customer_id: e.target.value})}>
                        <option value="">— Select owner —</option>
                        {filteredCustomers.map(c => (
                            <option key={c.id} value={c.id}>
                                {c.company_name || [c.first_name, c.last_name].filter(Boolean).join(' ') || `Customer #${c.id}`}
                            </option>
                        ))}
                    </select>
                    <div className="text-muted text-sm" style={{marginTop:4}}>Change this to reassign the vehicle to a different customer.</div>
                </div>
                <VehicleFormFields form={form} set={(field, val) => setForm({...form, [field]: val})} />
                <div className="form-group" style={{marginTop:12}}><label>Notes</label><textarea value={form.notes||''} onChange={e => setForm({...form, notes: e.target.value})} /></div>
                <div className="modal-actions"><button className="btn btn-outline" onClick={() => setEditing(false)}>Cancel</button><button className="btn btn-primary" onClick={save}><i className="fas fa-save"></i> Save</button></div>
            </Modal>
        </div>
    );
}

// ESTIMATES LIST
// ═══════════════════════════════════════════════════════════
function EstimatesPage({ navigate }) {
    const [estimates, setEstimates] = useState([]);
    const [search, setSearch] = useState('');
    const [statusFilter, setStatusFilter] = useState('');
    const [showConverted, setShowConverted] = useState(false);

    const load = () => {
        let q = '/estimates?';
        if (search) q += `search=${search}&`;
        if (statusFilter) q += `status=${statusFilter}`;
        api(q).then(setEstimates);
    };
    useEffect(() => { load(); }, [search, statusFilter]);

    // By default hide converted estimates (they're now ROs and live on
    // the Repair Orders page). The 'Include converted' toggle brings
    // them back for historical browsing. An explicit status filter of
    // 'converted' always overrides and shows them.
    const visibleEstimates = (statusFilter === 'converted' || showConverted)
        ? estimates
        : estimates.filter(e => e.status !== 'converted');

    const deleteEstimate = async (est, ev) => {
        ev.stopPropagation();
        if (!confirm(`Delete estimate ${est.estimate_number}? This can't be undone.`)) return;
        try {
            await api(`/estimates/${est.id}`, { method: 'DELETE' });
            load();
        } catch (err) { alert(err.message || 'Delete failed'); }
    };

    return (
        <div>
            <div className="page-header">
                <h2>Estimates</h2>
                <button className="btn btn-primary" onClick={() => navigate('est-new')}><i className="fas fa-plus"></i> New Estimate</button>
            </div>
            <div className="search-bar">
                <input placeholder="Search estimates..." value={search} onChange={e => setSearch(e.target.value)} />
                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{width:160}}>
                    <option value="">All Active</option>
                    <option value="draft">Draft</option><option value="pending">Pending</option>
                    <option value="approved">Approved</option><option value="rejected">Rejected</option>
                    <option value="converted">Converted (now RO)</option>
                </select>
                <label style={{display:'flex', alignItems:'center', gap:6, fontSize:13, color:'var(--text-muted)', cursor:'pointer', whiteSpace:'nowrap'}}>
                    <input type="checkbox" checked={showConverted}
                           disabled={statusFilter === 'converted'}
                           onChange={e => setShowConverted(e.target.checked)} />
                    Include converted
                </label>
            </div>
            <div className="card"><div className="table-wrapper">
                <table><thead><tr><th>Estimate #</th><th>Customer</th><th>Vehicle</th><th>Status</th><th>Opened</th><th>Closed</th><th>Total</th><th style={{width:50}}></th></tr></thead>
                <tbody>
                {visibleEstimates.map(e => (
                    <tr key={e.id} className="clickable" onClick={() => navigate('est-detail', e.id)}>
                        <td style={{color:'var(--primary)', fontWeight:600}}>{e.estimate_number}</td>
                        <td>{custName(e)}</td>
                        <td>{vehDesc(e)}</td>
                        <td><Badge status={e.status} /></td>
                        <td className="text-sm">{fmtDate(e.estimate_date)}</td>
                        <td className="text-sm">{e.closed_date ? fmtDate(e.closed_date) : <span className="text-muted">—</span>}</td>
                        <td className="money">{fmt(e.total_amount)}</td>
                        <td style={{textAlign:'right'}}>
                            {e.status !== 'converted' && (
                                <button className="btn btn-outline btn-sm" onClick={(ev) => deleteEstimate(e, ev)} title="Delete estimate"
                                        style={{color:'var(--danger)', borderColor:'var(--danger)', padding:'4px 8px'}}>
                                    <i className="fas fa-trash"></i>
                                </button>
                            )}
                        </td>
                    </tr>
                ))}
                {!visibleEstimates.length && estimates.some(e => e.status === 'converted') && (
                    <tr><td colSpan="8" className="text-muted" style={{textAlign:'center', padding:24, fontSize:13}}>
                        No active estimates. {estimates.filter(e => e.status === 'converted').length} converted estimate(s) hidden — check "Include converted" to see them, or open the Repair Orders page.
                    </td></tr>
                )}
                </tbody></table>
            </div></div>
        </div>
    );
}

// ═══════════════════════════════════════════════════════════
// FOLLOW-UPS PAGE — stalled estimates that need a call
// Customers who were quoted but haven't moved forward.
// ═══════════════════════════════════════════════════════════
function FollowUpsPage({ navigate }) {
    const [rows, setRows] = useState([]);
    const [minDays, setMinDays] = useState(7);
    const [search, setSearch] = useState('');
    const [loading, setLoading] = useState(true);

    const load = () => {
        setLoading(true);
        api(`/estimates/follow-up?min_days=${minDays}&limit=500`)
            .then(setRows)
            .catch(() => setRows([]))
            .finally(() => setLoading(false));
    };
    useEffect(() => { load(); }, [minDays]);

    const filtered = !search.trim() ? rows : rows.filter(e => {
        const q = search.toLowerCase();
        return (
            custName(e).toLowerCase().includes(q) ||
            (e.estimate_number || '').toLowerCase().includes(q) ||
            vehDesc(e).toLowerCase().includes(q) ||
            (e.phone_home || '').includes(q) ||
            (e.phone_cell || '').includes(q)
        );
    });

    // Group by staleness bucket for a quick "who's most urgent"
    const buckets = {
        red: filtered.filter(e => e.days_stale >= 30),
        yellow: filtered.filter(e => e.days_stale >= 14 && e.days_stale < 30),
        blue: filtered.filter(e => e.days_stale < 14),
    };
    const totalValue = filtered.reduce((sum, e) => sum + (Number(e.total_amount) || 0), 0);

    return (
        <div>
            <div className="page-header">
                <h2>
                    <i className="fas fa-phone-volume" style={{color:'#eab308', marginRight:8}}></i>
                    Follow-Ups
                </h2>
                <button className="btn btn-outline btn-sm" onClick={load} title="Refresh">
                    <i className="fas fa-rotate"></i> Refresh
                </button>
            </div>
            <div className="text-sm text-muted" style={{marginBottom:16, lineHeight:1.5}}>
                Estimates where the customer was quoted but hasn't moved forward. Give them a call to check in —
                is the price OK? Waiting on insurance? Ready to schedule?
                <br/>
                Converted and rejected estimates are hidden (those are done).
            </div>

            {/* Summary cards */}
            <div className="stats-grid" style={{marginBottom:16}}>
                <div className="stat-card">
                    <div className="stat-label">Total to follow up</div>
                    <div className="stat-value">{filtered.length}</div>
                </div>
                <div className="stat-card">
                    <div className="stat-label">30+ days stale</div>
                    <div className="stat-value" style={{color:'var(--danger)'}}>{buckets.red.length}</div>
                </div>
                <div className="stat-card">
                    <div className="stat-label">14–29 days stale</div>
                    <div className="stat-value" style={{color:'#eab308'}}>{buckets.yellow.length}</div>
                </div>
                <div className="stat-card">
                    <div className="stat-label">Estimate value at stake</div>
                    <div className="stat-value money">{fmt(totalValue)}</div>
                </div>
            </div>

            <div className="search-bar">
                <input placeholder="Search by customer, estimate #, phone, or vehicle..."
                       value={search} onChange={e => setSearch(e.target.value)} />
                <select value={minDays} onChange={e => setMinDays(Number(e.target.value))} style={{width:200}}>
                    <option value={3}>Stale ≥ 3 days</option>
                    <option value={7}>Stale ≥ 7 days</option>
                    <option value={14}>Stale ≥ 14 days</option>
                    <option value={30}>Stale ≥ 30 days</option>
                    <option value={60}>Stale ≥ 60 days</option>
                </select>
            </div>

            <div className="card"><div className="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Est #</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Vehicle</th>
                            <th>Status</th>
                            <th>Days Stalled</th>
                            <th>Last Update</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        {loading && (
                            <tr><td colSpan="8" className="text-muted" style={{textAlign:'center', padding:24}}>Loading…</td></tr>
                        )}
                        {!loading && filtered.length === 0 && (
                            <tr><td colSpan="8" className="text-muted" style={{textAlign:'center', padding:32}}>
                                <i className="fas fa-check-circle" style={{color:'var(--primary)', fontSize:24, display:'block', marginBottom:8}}></i>
                                Nothing needs following up right now — everything's moving.
                            </td></tr>
                        )}
                        {!loading && filtered.map(e => (
                            <tr key={e.id} className="clickable" onClick={() => navigate('est-detail', e.id)}>
                                <td style={{color:'var(--primary)', fontWeight:600}}>{e.estimate_number}</td>
                                <td>{custName(e)}</td>
                                <td className="text-sm">
                                    {e.phone_home || e.phone_cell || <span className="text-muted">—</span>}
                                </td>
                                <td>{vehDesc(e)}</td>
                                <td><Badge status={e.status}/></td>
                                <td>
                                    <span style={{
                                        fontWeight:600,
                                        color: e.days_stale >= 30 ? 'var(--danger)'
                                             : e.days_stale >= 14 ? '#eab308'
                                             : 'var(--text)'
                                    }}>
                                        {e.days_stale}d
                                    </span>
                                </td>
                                <td className="text-sm text-muted">{fmtDate(e.updated_at)}</td>
                                <td className="money">{fmt(e.total_amount)}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div></div>
        </div>
    );
}
