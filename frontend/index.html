// NEW ESTIMATE FORM
// ═══════════════════════════════════════════════════════════
function NewEstimate({ navigate }) {
    const [customers, setCustomers] = useState([]);
    const [vehicles, setVehicles] = useState([]);
    const [insurance, setInsurance] = useState([]);
    const [employees, setEmployees] = useState([]);
    const [custSearch, setCustSearch] = useState('');
    const [form, setForm] = useState({
        customer_id: '', vehicle_id: '', insurance_company_id: '', estimator_id: '',
        claim_number: '', policy_number: '', deductible: '', loss_date: '',
        point_of_impact: '', damage_description: '', notes: '', status: 'pending'
    });
    const [isInsurance, setIsInsurance] = useState(false);
    const [saving, setSaving] = useState(false);
    const [error, setError] = useState('');

    // Sort customers alphabetically by what shows on screen (custName output).
    // That way "Jane Doe" sorts with the D's, "Acme Septic" with the A's,
    // etc. — matches what the user sees when scanning the list.
    const sortedCustomers = useMemo(() => {
        return [...customers].sort((a, b) =>
            custName(a).toLowerCase().localeCompare(custName(b).toLowerCase())
        );
    }, [customers]);

    const filteredCustomers = useMemo(() => {
        const q = custSearch.trim().toLowerCase();
        if (!q) return sortedCustomers;
        return sortedCustomers.filter(c =>
            (c.company_name||'').toLowerCase().includes(q)
            || (c.first_name||'').toLowerCase().includes(q)
            || (c.last_name||'').toLowerCase().includes(q)
            || (c.phone_home||'').includes(q)
        );
    }, [sortedCustomers, custSearch]);

    const selectedCustomer = customers.find(c => String(c.id) === String(form.customer_id));

    useEffect(() => {
        api('/customers').then(setCustomers).catch(() => {});
        api('/insurance-companies').then(setInsurance).catch(() => {});
        api('/employees').then(setEmployees).catch(() => {});
    }, []);

    // Load vehicles when customer changes
    useEffect(() => {
        if (form.customer_id) {
            api('/vehicles?customer_id=' + form.customer_id).then(setVehicles).catch(() => setVehicles([]));
        } else {
            setVehicles([]);
        }
    }, [form.customer_id]);

    const set = (field, val) => setForm(prev => ({...prev, [field]: val}));

    const handleSubmit = async (e) => {
        e.preventDefault();
        if (!form.customer_id) { setError('Please select a customer'); return; }
        setError('');
        setSaving(true);
        try {
            const body = {
                customer_id: parseInt(form.customer_id),
                vehicle_id: form.vehicle_id ? parseInt(form.vehicle_id) : null,
                insurance_company_id: form.insurance_company_id ? parseInt(form.insurance_company_id) : null,
                estimator_id: form.estimator_id ? parseInt(form.estimator_id) : null,
                claim_number: form.claim_number || null,
                policy_number: form.policy_number || null,
                deductible: form.deductible ? parseFloat(form.deductible) : 0,
                loss_date: form.loss_date || null,
                point_of_impact: form.point_of_impact || null,
                damage_description: form.damage_description || null,
                notes: form.notes || null,
                status: form.status,
            };
            const result = await api('/estimates', { method: 'POST', body });
            navigate('est-detail', result.id);
        } catch (err) {
            setError(err.message || 'Failed to create estimate');
        }
        setSaving(false);
    };

    return (
        <div>
            <div className="page-header">
                <div className="flex items-center gap-2">
                    <button className="btn btn-outline btn-sm" onClick={() => navigate('estimates')}><i className="fas fa-arrow-left"></i></button>
                    <h2>New Estimate</h2>
                </div>
            </div>

            <form onSubmit={handleSubmit}>
                <div className="detail-grid">
                    <div className="card">
                        <div className="section-title"><i className="fas fa-user"></i> Customer & Vehicle</div>
                        <div className="form-group" style={{position:'relative'}}>
                            <label>Customer <span style={{color:'var(--danger)'}}>*</span></label>
                            {selectedCustomer ? (
                                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between',
                                             padding:'10px 12px', background:'rgba(77,184,106,0.10)',
                                             border:'1px solid var(--primary)', borderRadius:6}}>
                                    <div>
                                        <div style={{fontWeight:600}}>{custName(selectedCustomer)}</div>
                                        <div className="text-sm text-muted">
                                            {[selectedCustomer.phone_home, selectedCustomer.email, [selectedCustomer.city, selectedCustomer.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ') || 'No contact info on file'}
                                        </div>
                                    </div>
                                    <button type="button" className="btn btn-outline btn-sm"
                                            onClick={() => { set('customer_id', ''); setCustSearch(''); }}
                                            title="Change customer">
                                        <i className="fas fa-times"></i> Change
                                    </button>
                                </div>
                            ) : <>
                                <input type="text" placeholder="Start typing a customer name or phone…"
                                       value={custSearch} onChange={e => setCustSearch(e.target.value)}
                                       autoFocus autoComplete="off" />
                                {custSearch.trim() && (
                                    <div style={{position:'absolute', top:'100%', left:0, right:0, zIndex:10,
                                                 marginTop:2, maxHeight:280, overflowY:'auto',
                                                 border:'1px solid var(--border)', borderRadius:6,
                                                 background:'var(--bg-card)', boxShadow:'0 6px 16px rgba(0,0,0,0.35)'}}>
                                        {filteredCustomers.length === 0 ? (
                                            <div className="text-muted" style={{padding:14, textAlign:'center', fontSize:13}}>
                                                No customer matches "{custSearch}".
                                            </div>
                                        ) : (
                                            filteredCustomers.map((c, i) => (
                                                <div key={c.id}
                                                     onClick={() => { set('customer_id', c.id); setCustSearch(''); }}
                                                     style={{padding:'10px 14px', cursor:'pointer',
                                                             borderBottom: i < filteredCustomers.length - 1 ? '1px solid var(--border)' : 'none'}}
                                                     onMouseEnter={e => e.currentTarget.style.background='rgba(77,184,106,0.12)'}
                                                     onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                                                    <div style={{fontWeight:500, fontSize:14}}>{custName(c)}</div>
                                                    {(c.phone_home || c.city) && (
                                                        <div className="text-sm text-muted" style={{marginTop:2}}>
                                                            {[c.phone_home, [c.city, c.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ')}
                                                        </div>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </>}
                        </div>
                        <div className="form-group">
                            <label>Vehicle</label>
                            <select value={form.vehicle_id} onChange={e => set('vehicle_id', e.target.value)}>
                                <option value="">Select Vehicle...</option>
                                {vehicles.map(v => <option key={v.id} value={v.id}>{vehDesc(v)}</option>)}
                            </select>
                        </div>
                        <div className="form-group">
                            <label>Estimator</label>
                            <select value={form.estimator_id} onChange={e => set('estimator_id', e.target.value)}>
                                <option value="">Select Estimator...</option>
                                {employees.map(emp => <option key={emp.id} value={emp.id}>{emp.first_name} {emp.last_name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="card">
                        <label style={{display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', padding: '4px 0'}}>
                            <input type="checkbox" checked={isInsurance} onChange={e => setIsInsurance(e.target.checked)}
                                   style={{width: 18, height: 18, accentColor: 'var(--primary)'}} />
                            <span style={{fontSize: 15, fontWeight: 600}}><i className="fas fa-shield-halved" style={{marginRight: 6}}></i> Insurance Job</span>
                        </label>
                        {isInsurance && <>
                            <div className="form-group" style={{marginTop: 12}}>
                                <label>Insurance Company</label>
                                <select value={form.insurance_company_id} onChange={e => set('insurance_company_id', e.target.value)}>
                                    <option value="">Select Insurance...</option>
                                    {insurance.map(i => <option key={i.id} value={i.id}>{i.company_name}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label>Claim Number</label>
                                <input value={form.claim_number} onChange={e => set('claim_number', e.target.value)} placeholder="Claim #" />
                            </div>
                            <div className="form-group">
                                <label>Policy Number</label>
                                <input value={form.policy_number} onChange={e => set('policy_number', e.target.value)} placeholder="Policy #" />
                            </div>
                            <div className="form-group">
                                <label>Deductible</label>
                                <input type="number" step="0.01" value={form.deductible} onChange={e => set('deductible', e.target.value)} placeholder="0.00" />
                            </div>
                        </>}
                    </div>
                </div>

                <div className="card mt-4">
                    <div className="section-title"><i className="fas fa-clipboard"></i> Job Details</div>
                    <div className="detail-grid">
                        {isInsurance && <div className="form-group">
                            <label>Loss Date</label>
                            <input type="date" value={form.loss_date} onChange={e => set('loss_date', e.target.value)} />
                        </div>}
                        <div className="form-group">
                            <label>Area</label>
                            <input value={form.point_of_impact} onChange={e => set('point_of_impact', e.target.value)} placeholder="e.g. Full body, Hood & fenders, Left side..." />
                        </div>
                    </div>
                    <div className="form-group">
                        <label>Job Description</label>
                        <textarea rows={3} value={form.damage_description} onChange={e => set('damage_description', e.target.value)}
                                  placeholder="e.g. Full repaint, rust repair and refinish, collision damage, color change..." style={{width:'100%', padding:10, background:'var(--bg-input)', border:'1px solid var(--border)', borderRadius:6, color:'var(--text)', resize:'vertical'}}></textarea>
                    </div>
                    <div className="form-group">
                        <label>Notes</label>
                        <textarea rows={2} value={form.notes} onChange={e => set('notes', e.target.value)}
                                  placeholder="Internal notes..." style={{width:'100%', padding:10, background:'var(--bg-input)', border:'1px solid var(--border)', borderRadius:6, color:'var(--text)', resize:'vertical'}}></textarea>
                    </div>
                </div>

                {error && <div style={{color: 'var(--red)', marginTop: 12, fontWeight: 600}}><i className="fas fa-exclamation-circle"></i> {error}</div>}

                <div style={{marginTop: 16, display: 'flex', gap: 12}}>
                    <button type="submit" className="btn btn-primary" disabled={saving}>
                        {saving ? <><i className="fas fa-spinner fa-spin"></i> Creating...</> : <><i className="fas fa-save"></i> Create Estimate</>}
                    </button>
                    <button type="button" className="btn btn-outline" onClick={() => navigate('estimates')}>Cancel</button>
                </div>
            </form>
        </div>
    );
}

// PANEL / PART PICKER (searchable catalog from Mitchell data)
// ═══════════════════════════════════════════════════════════
function PanelPicker({ onSelect }) {
    const [open, setOpen] = useState(false);
    const [search, setSearch] = useState('');
    const [activeCat, setActiveCat] = useState('All');

    const catalog = typeof PARTS_CATALOG !== 'undefined' ? PARTS_CATALOG : [];
    const cats = ['All', ...Array.from(new Set(catalog.map(p => p.cat)))];

    const filtered = catalog.filter(p => {
        const matchCat = activeCat === 'All' || p.cat === activeCat;
        const matchSearch = !search || p.name.toLowerCase().includes(search.toLowerCase());
        return matchCat && matchSearch;
    });

    const handleSelect = (item) => {
        onSelect(item);
        setOpen(false);
        setSearch('');
    };

    if (!open) {
        return (
            <div style={{marginBottom: 12}}>
                <button className="btn btn-outline" onClick={() => setOpen(true)} style={{width: '100%', justifyContent: 'center', padding: '10px 16px'}}>
                    <i className="fas fa-search"></i> Pick Panel / Part from Catalog
                </button>
            </div>
        );
    }

    return (
        <div style={{marginBottom: 12, border: '1px solid var(--primary)', borderRadius: 8, overflow: 'hidden'}}>
            {/* Search bar */}
            <div style={{padding: '10px 12px', background: 'var(--bg-card)', borderBottom: '1px solid var(--border)', display: 'flex', gap: 8, alignItems: 'center'}}>
                <i className="fas fa-search" style={{color: 'var(--text-muted)'}}></i>
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search panels & parts..."
                       autoFocus style={{flex: 1, background: 'var(--bg-input)', border: '1px solid var(--border)', borderRadius: 6, padding: '8px 10px', color: 'var(--text)'}} />
                <button className="btn btn-outline btn-sm" onClick={() => { setOpen(false); setSearch(''); }}>
                    <i className="fas fa-times"></i>
                </button>
            </div>

            {/* Category tabs */}
            <div style={{display: 'flex', gap: 0, overflowX: 'auto', background: 'var(--bg-card)', borderBottom: '1px solid var(--border)', padding: '0 4px'}}>
                {cats.map(c => (
                    <button key={c} onClick={() => setActiveCat(c)}
                        style={{padding: '8px 14px', fontSize: 12, fontWeight: activeCat === c ? 700 : 400, whiteSpace: 'nowrap',
                            background: 'transparent', border: 'none', borderBottom: activeCat === c ? '2px solid var(--primary)' : '2px solid transparent',
                            color: activeCat === c ? 'var(--primary)' : 'var(--text-muted)', cursor: 'pointer'}}>
                        {c}
                    </button>
                ))}
            </div>

            {/* Results */}
            <div style={{maxHeight: 280, overflowY: 'auto', padding: 4}}>
                {filtered.length === 0 && <div style={{padding: 20, textAlign: 'center', color: 'var(--text-muted)'}}>No parts found</div>}
                {filtered.map((p, i) => (
                    <div key={i} className="picker-row" onClick={() => handleSelect(p)}
                         style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 12px', cursor: 'pointer',
                             borderRadius: 6, fontSize: 13, borderBottom: '1px solid var(--border)'}}>
                        <div>
                            <span style={{fontWeight: 600, color: 'var(--text)'}}>{p.name}</span>
                            <span style={{marginLeft: 8, fontSize: 11, color: 'var(--text-muted)'}}>{p.cat}</span>
                        </div>
                        <span className="badge" style={{fontSize: 11, padding: '2px 8px',
                            background: p.op === 'refinish' ? 'rgba(234,179,8,0.15)' : p.op === 'replace' ? 'rgba(59,130,246,0.15)' : 'rgba(168,85,247,0.15)',
                            color: p.op === 'refinish' ? '#eab308' : p.op === 'replace' ? '#3b82f6' : '#a855f7'}}>
                            {p.op}
                        </span>
                    </div>
                ))}
            </div>
        </div>
    );
}

// ESTIMATE DETAIL (with add/delete line items)
// ═══════════════════════════════════════════════════════════
function EstimateDetail({ id, navigate }) {
    const [est, setEst] = useState(null);
    const [showAddLine, setShowAddLine] = useState(false);
    const [rates, setRates] = useState([]);
    const [catalog, setCatalog] = useState([]);
    const [catalogPrompt, setCatalogPrompt] = useState(null);  // {part_number, description, price, cost, existing} or null
    const [lineForm, setLineForm] = useState({ line_type: 'labor', operation: '', description: '', part_number: '', part_type: 'OEM',
        quantity: 1, labor_hours: 0, labor_rate: 0, paint_hours: 0, paint_rate: 0, part_price: 0, part_cost: 0, taxable: false, notes: '' });
    const [lineSaving, setLineSaving] = useState(false);

    const load = () => api(`/estimates/${id}`).then(setEst);
    const loadCatalog = () => api('/parts-catalog').then(setCatalog).catch(() => setCatalog([]));
    useEffect(() => { load(); }, [id]);
    useEffect(() => { api('/shop/rates').then(setRates).catch(() => {}); loadCatalog(); }, []);

    // Auto-fill rate (and default taxability) when type changes
    const setLineField = (field, val) => {
        setLineForm(prev => {
            const next = {...prev, [field]: val};
            if (field === 'line_type') {
                const findRate = (keyword) => { const r = rates.find(r => r.rate_type.includes(keyword)); return r ? r.rate_amount : 0; };
                if (val === 'labor') { next.labor_rate = findRate('body_labor') || findRate('labor'); next.paint_rate = 0; next.paint_hours = 0; next.part_price = 0; next.part_cost = 0; next.part_number = ''; }
                else if (val === 'paint' || val === 'refinish') { next.paint_rate = findRate('paint') || findRate('refinish'); next.labor_rate = 0; next.labor_hours = 0; next.part_price = 0; next.part_cost = 0; next.part_number = ''; }
                else if (val === 'part') { next.labor_hours = 0; next.labor_rate = 0; next.paint_hours = 0; next.paint_rate = 0; }
                else { next.labor_hours = 0; next.labor_rate = 0; next.paint_hours = 0; next.paint_rate = 0; next.part_number = ''; }
                // Parts default to taxable; everything else defaults to non-taxable.
                next.taxable = val === 'part';
            }
            // When typing/picking a part number on a part line, look up in the catalog
            // and auto-fill description + price + cost if we have it on file.
            if (field === 'part_number' && next.line_type === 'part') {
                const match = catalog.find(c => (c.part_number||'').toUpperCase() === (val||'').toUpperCase());
                if (match) {
                    if (!next.description) next.description = match.description || '';
                    if (!parseFloat(next.part_price)) next.part_price = match.standard_price || 0;
                    if (!parseFloat(next.part_cost))  next.part_cost  = match.standard_cost  || 0;
                }
            }
            return next;
        });
    };

    const toggleTaxExempt = async () => {
        try {
            await api(`/estimates/${id}`, { method: 'PUT', body: { customer_id: est.customer_id, tax_exempt: est.tax_exempt ? 0 : 1 } });
            load();
        } catch (err) { alert('Failed to update tax exemption: ' + (err.message || err)); }
    };

    const addLine = async () => {
        if (!lineForm.description) return;
        setLineSaving(true);
        try {
            const body = {
                line_type: lineForm.line_type,
                operation: lineForm.operation || null,
                description: lineForm.description,
                part_number: lineForm.part_number || null,
                part_type: lineForm.line_type === 'part' ? lineForm.part_type : null,
                quantity: parseFloat(lineForm.quantity) || 1,
                labor_hours: parseFloat(lineForm.labor_hours) || 0,
                labor_rate: parseFloat(lineForm.labor_rate) || 0,
                paint_hours: parseFloat(lineForm.paint_hours) || 0,
                paint_rate: parseFloat(lineForm.paint_rate) || 0,
                part_price: parseFloat(lineForm.part_price) || 0,
                part_cost: parseFloat(lineForm.part_cost) || 0,
                taxable: lineForm.taxable ? 1 : 0,
                notes: lineForm.notes || null,
            };
            await api(`/estimates/${id}/lines`, { method: 'POST', body });

            // After a part with a part_number is added, prompt to save/update the catalog.
            if (body.line_type === 'part' && body.part_number) {
                const existing = catalog.find(c => (c.part_number||'').toUpperCase() === body.part_number.toUpperCase());
                const priceChanged = existing && Math.abs((existing.standard_price||0) - body.part_price) > 0.005;
                if (!existing || priceChanged) {
                    setCatalogPrompt({
                        part_number: body.part_number,
                        description: body.description,
                        price: body.part_price,
                        cost: body.part_cost,
                        part_type: body.part_type,
                        existing: existing || null,
                        priceChanged,
                    });
                }
            }

            setLineForm({ line_type: lineForm.line_type, operation: '', description: '', part_number: '', part_type: 'OEM',
                quantity: 1, labor_hours: 0, labor_rate: body.labor_rate, paint_hours: 0, paint_rate: body.paint_rate, part_price: 0, part_cost: 0,
                taxable: lineForm.line_type === 'part', notes: '' });
            load();
        } catch (err) { alert(err.message); }
        setLineSaving(false);
    };

    const acceptCatalogSave = async () => {
        if (!catalogPrompt) return;
        try {
            await api('/parts-catalog', { method: 'POST', body: {
                part_number: catalogPrompt.part_number,
                description: catalogPrompt.description,
                standard_price: catalogPrompt.price,
                standard_cost: catalogPrompt.cost,
                part_type: catalogPrompt.part_type,
            }});
            setCatalogPrompt(null);
            loadCatalog();
        } catch (err) { alert('Failed to save to catalog: ' + (err.message || err)); }
    };

    const deleteLine = async (lineId) => {
        if (!confirm('Delete this line?')) return;
        try {
            await api(`/estimates/${id}/lines/${lineId}`, { method: 'DELETE' });
            load();
        } catch (err) { alert(err.message); }
    };

    const toggleLineTaxable = async (line) => {
        try {
            await api(`/estimates/${id}/lines/${line.id}`, { method: 'PATCH', body: { taxable: line.taxable ? 0 : 1 } });
            load();
        } catch (err) { alert('Failed to update: ' + (err.message || err)); }
    };

    const moveLine = async (lineId, direction) => {
        try {
            await api(`/estimates/${id}/lines/${lineId}/move?direction=${direction}`, { method: 'POST' });
            load();
        } catch (err) { alert('Failed to move: ' + (err.message || err)); }
    };

    const deleteEstimate = async () => {
        if (!confirm(`Delete estimate ${est?.estimate_number}? This can't be undone.`)) return;
        try {
            await api(`/estimates/${id}`, { method: 'DELETE' });
            navigate('estimates');
        } catch (err) { alert(err.message || 'Delete failed'); }
    };

    const [editingLine, setEditingLine] = useState(null);
    const openEditLine = (line) => setEditingLine({...line});
    const saveLineEdit = async () => {
        if (!editingLine) return;
        try {
            const body = {
                operation: editingLine.operation || null,
                description: editingLine.description,
                part_number: editingLine.part_number || null,
                part_type: editingLine.part_type || null,
                quantity: parseFloat(editingLine.quantity) || 1,
                labor_hours: parseFloat(editingLine.labor_hours) || 0,
                labor_rate: parseFloat(editingLine.labor_rate) || 0,
                paint_hours: parseFloat(editingLine.paint_hours) || 0,
                paint_rate: parseFloat(editingLine.paint_rate) || 0,
                part_price: parseFloat(editingLine.part_price) || 0,
                part_cost: parseFloat(editingLine.part_cost) || 0,
                notes: editingLine.notes || null,
            };
            await api(`/estimates/${id}/lines/${editingLine.id}`, { method: 'PATCH', body });
            setEditingLine(null);
            load();
        } catch (err) { alert('Failed to save: ' + (err.message || err)); }
    };

    // Convert flow now opens a modal to require at least one worker.
    const [showConvertModal, setShowConvertModal] = useState(false);
    const [convertTeam, setConvertTeam] = useState([{employee_id:'', role:''}]);
    const [employees, setEmployees] = useState([]);
    const [convertSaving, setConvertSaving] = useState(false);
    const [convertError, setConvertError] = useState('');
    useEffect(() => {
        if (showConvertModal) api('/employees').then(setEmployees).catch(() => setEmployees([]));
    }, [showConvertModal]);

    const openConvertModal = () => {
        setConvertTeam([{employee_id:'', role:''}]);
        setConvertError('');
        setShowConvertModal(true);
    };

    const submitConvert = async () => {
        setConvertError('');
        const valid = convertTeam.filter(t => t.employee_id && t.role && t.role.trim());
        if (!valid.length) {
            setConvertError('Pick at least one worker and a role before converting.');
            return;
        }
        setConvertSaving(true);
        try {
            const res = await api(`/estimates/${id}/convert-to-ro`, {
                method: 'POST',
                body: { team: valid.map(t => ({ employee_id: parseInt(t.employee_id), role: t.role.trim() })) },
            });
            setShowConvertModal(false);
            alert(`Created ${res.ro_number}`);
            navigate('ro-detail', res.id);
        } catch (err) {
            setConvertError(err.message || 'Conversion failed');
        }
        setConvertSaving(false);
    };

    const updateConvertTeamRow = (idx, field, val) => {
        setConvertTeam(prev => prev.map((r, i) => i === idx ? {...r, [field]: val} : r));
    };
    const addConvertTeamRow = () => setConvertTeam(prev => [...prev, {employee_id:'', role:''}]);
    const removeConvertTeamRow = (idx) => setConvertTeam(prev => prev.filter((_, i) => i !== idx));

    if (!est) return <div className="empty-state"><i className="fas fa-spinner fa-spin"></i></div>;

    const lt = lineForm.line_type;
    const lineTotal = lt === 'part' ? (parseFloat(lineForm.part_price)||0) * (parseFloat(lineForm.quantity)||1)
        : lt === 'labor' ? (parseFloat(lineForm.labor_hours)||0) * (parseFloat(lineForm.labor_rate)||0)
        : (lt === 'paint' || lt === 'refinish') ? (parseFloat(lineForm.paint_hours)||0) * (parseFloat(lineForm.paint_rate)||0)
        : (parseFloat(lineForm.part_price)||0);

    return (
        <div>
            <div className="page-header">
                <div className="flex items-center gap-2">
                    <button className="btn btn-outline btn-sm" onClick={() => navigate('estimates')}><i className="fas fa-arrow-left"></i></button>
                    <h2>{est.estimate_number}</h2>
                    <Badge status={est.status} />
                </div>
                <div className="flex gap-2">
                    <a href={`${API}/exports/estimate/${id}/pdf`} target="_blank" className="btn btn-outline"><i className="fas fa-file-pdf"></i> Print PDF</a>
                    {est.status !== 'converted' && (
                        <button className="btn btn-success" onClick={openConvertModal}><i className="fas fa-arrow-right"></i> Convert to RO</button>
                    )}
                    {est.status !== 'converted' && (
                        <button className="btn btn-outline" onClick={deleteEstimate}
                                style={{color:'var(--danger)', borderColor:'var(--danger)'}} title="Delete this estimate">
                            <i className="fas fa-trash"></i> Delete
                        </button>
                    )}
                </div>
            </div>

            <div className="detail-grid">
                <div className="card">
                    <div className="section-title"><i className="fas fa-user"></i> Customer & Vehicle</div>
                    <div className="detail-row"><span className="detail-label">Customer</span><span className="detail-value">{custName(est)}</span></div>
                    <div className="detail-row"><span className="detail-label">Vehicle</span><span className="detail-value">{vehDesc(est)}</span></div>
                    <div className="detail-row"><span className="detail-label">VIN</span><span className="detail-value">{est.vin||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Color</span><span className="detail-value">{est.vehicle_color||'—'}</span></div>
                    <div className="detail-row"><span className="detail-label">Mileage</span><span className="detail-value">{est.mileage ? est.mileage.toLocaleString() : <span className="text-muted">Unknown</span>}</span></div>
                </div>
                <div className="card">
                    <div className="detail-row"><span className="detail-label">Estimator</span><span className="detail-value">{[est.estimator_first, est.estimator_last].filter(Boolean).join(' ')||'—'}</span></div>
                    {(est.insurance_name || est.claim_number || est.deductible > 0) ? <>
                        <div style={{marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--border)'}}>
                            <div className="section-title"><i className="fas fa-shield-halved"></i> Insurance</div>
                        </div>
                        <div className="detail-row"><span className="detail-label">Insurance</span><span className="detail-value">{est.insurance_name||'—'}</span></div>
                        <div className="detail-row"><span className="detail-label">Claim #</span><span className="detail-value">{est.claim_number||'—'}</span></div>
                        <div className="detail-row"><span className="detail-label">Deductible</span><span className="detail-value money">{fmt(est.deductible)}</span></div>
                        <div className="detail-row"><span className="detail-label">Loss Date</span><span className="detail-value">{fmtDate(est.loss_date)}</span></div>
                    </> : (
                        <div className="detail-row" style={{marginTop: 8}}><span className="detail-label">Type</span><span className="detail-value">Customer Pay</span></div>
                    )}
                </div>
            </div>

            {est.damage_description && (
                <div className="card mt-4">
                    <div className="section-title"><i className="fas fa-clipboard"></i> Job Description</div>
                    <p>{est.damage_description}</p>
                </div>
            )}

            {/* ── Line Items Table ── */}
            <div className="card mt-4">
                <div className="card-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                    <h3>Line Items ({(est.lines||[]).length})</h3>
                    {est.status !== 'converted' && (
                        <button className="btn btn-primary btn-sm" onClick={() => setShowAddLine(!showAddLine)}>
                            <i className={`fas fa-${showAddLine ? 'times' : 'plus'}`}></i> {showAddLine ? 'Cancel' : 'Add Line'}
                        </button>
                    )}
                </div>

                {/* ── Add Line Form ── */}
                {showAddLine && (
                    <div style={{padding: 16, background: 'var(--bg)', borderRadius: 8, margin: '12px 0', border: '1px solid var(--border)'}}>

                        {/* Panel/Part Picker */}
                        <PanelPicker onSelect={(item) => {
                            const opMap = { 'refinish': 'paint', 'replace': 'part', 'R&I': 'labor' };
                            const newType = opMap[item.op] || 'labor';
                            setLineField('line_type', newType);
                            // Need to set multiple fields at once
                            setLineForm(prev => {
                                const findRate = (keyword) => { const r = rates.find(r => r.rate_type.includes(keyword)); return r ? r.rate_amount : 0; };
                                return {
                                    ...prev,
                                    line_type: newType,
                                    description: item.name,
                                    operation: item.op === 'refinish' ? 'refinish' : item.op === 'R&I' ? 'remove_install' : 'replace',
                                    labor_hours: newType === 'labor' ? prev.labor_hours : 0,
                                    labor_rate: newType === 'labor' ? (findRate('body_labor') || prev.labor_rate) : 0,
                                    paint_hours: newType === 'paint' ? prev.paint_hours : 0,
                                    paint_rate: newType === 'paint' ? (findRate('paint') || prev.paint_rate) : 0,
                                    part_price: newType === 'part' ? prev.part_price : 0,
                                    part_cost: newType === 'part' ? prev.part_cost : 0,
                                    part_number: '',
                                    part_type: 'OEM',
                                    quantity: 1,
                                };
                            });
                        }} />

                        <div style={{display: 'flex', gap: 8, marginBottom: 12, flexWrap: 'wrap'}}>
                            {[{v:'labor',l:'Labor'},{v:'paint',l:'Paint/Refinish'},{v:'part',l:'Parts'},{v:'sublet',l:'Sublet'},{v:'other',l:'Other'}].map(t => (
                                <button key={t.v} className={`btn btn-sm ${lt === t.v ? 'btn-primary' : 'btn-outline'}`}
                                        onClick={() => setLineField('line_type', t.v)}>{t.l}</button>
                            ))}
                        </div>

                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: 10}}>
                            <div className="form-group">
                                <label>Operation</label>
                                <select value={lineForm.operation} onChange={e => setLineField('operation', e.target.value)} style={{padding: '8px 10px'}}>
                                    <option value="">Select...</option>
                                    {lt === 'labor' && <>
                                        <option value="repair">Repair</option><option value="replace">Replace</option>
                                        <option value="remove_install">R&I (Remove & Install)</option><option value="overhaul">Overhaul</option>
                                        <option value="straighten">Straighten</option><option value="weld">Weld</option>
                                        <option value="align">Align</option><option value="blend">Blend</option>
                                    </>}
                                    {(lt === 'paint' || lt === 'refinish') && <>
                                        <option value="refinish">Refinish</option><option value="blend">Blend</option>
                                        <option value="two_tone">Two-Tone</option><option value="three_stage">Three-Stage</option>
                                        <option value="clearcoat">Clearcoat</option><option value="undercoat">Undercoat</option>
                                        <option value="bedliner">Bedliner</option><option value="stripe">Stripe/Decal</option>
                                    </>}
                                    {lt === 'part' && <>
                                        <option value="replace">Replace</option><option value="add">Add</option>
                                    </>}
                                    {lt === 'sublet' && <>
                                        <option value="sublet">Sublet</option><option value="tow">Tow</option>
                                        <option value="glass">Glass</option><option value="alignment">Alignment</option>
                                    </>}
                                    {lt === 'other' && <>
                                        <option value="misc">Miscellaneous</option><option value="hazmat">Hazmat/Env Fee</option>
                                        <option value="storage">Storage</option><option value="admin">Admin Fee</option>
                                    </>}
                                </select>
                            </div>

                            <div className="form-group" style={{gridColumn: 'span 2'}}>
                                <label>Description *</label>
                                <input value={lineForm.description} onChange={e => setLineField('description', e.target.value)}
                                       placeholder={lt === 'part' ? 'Part name / description' : lt === 'paint' ? 'Panel or area' : 'Description of work'} />
                            </div>

                            {lt === 'part' && <>
                                <div className="form-group">
                                    <label>Part Number {catalog.length > 0 && <span className="text-muted text-sm">(autocompletes from catalog)</span>}</label>
                                    <input list="parts-catalog-options" value={lineForm.part_number}
                                           onChange={e => setLineField('part_number', e.target.value)}
                                           placeholder="Part # — type to search catalog" />
                                    <datalist id="parts-catalog-options">
                                        {catalog.slice(0, 200).map(p => (
                                            <option key={p.id} value={p.part_number}>{p.description ? `${p.description} — $${p.standard_price?.toFixed(2)||'0.00'}` : `$${p.standard_price?.toFixed(2)||'0.00'}`}</option>
                                        ))}
                                    </datalist>
                                </div>
                                <div className="form-group">
                                    <label>Part Type</label>
                                    <select value={lineForm.part_type} onChange={e => setLineField('part_type', e.target.value)}>
                                        <option value="OEM">OEM (New)</option>
                                        <option value="aftermarket">Aftermarket</option>
                                        <option value="used">Used/Recycled</option>
                                        <option value="reconditioned">Reconditioned</option>
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label>Quantity</label>
                                    <input type="number" min="1" step="1" value={lineForm.quantity} onChange={e => setLineField('quantity', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label>Price (each)</label>
                                    <input type="number" step="0.01" value={lineForm.part_price} onChange={e => setLineField('part_price', e.target.value)} placeholder="0.00" />
                                </div>
                                <div className="form-group">
                                    <label>Cost (each)</label>
                                    <input type="number" step="0.01" value={lineForm.part_cost} onChange={e => setLineField('part_cost', e.target.value)} placeholder="0.00" />
                                </div>
                            </>}

                            {lt === 'labor' && <>
                                <div className="form-group">
                                    <label>Hours</label>
                                    <input type="number" step="0.1" value={lineForm.labor_hours} onChange={e => setLineField('labor_hours', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label>Rate ($/hr)</label>
                                    <input type="number" step="0.01" value={lineForm.labor_rate} onChange={e => setLineField('labor_rate', e.target.value)} />
                                </div>
                            </>}

                            {(lt === 'paint' || lt === 'refinish') && <>
                                <div className="form-group">
                                    <label>Paint Hours</label>
                                    <input type="number" step="0.1" value={lineForm.paint_hours} onChange={e => setLineField('paint_hours', e.target.value)} />
                                </div>
                                <div className="form-group">
                                    <label>Paint Rate ($/hr)</label>
                                    <input type="number" step="0.01" value={lineForm.paint_rate} onChange={e => setLineField('paint_rate', e.target.value)} />
                                </div>
                            </>}

                            {(lt === 'sublet' || lt === 'other') && <>
                                <div className="form-group">
                                    <label>Amount</label>
                                    <input type="number" step="0.01" value={lineForm.part_price} onChange={e => setLineField('part_price', e.target.value)} placeholder="0.00" />
                                </div>
                            </>}
                        </div>

                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--border)', gap: 16, flexWrap: 'wrap'}}>
                            <div style={{display:'flex', alignItems:'center', gap: 16, flexWrap:'wrap'}}>
                                <div style={{fontSize: 15, fontWeight: 600}}>
                                    Line Total: <span style={{color:'var(--primary)', fontSize: 17}}>{fmt(lineTotal)}</span>
                                </div>
                                <label style={{display:'flex', alignItems:'center', gap:6, fontSize:13, cursor: est.tax_exempt ? 'not-allowed' : 'pointer', opacity: est.tax_exempt ? 0.5 : 1}}>
                                    <input type="checkbox" checked={!!lineForm.taxable && !est.tax_exempt} disabled={!!est.tax_exempt}
                                           onChange={e => setLineField('taxable', e.target.checked)} />
                                    Tax applies to this line
                                </label>
                            </div>
                            <button className="btn btn-primary" onClick={addLine} disabled={lineSaving || !lineForm.description}>
                                {lineSaving ? <><i className="fas fa-spinner fa-spin"></i> Adding...</> : <><i className="fas fa-plus"></i> Add Line</>}
                            </button>
                        </div>
                    </div>
                )}

                <div className="table-wrapper">
                    <table><thead><tr><th>#</th><th>Type</th><th>Operation</th><th>Description</th><th>Part #</th><th>Hours</th><th>Rate</th><th>Parts $</th><th title="Taxable">Tax</th><th>Total</th>{est.status !== 'converted' && <th></th>}</tr></thead>
                    <tbody>
                    {(est.lines||[]).length === 0 && (
                        <tr><td colSpan={est.status !== 'converted' ? 11 : 10} style={{textAlign:'center', color:'var(--text-muted)', padding: 24}}>
                            No line items yet — click "Add Line" to start building the estimate
                        </td></tr>
                    )}
                    {(est.lines||[]).map(l => (
                        <tr key={l.id}>
                            <td>{l.line_number}</td>
                            <td><Badge status={l.line_type} /></td>
                            <td>{l.operation||'—'}</td>
                            <td>{l.description}</td>
                            <td className="text-sm">{l.part_number||'—'}</td>
                            <td>{l.labor_hours || l.paint_hours || '—'}</td>
                            <td>{l.labor_rate || l.paint_rate || '—'}</td>
                            <td className="money">{l.part_price ? fmt(l.part_price * (l.quantity||1)) : '—'}</td>
                            <td style={{textAlign:'center'}}>
                                {est.status !== 'converted' ? (
                                    <button onClick={(e) => { e.stopPropagation(); toggleLineTaxable(l); }}
                                            title={l.taxable ? 'Taxable — click to remove' : 'Not taxable — click to mark taxable'}
                                            disabled={!!est.tax_exempt}
                                            style={{background:'transparent', border:`1px solid ${l.taxable ? 'var(--primary)' : 'var(--border)'}`,
                                                    borderRadius:4, cursor: est.tax_exempt ? 'not-allowed' : 'pointer', padding:'2px 8px',
                                                    color: l.taxable ? 'var(--primary)' : 'var(--text-muted)', opacity: est.tax_exempt ? 0.4 : 1}}>
                                        {l.taxable ? <i className="fas fa-check"></i> : '—'}
                                    </button>
                                ) : (l.taxable ? <i className="fas fa-check text-green"></i> : <span className="text-muted">—</span>)}
                            </td>
                            <td className="money" style={{fontWeight:600}}>{fmt(l.line_total)}</td>
                            {est.status !== 'converted' && (
                                <td style={{whiteSpace:'nowrap', textAlign:'right'}}>
                                    <button className="btn btn-outline btn-sm" onClick={() => moveLine(l.id, 'up')} title="Move up"
                                            disabled={(est.lines||[])[0]?.id === l.id}
                                            style={{padding:'4px 6px', marginRight:2}}><i className="fas fa-arrow-up"></i></button>
                                    <button className="btn btn-outline btn-sm" onClick={() => moveLine(l.id, 'down')} title="Move down"
                                            disabled={(est.lines||[]).slice(-1)[0]?.id === l.id}
                                            style={{padding:'4px 6px', marginRight:4}}><i className="fas fa-arrow-down"></i></button>
                                    <button className="btn btn-outline btn-sm" onClick={() => openEditLine(l)} title="Edit line"
                                            style={{padding:'4px 8px', marginRight:4}}><i className="fas fa-edit"></i></button>
                                    <button className="btn btn-outline btn-sm" onClick={() => deleteLine(l.id)} title="Delete line"
                                            style={{color:'var(--red)', borderColor:'var(--red)', padding:'4px 8px'}}><i className="fas fa-trash"></i></button>
                                </td>
                            )}
                        </tr>
                    ))}
                    </tbody></table>
                </div>
                <div style={{display:'flex', justifyContent:'flex-end', marginTop:16}}>
                    <div style={{width:300}}>
                        <div className="detail-row"><span className="detail-label">Labor</span><span className="detail-value money">{fmt(est.subtotal_labor)}</span></div>
                        <div className="detail-row"><span className="detail-label">Parts</span><span className="detail-value money">{fmt(est.subtotal_parts)}</span></div>
                        <div className="detail-row"><span className="detail-label">Paint</span><span className="detail-value money">{fmt(est.subtotal_paint)}</span></div>
                        <div className="detail-row">
                            <span className="detail-label" style={{display:'flex', alignItems:'center', gap:6}}>
                                Tax
                                {est.status !== 'converted' && (
                                    <label style={{fontSize:11, fontWeight:500, cursor:'pointer', color:'var(--text-muted)', display:'flex', alignItems:'center', gap:3}}>
                                        <input type="checkbox" checked={!!est.tax_exempt} onChange={toggleTaxExempt} style={{margin:0}} />
                                        Exempt
                                    </label>
                                )}
                            </span>
                            <span className="detail-value money">
                                {est.tax_exempt ? <span className="text-muted" style={{fontSize:13, fontWeight:500}}>EXEMPT</span> : fmt(est.tax_amount)}
                            </span>
                        </div>
                        {!est.tax_exempt && !est.tax_amount && (est.lines||[]).length > 0 && !(est.lines||[]).some(l => l.taxable) && (
                            <div className="text-sm text-muted" style={{padding:'4px 0 8px', fontStyle:'italic'}}>
                                <i className="fas fa-info-circle" style={{marginRight:4}}></i>
                                No lines marked taxable. Click the <b>Tax</b> column on a line to make it taxable.
                            </div>
                        )}
                        <div className="detail-row" style={{borderTop:'2px solid var(--primary)', paddingTop:8}}>
                            <span className="detail-label" style={{fontWeight:700,fontSize:15}}>Total</span>
                            <span className="detail-value money" style={{fontSize:18,color:'var(--primary)'}}>{fmt(est.total_amount)}</span>
                        </div>
                    </div>
                </div>
            </div>

            {/* ── Edit existing line ── */}
            <Modal open={!!editingLine} onClose={() => setEditingLine(null)} title={`Edit Line ${editingLine?.line_number || ''}`}>
                {editingLine && (() => {
                    const lt = editingLine.line_type;
                    const setF = (k, v) => setEditingLine({...editingLine, [k]: v});
                    return (
                        <div>
                            <div className="text-sm text-muted" style={{marginBottom:10}}>Type: <b>{lt}</b></div>
                            <div className="form-group" style={{marginBottom:10}}>
                                <label>Description</label>
                                <input value={editingLine.description||''} onChange={e => setF('description', e.target.value)} />
                            </div>
                            <div className="form-grid">
                                <div className="form-group"><label>Operation</label><input value={editingLine.operation||''} onChange={e => setF('operation', e.target.value)} /></div>
                                {lt === 'labor' && <>
                                    <div className="form-group"><label>Hours</label><input type="number" step="0.1" value={editingLine.labor_hours||0} onChange={e => setF('labor_hours', e.target.value)} /></div>
                                    <div className="form-group"><label>Rate $/hr</label><input type="number" step="0.01" value={editingLine.labor_rate||0} onChange={e => setF('labor_rate', e.target.value)} /></div>
                                </>}
                                {(lt === 'paint' || lt === 'refinish') && <>
                                    <div className="form-group"><label>Hours</label><input type="number" step="0.1" value={editingLine.paint_hours||0} onChange={e => setF('paint_hours', e.target.value)} /></div>
                                    <div className="form-group"><label>Rate $/hr</label><input type="number" step="0.01" value={editingLine.paint_rate||0} onChange={e => setF('paint_rate', e.target.value)} /></div>
                                </>}
                                {lt === 'part' && <>
                                    <div className="form-group"><label>Part #</label><input value={editingLine.part_number||''} onChange={e => setF('part_number', e.target.value)} /></div>
                                    <div className="form-group"><label>Type</label>
                                        <select value={editingLine.part_type||'OEM'} onChange={e => setF('part_type', e.target.value)}>
                                            <option value="OEM">OEM</option><option value="aftermarket">Aftermarket</option>
                                            <option value="used">Used</option><option value="reconditioned">Reconditioned</option>
                                            <option value="remanufactured">Reman</option>
                                        </select>
                                    </div>
                                    <div className="form-group"><label>Qty</label><input type="number" step="1" value={editingLine.quantity||1} onChange={e => setF('quantity', e.target.value)} /></div>
                                    <div className="form-group"><label>Price each</label><input type="number" step="0.01" value={editingLine.part_price||0} onChange={e => setF('part_price', e.target.value)} /></div>
                                    <div className="form-group"><label>Cost each</label><input type="number" step="0.01" value={editingLine.part_cost||0} onChange={e => setF('part_cost', e.target.value)} /></div>
                                </>}
                                {(lt === 'sublet' || lt === 'other') && (
                                    <div className="form-group"><label>Amount</label><input type="number" step="0.01" value={editingLine.part_price||0} onChange={e => setF('part_price', e.target.value)} /></div>
                                )}
                            </div>
                            <div className="form-group" style={{marginTop:10}}>
                                <label>Notes</label>
                                <textarea value={editingLine.notes||''} onChange={e => setF('notes', e.target.value)} />
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-outline" onClick={() => setEditingLine(null)}>Cancel</button>
                                <button className="btn btn-primary" onClick={saveLineEdit}><i className="fas fa-save"></i> Save</button>
                            </div>
                        </div>
                    );
                })()}
            </Modal>

            {/* ── Convert to RO: pick at least one worker ── */}
            <Modal open={showConvertModal} onClose={() => setShowConvertModal(false)} title="Convert to Repair Order">
                <div style={{padding:14, background:'rgba(234,179,8,0.08)', borderLeft:'3px solid #eab308', borderRadius:6, marginBottom:14, fontSize:13}}>
                    <i className="fas fa-info-circle" style={{color:'#eab308', marginRight:6}}></i>
                    Pick at least one worker to assign to this job before converting. Required so the system knows
                    who's responsible and so the workers can clock in to the new RO from their TecStation.
                </div>
                {convertError && (
                    <div style={{padding:10, background:'rgba(220,38,38,0.1)', border:'1px solid rgba(220,38,38,0.3)', borderRadius:6, color:'var(--danger)', marginBottom:12, fontSize:13}}>
                        <i className="fas fa-exclamation-triangle"></i> {convertError}
                    </div>
                )}
                <div style={{marginBottom:12}}>
                    {convertTeam.map((row, idx) => (
                        <div key={idx} style={{display:'grid', gridTemplateColumns:'2fr 2fr auto', gap:8, marginBottom:8, alignItems:'end'}}>
                            <div className="form-group" style={{margin:0}}>
                                <label>Worker {idx === 0 && <span style={{color:'var(--danger)'}}>*</span>}</label>
                                <select value={row.employee_id} onChange={e => updateConvertTeamRow(idx, 'employee_id', e.target.value)}>
                                    <option value="">— Select worker —</option>
                                    {employees.filter(e => e.is_active).map(e => (
                                        <option key={e.id} value={e.id}>{e.first_name} {e.last_name}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="form-group" style={{margin:0}}>
                                <label>Role {idx === 0 && <span style={{color:'var(--danger)'}}>*</span>}</label>
                                <input list="convert-role-options" value={row.role} placeholder="technician, painter, body tech…"
                                       onChange={e => updateConvertTeamRow(idx, 'role', e.target.value)} />
                            </div>
                            <button className="btn btn-outline btn-sm" onClick={() => removeConvertTeamRow(idx)}
                                    title="Remove" disabled={convertTeam.length === 1}
                                    style={{padding:'8px 10px', color:'var(--danger)', borderColor:'var(--danger)'}}>
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                    ))}
                    <datalist id="convert-role-options">
                        {['technician','painter','body tech','helper','detailer','parts','estimator'].map(r => <option key={r} value={r} />)}
                    </datalist>
                    <button className="btn btn-outline btn-sm" onClick={addConvertTeamRow}>
                        <i className="fas fa-plus"></i> Add another worker
                    </button>
                </div>
                <div className="modal-actions">
                    <button className="btn btn-outline" onClick={() => setShowConvertModal(false)} disabled={convertSaving}>
                        Cancel
                    </button>
                    <button className="btn btn-success" onClick={submitConvert} disabled={convertSaving}>
                        {convertSaving ? <><i className="fas fa-spinner fa-spin"></i> Converting…</> : <><i className="fas fa-arrow-right"></i> Create Repair Order</>}
                    </button>
                </div>
            </Modal>

            {/* ── Save-to-catalog prompt after a part with a part_number is added ── */}
            <Modal open={!!catalogPrompt} onClose={() => setCatalogPrompt(null)}
                   title={catalogPrompt?.existing ? 'Update price in catalog?' : 'Save part to catalog?'}>
                {catalogPrompt && (
                    <div>
                        <div style={{fontSize: 13, color: 'var(--text-muted)', marginBottom: 16, lineHeight: 1.5}}>
                            {catalogPrompt.existing
                                ? `You already have part #${catalogPrompt.part_number} in the catalog at ${fmt(catalogPrompt.existing.standard_price)}. The new price you just quoted is different — should I update the catalog so future estimates use the new price?`
                                : 'Saving this part to the catalog means next time you type this Part Number on a new estimate, the description and price auto-fill — no need to call the vendor again.'}
                        </div>
                        <div style={{padding:14, background:'var(--bg)', borderRadius:8, border:'1px solid var(--border)', marginBottom:16}}>
                            <div className="detail-row"><span className="detail-label">Part #</span><span className="detail-value" style={{fontFamily:'monospace', fontWeight:600}}>{catalogPrompt.part_number}</span></div>
                            <div className="detail-row"><span className="detail-label">Description</span><span className="detail-value">{catalogPrompt.description||'—'}</span></div>
                            {catalogPrompt.existing && (
                                <div className="detail-row"><span className="detail-label">Old Price</span><span className="detail-value money text-muted" style={{textDecoration:'line-through'}}>{fmt(catalogPrompt.existing.standard_price)}</span></div>
                            )}
                            <div className="detail-row"><span className="detail-label">{catalogPrompt.existing ? 'New Price' : 'Price'}</span><span className="detail-value money" style={{fontWeight:600, color:'var(--primary)'}}>{fmt(catalogPrompt.price)}</span></div>
                            {catalogPrompt.cost > 0 && (
                                <div className="detail-row"><span className="detail-label">Cost</span><span className="detail-value money">{fmt(catalogPrompt.cost)}</span></div>
                            )}
                        </div>
                        <div className="modal-actions">
                            <button className="btn btn-outline" onClick={() => setCatalogPrompt(null)}>
                                <i className="fas fa-times"></i> Skip
                            </button>
                            <button className="btn btn-primary" onClick={acceptCatalogSave}>
                                <i className="fas fa-database"></i> {catalogPrompt.existing ? 'Update Catalog' : 'Save to Catalog'}
                            </button>
                        </div>
                    </div>
                )}
            </Modal>
        </div>
    );
}
